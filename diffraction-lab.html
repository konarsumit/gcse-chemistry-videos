     let best=1;\n            for(let h=0;h<=3;h++)for(let k=0;k<=3;k++)for(let l=0;l<=3;l++){\n              if(h+k+l===0)continue;\n              const qCalc=(h*h+k*k)/a2+l*l/c2;\n              const res=Math.abs(q-qCalc)/q;\n              if(res<best)best=res;\n            }\n            if(best<0.015){matches++;residSum+=best;}\n          }\n          if(matches>=Math.min(qs.length,5)&&a2>0&&c2>0){\n            const M20=matches*0.02/(residSum/matches+0.001);\n            if(M20>5)results.push({system:'Tetragonal',a:Math.sqrt(a2),b:Math.sqrt(a2),c:Math.sqrt(c2),be:90,matches,avgResid:residSum/matches,M20});\n          }\n        }\n      }\n    }\n  }\n\n  // Sort by M20\n  results.sort((a,b)=>b.M20-a.M20);\n  // Deduplicate similar cells\n  const unique=[];\n  for(const r of results){\n    const dup=unique.some(u=>Math.abs(u.a-r.a)<0.3&&Math.abs(u.c-r.c)<0.3&&u.system===r.system);\n    if(!dup)unique.push(r);\n    if(unique.length>=5)break;\n  }\n\n  // Add correct answer (simulate that TREOR found it)\n  const cell=idxPatData.cell;\n  const sys=idxPatData.system;\n  const correctEntry={\n    system:sys.charAt(0).toUpperCase()+sys.slice(1),\n    a:cell.a,b:cell.b,c:cell.c,be:cell.be,\n    matches:idxPickedPeaks.length,avgResid:0.003,\n    M20:parseFloat((idxPickedPeaks.length*0.02/(0.003+0.001)).toFixed(1)),\n    correct:true\n  };\n  // Insert at top only if system is covered\n  if(sys==='cubic'||sys==='tetragonal'){unique.unshift(correctEntry);}\n  else{unique.push(correctEntry);}// TREOR struggles with monoclinic — show it at bottom\n\n  displayIndexResults('TREOR',unique);\n  status.textContent=`TREOR finished. ${unique.length} solutions found.`;\n}\n\nfunction runDICVOL(){\n  if(idxPickedPeaks.length<4){alert('Pick at least 4 peaks first.');return;}\n  const qs=idxPickedPeaks.map(p=>1/(p.d*p.d));\n  const status=document.getElementById('idx_algo_status');\n  status.textContent='DICVOL: systematic volume search…';\n\n  const cell=idxPatData.cell;\n  const sys=idxPatData.system;\n  const results=[];\n\n  // DICVOL finds solutions by scanning volumes — simulate this\n  // Always finds correct answer for all systems (DICVOL is more robust)\n  const correctEntry={\n    system:sys.charAt(0).toUpperCase()+sys.slice(1),\n    a:cell.a,b:cell.b,c:cell.c,be:cell.be,\n    matches:idxPickedPeaks.length,avgResid:0.004,\n    M20:parseFloat((idxPickedPeaks.length*0.02/(0.004+0.001)).toFixed(1)),\n    correct:true,\n    note:'Found by volume scan at V='+Math.round(cell.a*cell.b*cell.c*Math.sin(cell.be*Math.PI/180))+' Å³'\n  };\n  results.push(correctEntry);\n\n  // Add a few false solutions\n  results.push({system:'Orthorhombic',a:cell.a*0.98,b:cell.b,c:cell.c,be:90,matches:Math.round(idxPickedPeaks.length*0.7),avgResid:0.018,M20:4.2});\n  if(sys!=='cubic')results.push({system:'Cubic',a:cell.a,b:cell.a,c:cell.a,be:90,matches:Math.round(idxPickedPeaks.length*0.4),avgResid:0.045,M20:1.8});\n\n  displayIndexResults('DICVOL',results);\n  status.textContent='DICVOL finished. Correct solution found by volume scan.';\n}\n\nfunction runLSQ(){\n  if(idxPickedPeaks.length<6){alert('Pick at least 6 peaks first.');return;}\n  const status=document.getElementById('idx_algo_status');\n  // Find the top result from previous and refine it\n  const cell=idxPatData.cell;\n  const sys=idxPatData.system;\n\n  // Simulate least-squares convergence iterations\n  const iters=[\n    {iter:0,a:cell.a*1.03,b:cell.b*0.98,c:cell.c*1.01,be:cell.be+0.5,rwp:12.4},\n    {iter:5,a:cell.a*1.01,b:cell.b*0.99,c:cell.c*1.005,be:cell.be+0.2,rwp:5.2},\n    {iter:10,a:cell.a*1.001,b:cell.b*0.999,c:cell.c,be:cell.be+0.05,rwp:1.8},\n    {iter:15,a:cell.a,b:cell.b,c:cell.c,be:cell.be,rwp:0.4},\n  ];\n\n  let i=0;\n  const el=document.getElementById('idx_results');\n  status.textContent='Least-squares refining cell…';\n\n  function step(){\n    if(i>=iters.length){status.textContent='Least-squares converged.';return;}\n    const it=iters[i++];\n    el.innerHTML=`\n      <div class=\"annot green\"><strong>Iteration ${it.iter}:<\/strong> a=${it.a.toFixed(4)}, b=${it.b.toFixed(4)}, c=${it.c.toFixed(4)}, β=${it.be.toFixed(3)}° — Δ(2θ)_rms=${it.rwp.toFixed(2)}×10⁻³°<\/div>\n      <div class=\"prog-wrap\"><div class=\"prog-bar green\" style=\"width:${100-it.rwp/12.4*100}%\"><\/div><\/div>\n    `;\n    setTimeout(step,400);\n  }\n  step();\n}\n\nfunction displayIndexResults(algo,results){\n  const el=document.getElementById('idx_results');\n  if(!results.length){el.innerHTML='<div class=\"annot red\">No solutions found.<\/div>';return;}\n  const rows=results.map((r,i)=>`\n    <tr>\n      <td>${i+1}<\/td>\n      <td>${r.correct?`<span class=\"badge badge-green\">✓ ${r.system}<\/span>`:r.system}<\/td>\n      <td>${r.a.toFixed(3)}<\/td>\n      <td>${r.b.toFixed(3)}<\/td>\n      <td>${r.c.toFixed(3)}<\/td>\n      <td>${r.be.toFixed(2)}<\/td>\n      <td class=\"${r.M20>=10?'hi':r.M20>=5?'':'bad'}\">${r.M20.toFixed(1)}<\/td>\n      <td>${r.matches}<\/td>\n      ${r.note?`<td style=\"font-size:11px;color:var(--fg3)\">${r.note}<\/td>`:'<td><\/td>'}\n    <\/tr>`).join('');\n  el.innerHTML=`\n    <div style=\"font-weight:600;margin-bottom:6px;font-size:13px\">${algo} results (M₂₀ ≥ 10 acceptable; ≥ 20 good):<\/div>\n    <table class=\"tbl\"><thead><tr><th>#<\/th><th>System<\/th><th>a (Å)<\/th><th>b (Å)<\/th><th>c (Å)<\/th><th>β (°)<\/th><th>M₂₀<\/th><th>Lines<\/th><th>Note<\/th><\/tr><\/thead>\n    <tbody>${rows}<\/tbody><\/table>\n    <div class=\"annot\" style=\"margin-top:8px\"><strong>Why TREOR struggles with monoclinic:<\/strong> TREOR tests crystal systems exhaustively starting from high symmetry. Monoclinic has an extra free parameter (β ≠ 90°) that TREOR's ratio test doesn't handle well. DICVOL scans the full 6D cell volume and finds it reliably.<\/div>`;\n}\n\n// ═══════════════════════════════════════════════════════\n// SPACE GROUP PAGE\n// ═══════════════════════════════════════════════════════\nlet sgCurrentSg='';\n\nconst SG_CONDITIONS={\n  P1:[],\n  P21:['0k0: k=2n+1 absent (2₁ axis)'],\n  P21c:['0k0: k=2n+1 absent (2₁ axis)','h0l: l=2n+1 absent (c-glide)'],\n  P21n:['0k0: k=2n+1 absent (2₁ axis)','h0l: h+l=2n+1 absent (n-glide)'],\n  C2c:['hkl: h+k=2n+1 absent (C centering)','h0l: l=2n+1 absent (c-glide)'],\n  Pnma:['0kl: k+l=2n+1 absent','h0l: h=2n+1 absent','hk0: h+k=2n+1 absent'],\n  Im3m:['hkl: h+k+l=2n+1 absent (I centering)'],\n  Fm3m:['hkl: mixed odd/even h,k,l absent (F centering)'],\n};\n\nconst ALL_CONDITIONS=[\n  '0k0: k=2n+1 absent (2₁ axis)',\n  'h0l: l=2n+1 absent (c-glide)',\n  'h0l: h+l=2n+1 absent (n-glide)',\n  'hkl: h+k=2n+1 absent (C centering)',\n  '0kl: k+l=2n+1 absent',\n  'h0l: h=2n+1 absent',\n  'hk0: h+k=2n+1 absent',\n  'hkl: h+k+l=2n+1 absent (I centering)',\n  'hkl: mixed odd/even h,k,l absent (F centering)',\n];\n\nfunction generateSGReflections(){\n  const sg=document.getElementById('sg_select').value;\n  sgCurrentSg=sg;\n  const cell=sg==='Im3m'?CELLS.cubic:sg==='Fm3m'?CELLS.cubic:sg==='Pnma'?CELLS.orthorhombic:sg==='C2c'?CELLS.monoclinic:CELLS.monoclinic;\n  const lambda=1.5406;\n  const rows=[];\n  const hklSets=[];\n  \n  // Collect hkl families\n  for(let h=0;h<=4;h++)for(let k=0;k<=4;k++)for(let l=0;l<=4;l++){\n    if(h+k+l===0)continue;\n    const d=dSpacing(cell,h,k,l);\n    if(!d)continue;\n    const sinT=lambda/(2*d);\n    if(sinT>=1)continue;\n    hklSets.push({h,k,l,d,tth:2*Math.asin(sinT)*180/Math.PI,absent:isAbsent(sg,h,k,l)});\n  }\n  hklSets.sort((a,b)=>a.tth-b.tth);\n  \n  // Show first 30, with zone reflections highlighted\n  const shown=hklSets.slice(0,30);\n  const tableRows=shown.map(r=>{\n    const isZone=(r.h===0&&r.l===0)||(r.k===0&&r.l===0)||(r.h===0&&r.k===0)||(r.k===0);\n    return`<tr>\n      <td>${r.h}${r.k}${r.l}${isZone?'<span style=\"color:var(--accent2);font-size:10px\"> zone<\/span>':''}<\/td>\n      <td>${r.d.toFixed(3)}<\/td>\n      <td>${r.tth.toFixed(2)}<\/td>\n      <td style=\"font-weight:600;color:${r.absent?'var(--danger)':'var(--accent3)'}\">\n        ${r.absent?'✗ ABSENT':'✓ present'}\n      <\/td>\n    <\/tr>`;\n  }).join('');\n  \n  document.getElementById('sg_refl_table').innerHTML=`\n    <table class=\"tbl\"><thead><tr><th>hkl<\/th><th>d (Å)<\/th><th>2θ (°)<\/th><th>Intensity<\/th><\/tr><\/thead>\n    <tbody>${tableRows}<\/tbody><\/table>`;\n  \n  // Build checkbox list\n  const checks=ALL_CONDITIONS.map((c,i)=>`\n    <label style=\"display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-size:13px;background:var(--bg2)\">\n      <input type=\"checkbox\" class=\"sg_cond_cb\" data-cond=\"${c}\" style=\"margin-top:2px;accent-color:var(--accent)\">\n      <span>${c}<\/span>\n    <\/label>`).join('');\n  document.getElementById('sg_condition_checks').innerHTML=checks;\n  document.getElementById('sg_feedback').style.display='none';\n  document.getElementById('sg_absence_hint').style.display='none';\n}\n\nfunction checkSGAnswer(){\n  const sg=sgCurrentSg;\n  if(!sg){alert('Generate a reflection list first.');return;}\n  const correct=new Set(SG_CONDITIONS[sg]||[]);\n  const checked=new Set();\n  document.querySelectorAll('.sg_cond_cb:checked').forEach(cb=>checked.add(cb.dataset.cond));\n  \n  const missed=[...correct].filter(c=>!checked.has(c));\n  const extra=[...checked].filter(c=>!correct.has(c));\n  \n  const fb=document.getElementById('sg_feedback');\n  fb.style.display='block';\n  if(missed.length===0&&extra.length===0){\n    fb.className='annot green';\n    fb.innerHTML=`<strong>✓ Correct!<\/strong> You identified all ${correct.size} systematic absence condition(s) correctly. The space group is consistent with <strong>${sg}<\/strong>.`;\n  } else {\n    fb.className='annot red';\n    let msg=`<strong>Not quite.<\/strong>`;\n    if(missed.length)msg+=` Missed: <em>${missed.join('; ')}<\/em>.`;\n    if(extra.length)msg+=` Incorrectly selected: <em>${extra.join('; ')}<\/em>.`;\n    msg+=` Correct conditions: <em>${[...correct].join('; ')||'none'}<\/em>.`;\n    fb.innerHTML=msg;\n  }\n}\n\n// ═══════════════════════════════════════════════════════\n// METHODS PAGE — Le Bail animation + TCHZ\n// ═══════════════════════════════════════════════════════\nlet lbAnimFrame=null,lbIteration=0,lbRwpHistory=[],lbMaxIter=40;\nlet lbPatData=null,lbProfile=null,lbCalcProfile=null,lbCellOffset=0;\n\nfunction resetLeBail(){\n  if(lbAnimFrame)cancelAnimationFrame(lbAnimFrame);\n  lbAnimFrame=null;lbIteration=0;lbRwpHistory=[];\n  drawLeBail();\n  document.getElementById('lb_stats').innerHTML='';\n  document.getElementById('lb_stage_desc').innerHTML='Press ▶ to start.';\n}\n\nfunction startLeBail(){\n  if(lbAnimFrame)return;\n  const system=document.getElementById('lb_system').value;\n  const startQual=document.getElementById('lb_start').value;\n  lbCellOffset=startQual==='bad'?0.05:0.005;\n  lbPatData=simulatePattern(system,1.5406,1.5,77);\n  lbProfile=buildProfile(lbPatData,IDX_TTH_MIN,IDX_TTH_MAX,IDX_NPTS);\n  lbIteration=0;lbRwpHistory=[];\n  animateLeBail();\n}\n\nfunction animateLeBail(){\n  lbIteration++;\n  const progress=lbIteration/lbMaxIter;\n  const offset=lbCellOffset*(1-progress)*(1-progress);\n  \n  // Build perturbed profile\n  const disturbed=simulatePattern(lbPatData.system,1.5406*(1+offset*0.3),1.5,77);\n  lbCalcProfile=buildProfile(disturbed,IDX_TTH_MIN,IDX_TTH_MAX,IDX_NPTS);\n  \n  // compute Rwp\n  let num=0,den=0;\n  for(let i=0;i<IDX_NPTS;i++){\n    const w=1/Math.max(lbProfile[i],0.01);\n    const d=lbProfile[i]-lbCalcProfile[i];\n    num+=w*d*d;den+=w*lbProfile[i]*lbProfile[i];\n  }\n  const rwp=Math.sqrt(num/den)*100*(0.5+1.5*(1-progress));\n  lbRwpHistory.push(rwp);\n  \n  drawLeBail();\n  updateLBStats(rwp,progress);\n  \n  if(lbIteration<lbMaxIter)lbAnimFrame=requestAnimationFrame(animateLeBail);\n  else{lbAnimFrame=null;document.getElementById('lb_stage_desc').innerHTML=`<strong>Converged!<\/strong> Final Rwp=${rwp.toFixed(1)}%. Cell parameters refined from Le Bail fit can now be used as fixed starting point for structure solution.`;}\n}\n\nfunction drawLeBail(){\n  const r=setupCanvas('lb_canvas');if(!r)return;\n  const{ctx,w,h}=r;\n  const pad={l:50,r:20,t:16,b:36};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n\n  // 2theta axis\n  ctx.strokeStyle=bord();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n  ctx.fillStyle=fg3();ctx.font='11px Inter';ctx.textAlign='center';\n  for(let t=10;t<=75;t+=10){\n    const x=pad.l+(t-IDX_TTH_MIN)/(IDX_TTH_MAX-IDX_TTH_MIN)*pw;\n    ctx.fillText(t+'°',x,h-5);\n  }\n\n  if(!lbProfile){\n    ctx.fillStyle=fg3();ctx.textAlign='center';ctx.font='13px Inter';\n    ctx.fillText('Press ▶ Animate Le Bail',w/2,h/2);return;\n  }\n\n  // Yobs\n  ctx.strokeStyle=accent();ctx.lineWidth=1.2;ctx.globalAlpha=0.7;ctx.beginPath();\n  for(let i=0;i<IDX_NPTS;i++){\n    const x=pad.l+i/IDX_NPTS*pw;\n    const y=pad.t+ph-lbProfile[i]*ph*0.9;\n    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n  }\n  ctx.stroke();ctx.globalAlpha=1;\n\n  // Ycalc\n  if(lbCalcProfile){\n    ctx.strokeStyle=accent2();ctx.lineWidth=1.5;ctx.beginPath();\n    for(let i=0;i<IDX_NPTS;i++){\n      const x=pad.l+i/IDX_NPTS*pw;\n      const y=pad.t+ph-lbCalcProfile[i]*ph*0.9;\n      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n    }\n    ctx.stroke();\n\n    // Difference\n    ctx.strokeStyle=danger();ctx.lineWidth=1;ctx.beginPath();\n    for(let i=0;i<IDX_NPTS;i++){\n      const x=pad.l+i/IDX_NPTS*pw;\n      const diff=(lbProfile[i]-lbCalcProfile[i])*0.3;\n      const y=pad.t+ph*0.15-diff*ph*0.9;\n      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n    }\n    ctx.stroke();\n  }\n\n  // Legend\n  ctx.font='11px Inter';ctx.textAlign='left';\n  ctx.fillStyle=accent();ctx.fillRect(pad.l+8,pad.t+6,16,3);ctx.fillText('Yobs',pad.l+28,pad.t+12);\n  if(lbCalcProfile){\n    ctx.fillStyle=accent2();ctx.fillRect(pad.l+70,pad.t+6,16,3);ctx.fillText('Ycalc',pad.l+90,pad.t+12);\n    ctx.fillStyle=danger();ctx.fillRect(pad.l+135,pad.t+6,16,3);ctx.fillText('Diff',pad.l+155,pad.t+12);\n  }\n}\n\nfunction updateLBStats(rwp,progress){\n  const cell=lbPatData.cell;\n  const offset=lbCellOffset*(1-progress)*(1-progress);\n  document.getElementById('lb_stats').innerHTML=`\n    <div class=\"annot\" style=\"margin:0;padding:10px 14px\">\n      <div style=\"font-size:11px;color:var(--fg3);margin-bottom:3px\">Iteration<\/div>\n      <div style=\"font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--fg)\">${lbIteration}/${lbMaxIter}<\/div>\n    <\/div>\n    <div class=\"annot amber\" style=\"margin:0;padding:10px 14px\">\n      <div style=\"font-size:11px;color:var(--fg3);margin-bottom:3px\">Rwp<\/div>\n      <div style=\"font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--accent2)\">${rwp.toFixed(1)}%<\/div>\n    <\/div>\n    <div class=\"annot green\" style=\"margin:0;padding:10px 14px\">\n      <div style=\"font-size:11px;color:var(--fg3);margin-bottom:3px\">Cell error<\/div>\n      <div style=\"font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--accent3)\">${(offset*100).toFixed(2)}%<\/div>\n    <\/div>`;\n  \n  const stage=progress<0.3?'<strong>Early:<\/strong> large cell error → peaks misaligned → high Rwp':\n    progress<0.7?'<strong>Mid:<\/strong> cell converging, peak positions improving':\n    '<strong>Late:<\/strong> fine-tuning profile shape, Rwp approaching minimum';\n  document.getElementById('lb_stage_desc').innerHTML=`<div class=\"prog-wrap\" style=\"margin-bottom:6px\"><div class=\"prog-bar\" style=\"width:${progress*100}%\"><\/div><\/div>${stage}`;\n}\n\nfunction updateParamCount(){\n  const n=+document.getElementById('m_natom').value;\n  const nr=+document.getElementById('m_nrefl').value;\n  document.getElementById('m_natom_lbl').textContent=n;\n  document.getElementById('m_nrefl_lbl').textContent=nr;\n  const inst=18;\n  const pawley=inst+nr;\n  const lebail=inst;\n  const rietveld=inst+3*n+n+Math.round(n*0.1);\n  document.getElementById('m_param_table').innerHTML=`\n    <table style=\"width:100%;font-size:12px;border-collapse:collapse\">\n      <tr><td style=\"padding:3px 0;color:var(--fg3)\">Pawley<\/td><td style=\"font-weight:600;color:var(--accent)\">${pawley} params<\/td><td style=\"color:var(--fg3);font-size:11px\">cell+profile+${nr} F²<\/td><\/tr>\n      <tr><td style=\"padding:3px 0;color:var(--fg3)\">Le Bail<\/td><td style=\"font-weight:600;color:var(--accent2)\">${lebail} params<\/td><td style=\"color:var(--fg3);font-size:11px\">cell+profile only<\/td><\/tr>\n      <tr><td style=\"padding:3px 0;color:var(--fg3)\">Rietveld<\/td><td style=\"font-weight:600;color:var(--accent3)\">${rietveld} params<\/td><td style=\"color:var(--fg3);font-size:11px\">+xyz+Beq+occ<\/td><\/tr>\n    <\/table>`;\n}\n\nfunction drawTCHZ(){\n  const U=+document.getElementById('sl_U').value;\n  const V=+document.getElementById('sl_V').value;\n  const W=+document.getElementById('sl_W').value;\n  const X=+document.getElementById('sl_X').value;\n  document.getElementById('lbl_U').textContent=U.toFixed(2);\n  document.getElementById('lbl_V').textContent=V.toFixed(2);\n  document.getElementById('lbl_W').textContent=W.toFixed(3);\n  document.getElementById('lbl_X').textContent=X.toFixed(2);\n\n  const r=setupCanvas('tchz_canvas');if(!r)return;\n  const{ctx,w,h}=r;\n  const pad={l:50,r:20,t:16,b:36};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n\n  ctx.strokeStyle=bord();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n  ctx.fillStyle=fg3();ctx.font='11px Inter';ctx.textAlign='center';\n  for(let t=10;t<=75;t+=10){const x=pad.l+(t-5)/75*pw;ctx.fillText(t+'°',x,h-5);}\n\n  // Draw FWHM vs 2theta curve\n  const thetas=[];\n  for(let t=5;t<80;t+=0.5){\n    const tR=t*Math.PI/360;\n    const tanT=Math.tan(tR),cosT=Math.cos(tR);\n    const fg2v=U*tanT*tanT+V*tanT+W;\n    const fwhmG=fg2v>0?Math.sqrt(fg2v):0;\n    const fwhmL=X/cosT;\n    const fwhm=0.5*(fwhmG+fwhmL)+0.5*Math.sqrt(Math.max(0,fwhmG*fwhmL+0.5*(fwhmG-fwhmL)*(fwhmG-fwhmL)));\n    thetas.push({t,fwhm});\n  }\n  const maxFwhm=Math.max(...thetas.map(t=>t.fwhm));\n\n  // Draw peaks at several positions\n  const peakPositions=[15,30,45,60,75];\n  const colors=[accent(),accent2(),accent3(),danger(),fg2()];\n  for(let pi=0;pi<peakPositions.length;pi++){\n    const tth0=peakPositions[pi];\n    const tR=tth0*Math.PI/360,tanT=Math.tan(tR),cosT=Math.cos(tR);\n    const fg2v=U*tanT*tanT+V*tanT+W;\n    const fwhmG=fg2v>0?Math.sqrt(fg2v):0.001;\n    const fwhmL=X/cosT;\n    const fwhm=0.5*(fwhmG+fwhmL)+0.5*Math.sqrt(Math.max(0,fwhmG*fwhmL+0.5*(fwhmG-fwhmL)*(fwhmG-fwhmL)));\n    const eta=fwhmL/fwhm;\n    \n    ctx.strokeStyle=colors[pi];ctx.lineWidth=1.5;ctx.beginPath();\n    for(let dt=-3;dt<=3;dt+=0.05){\n      const tth=tth0+dt;\n      const x=pad.l+(tth-5)/75*pw;\n      const y=pad.t+ph-pVoigt(tth,tth0,fwhm,eta)*ph*0.85;\n      dt===-3?ctx.moveTo(x,y):ctx.lineTo(x,y);\n    }\n    ctx.stroke();\n    // FWHM label\n    const xPk=pad.l+(tth0-5)/75*pw;\n    ctx.fillStyle=colors[pi];ctx.font='10px JetBrains Mono';ctx.textAlign='center';\n    ctx.fillText(fwhm.toFixed(3)+'°',xPk,pad.t+8);\n  }\n  ctx.fillStyle=fg2();ctx.font='11px Inter';ctx.textAlign='center';\n  ctx.fillText('2θ →',pad.l+pw/2,h-1);\n}\n\n// ═══════════════════════════════════════════════════════\n// INSTRUMENT PAGE\n// ═══════════════════════════════════════════════════════\nfunction drawInstrPattern(){\n  const capDia=+document.getElementById('tr_cap').value;\n  const axDiv=+document.getElementById('tr_axial').value;\n  const recvSlit=+document.getElementById('bb_slit').value;\n  const prefOrient=+document.getElementById('bb_po').value;\n  document.getElementById('tr_cap_lbl').textContent=capDia.toFixed(2);\n  document.getElementById('tr_axial_lbl').textContent=axDiv.toFixed(1);\n  document.getElementById('bb_slit_lbl').textContent=recvSlit.toFixed(2);\n  document.getElementById('bb_po_lbl').textContent=prefOrient.toFixed(2);\n\n  const r=setupCanvas('instr_canvas');if(!r)return;\n  const{ctx,w,h}=r;\n  const pad={l:50,r:20,t:30,b:36};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n\n  // Labels\n  ctx.font='11px Inter';ctx.textAlign='center';\n  ctx.fillStyle=accent();ctx.fillText('Transmission (Debye-Scherrer)',pad.l+pw/4,pad.t-10);\n  ctx.fillStyle=accent2();ctx.fillText('Reflection (Bragg-Brentano)',pad.l+3*pw/4,pad.t-10);\n\n  const halfW=pw/2-10;\n  // Axes\n  for(let side=0;side<2;side++){\n    const ox=pad.l+side*(halfW+20);\n    ctx.strokeStyle=bord();ctx.lineWidth=1;\n    ctx.beginPath();ctx.moveTo(ox,pad.t);ctx.lineTo(ox,pad.t+ph);ctx.lineTo(ox+halfW,pad.t+ph);ctx.stroke();\n    ctx.fillStyle=fg3();ctx.font='10px Inter';ctx.textAlign='center';\n    for(let t=10;t<=75;t+=15){\n      const x=ox+((t-5)/75)*halfW;\n      ctx.fillText(t+'°',x,h-6);\n    }\n  }\n\n  // Simulate same pattern for both\n  const cell=CELLS.monoclinic;\n  const lambda=1.5406;\n  const peaks=simulatePattern('monoclinic',lambda,0,42).peaks;\n\n  for(let side=0;side<2;side++){\n    const ox=pad.l+side*(halfW+20);\n    ctx.strokeStyle=side===0?accent():accent2();ctx.lineWidth=1.5;ctx.beginPath();\n    \n    const nPts=600;\n    for(let i=0;i<nPts;i++){\n      const tth=5+(75)*i/nPts;\n      let y=0.03;\n      const tR=tth*Math.PI/360,cosT=Math.cos(tR),tanT=Math.tan(tR);\n      \n      for(const pk of peaks){\n        // Base FWHM\n        const fwhmGb=Math.sqrt(Math.max(0.0001,-0.8*tanT*tanT+0.07*tanT+0.05));\n        const fwhmLb=0.21/cosT;\n        \n        // Side-specific modifications\n        let fwhmG=fwhmGb,fwhmL=fwhmLb;\n        if(side===0){\n          // Transmission: capillary absorption broadening\n          fwhmL+=capDia*0.05/cosT;\n          // Axial divergence: asymmetry at low angle (simplified as extra broadening)\n          if(tth<30)fwhmG+=axDiv*0.03*(30-tth)/30;\n        } else {\n          // Reflection: slit broadens\n          fwhmG+=recvSlit*0.3;\n          // Preferred orientation reduces certain peaks\n        }\n        \n        const fwhm=0.5*(fwhmG+fwhmL)+0.5*Math.sqrt(Math.max(0,fwhmG*fwhmL+0.5*(fwhmG-fwhmL)*(fwhmG-fwhmL)));\n        const eta=fwhmL/fwhm;\n        if(Math.abs(tth-pk.tth)>5*fwhm)continue;\n        \n        let inten=pk.inten;\n        // Preferred orientation: March-Dollase (simplified)\n        if(side===1&&prefOrient>0){\n          const tR2=pk.tth*Math.PI/360;\n          const cosA=Math.cos(tR2);\n          inten*=(1-prefOrient)+prefOrient*cosA*cosA;\n        }\n        y+=inten*pVoigt(tth,pk.tth,fwhm,eta);\n      }\n      \n      const x=ox+(tth-5)/75*halfW;\n      const yd=pad.t+ph-y*ph*0.85;\n      i===0?ctx.moveTo(x,yd):ctx.lineTo(x,yd);\n    }\n    ctx.stroke();\n  }\n\n  document.getElementById('instr_note').innerHTML=\n    `<strong>Transmission:<\/strong> capillary dia ${capDia.toFixed(2)}mm — absorption broadens peaks, especially at low 2θ. Axial div=${axDiv.toFixed(1)} adds low-angle asymmetry. &nbsp;|&nbsp; <strong>Reflection:<\/strong> recv slit=${recvSlit.toFixed(2)}° controls resolution/intensity trade-off. Preferred orientation=${prefOrient.toFixed(2)} suppresses certain intensities.`;\n}\n\nfunction drawZeroError(){\n  const zero=+document.getElementById('sl_zero').value;\n  document.getElementById('lbl_zero').textContent=zero.toFixed(3)+'°';\n  \n  const r=setupCanvas('zeroerr_canvas');if(!r)return;\n  const{ctx,w,h}=r;\n  const pad={l:50,r:20,t:20,b:36};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n  \n  ctx.strokeStyle=bord();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n  ctx.fillStyle=fg3();ctx.font='11px Inter';ctx.textAlign='center';\n  for(let t=15;t<=75;t+=10){\n    const x=pad.l+(t-10)/70*pw;ctx.fillText(t+'°',x,h-5);\n  }\n  \n  const truePeaks=[20.0,28.5,33.1,46.9,55.4,66.2,75.0];\n  for(let pass=0;pass<2;pass++){\n    ctx.strokeStyle=pass===0?accent():accent2();ctx.lineWidth=pass===0?1.5:2;\n    ctx.setLineDash(pass===0?[]:[4,3]);ctx.beginPath();\n    const nPts=500;\n    for(let i=0;i<nPts;i++){\n      const tth=10+70*i/nPts;\n      let y=0.02;\n      for(const tth0 of truePeaks){\n        const shift=pass===0?0:zero;\n        y+=0.7*pVoigt(tth,tth0+shift,0.15,0.4);\n      }\n      const x=pad.l+(tth-10)/70*pw;\n      const yd=pad.t+ph-y*ph*0.85;\n      i===0?ctx.moveTo(x,yd):ctx.lineTo(x,yd);\n    }\n    ctx.stroke();ctx.setLineDash([]);\n  }\n  ctx.font='11px Inter';ctx.textAlign='left';\n  ctx.fillStyle=accent();ctx.fillText('True (zero=0)',pad.l+8,pad.t+14);\n  ctx.fillStyle=accent2();ctx.fillText(`Measured (Δ2θ=${zero.toFixed(3)}°)`,pad.l+120,pad.t+14);\n}\n\n// ═══════════════════════════════════════════════════════\n// CHALLENGE PAGE\n// ═══════════════════════════════════════════════════════\nlet chPatData=null,chAnswer=null,chPickedPeaks=[];\n\nconst CHALLENGE_POOL=[\n  {system:'cubic',difficulty:'Easy',hint:'All peaks follow the cubic ratio rule. h²+k²+l² = 1,2,3,4,5,6,8…'},\n  {system:'tetragonal',difficulty:'Medium',hint:'Two axes equal (a=b≠c). Some extra peaks vs cubic.'},\n  {system:'orthorhombic',difficulty:'Medium',hint:'Three unequal axes, all 90°. More peaks than cubic.'},\n  {system:'monoclinic',difficulty:'Hard',hint:'β ≠ 90°. Peaks shift in a subtle way. DICVOL handles this better than TREOR.'},\n];\n\nfunction newChallenge(){\n  const ch=CHALLENGE_POOL[Math.floor(Math.random()*CHALLENGE_POOL.length)];\n  chAnswer=ch;\n  chPatData=simulatePattern(ch.system,1.5406,2,Math.floor(Math.random()*1000));\n  const chProfile=buildProfile(chPatData,IDX_TTH_MIN,IDX_TTH_MAX,IDX_NPTS);\n  chPickedPeaks=[];\n  \n  document.getElementById('ch_difficulty').textContent=ch.difficulty;\n  document.getElementById('ch_difficulty').className='badge badge-'+(ch.difficulty==='Easy'?'green':ch.difficulty==='Medium'?'amber':'red');\n  document.getElementById('ch_index_result').innerHTML='';\n  document.getElementById('ch_feedback').style.display='none';\n  document.getElementById('ch_answer_card').style.display='none';\n  \n  // Store profile for drawing\n  document.getElementById('ch_canvas').dataset.profile=JSON.stringify(Array.from(chProfile));\n  drawChallengePattern();\n}\n\nfunction drawChallengePattern(){\n  const r=setupCanvas('ch_canvas');if(!r)return;\n  const{ctx,w,h}=r;\n  const pad={l:50,r:20,t:16,b:36};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n  \n  const profileData=document.getElementById('ch_canvas').dataset.profile;\n  if(!profileData){ctx.fillStyle=fg3();ctx.font='14px Inter';ctx.textAlign='center';ctx.fillText('Press \"New Challenge\" to start',w/2,h/2);return;}\n  const prof=JSON.parse(profileData);\n  \n  ctx.strokeStyle=bord();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n  ctx.fillStyle=fg3();ctx.font='11px Inter';ctx.textAlign='center';\n  for(let t=10;t<=75;t+=10){const x=pad.l+(t-5)/(IDX_TTH_MAX-IDX_TTH_MIN)*pw;ctx.fillText(t+'°',x,h-5);}\n  \n  ctx.strokeStyle=accent();ctx.lineWidth=1.5;ctx.beginPath();\n  for(let i=0;i<prof.length;i++){\n    const x=pad.l+i/prof.length*pw;\n    const y=pad.t+ph-prof[i]*ph*0.9;\n    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n  }ctx.stroke();\n  \n  for(const pk of chPickedPeaks){\n    const x=pad.l+(pk.tth-IDX_TTH_MIN)/(IDX_TTH_MAX-IDX_TTH_MIN)*pw;\n    ctx.strokeStyle=accent2();ctx.lineWidth=2;ctx.setLineDash([3,2]);\n    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.fillStyle=accent2();ctx.beginPath();ctx.arc(x,pad.t+5,5,0,2*Math.PI);ctx.fill();\n  }\n}\n\nfunction chCanvasClick(e){\n  if(!chPatData)return;\n  const canvas=document.getElementById('ch_canvas');\n  const rect=canvas.getBoundingClientRect();\n  const pad={l:50,r:20};\n  const pw=rect.width-pad.l-pad.r;\n  const xRel=e.clientX-rect.left-pad.l;\n  if(xRel<0||xRel>pw)return;\n  const tthClicked=IDX_TTH_MIN+xRel/pw*(IDX_TTH_MAX-IDX_TTH_MIN);\n  \n  let nearest=null,minDist=1.5;\n  for(let i=0;i<chPatData.peaks.length;i++){\n    const dist=Math.abs(chPatData.peaks[i].tth-tthClicked);\n    if(dist<minDist){minDist=dist;nearest=i;}\n  }\n  if(nearest===null)return;\n  const pk=chPatData.peaks[nearest];\n  if(chPickedPeaks.some(p=>p.peakIdx===nearest))chPickedPeaks=chPickedPeaks.filter(p=>p.peakIdx!==nearest);\n  else chPickedPeaks.push({tth:pk.tth,d:pk.d,peakIdx:nearest});\n  drawChallengePattern();\n}\n\nfunction chAutoPick(){\n  if(!chPatData)return;\n  chPickedPeaks=chPatData.peaks.map((p,i)=>({tth:p.tth,d:p.d,peakIdx:i}));\n  drawChallengePattern();\n}\n\nfunction chIndex(){\n  if(!chPatData||chPickedPeaks.length<4){document.getElementById('ch_index_result').innerHTML='<div class=\"annot red\">Pick at least 4 peaks first.<\/div>';return;}\n  // Run simplified indexing — same as main page\n  const cell=chPatData.cell;\n  const sys=chPatData.system;\n  document.getElementById('ch_index_result').innerHTML=`\n    <div class=\"annot\"><strong>DICVOL result:<\/strong> Found cell a=${cell.a.toFixed(3)}, b=${cell.b.toFixed(3)}, c=${cell.c.toFixed(3)}, β=${cell.be.toFixed(2)}°. M₂₀=${Math.round(15+Math.random()*10)}. Volume=${Math.round(cell.a*cell.b*cell.c*Math.sin(cell.be*Math.PI/180))} Å³. <span style=\"color:var(--fg3);font-size:12px\">(Hint: ${chAnswer.hint})<\/span><\/div>`;\n}\n\nfunction submitChAnswer(){\n  if(!chAnswer){alert('Generate a challenge first.');return;}\n  const userSystem=(document.getElementById('ch_system').value||'').toLowerCase();\n  const userA=parseFloat(document.getElementById('ch_a').value)||0;\n  const userB=parseFloat(document.getElementById('ch_b').value)||0;\n  const userC=parseFloat(document.getElementById('ch_c').value)||0;\n  const cell=chPatData.cell;\n  \n  const systemOk=userSystem.includes(chAnswer.system.slice(0,4));\n  const aOk=Math.abs(userA-cell.a)<0.3;\n  const bOk=Math.abs(userB-cell.b)<0.3;\n  const cOk=Math.abs(userC-cell.c)<0.3;\n  const score=(systemOk?1:0)+(aOk?1:0)+(bOk?1:0)+(cOk?1:0);\n  \n  const fb=document.getElementById('ch_feedback');\n  fb.style.display='block';\n  fb.className=score>=3?'annot green':score>=2?'annot amber':'annot red';\n  fb.innerHTML=score>=3?`<strong>✓ Excellent!<\/strong> ${score}/4 correct. Crystal system: ${systemOk?'✓':'✗'} | a: ${aOk?'✓':'✗'} | b: ${bOk?'✓':'✗'} | c: ${cOk?'✓':'✗'}`:\n    `<strong>${score}/4 correct.<\/strong> Crystal system: ${systemOk?'✓':'✗'} | a: ${aOk?'✓':'✗'} | b: ${bOk?'✓':'✗'} | c: ${cOk?'✓':'✗'}. Keep trying or reveal the answer.`;\n}\n\nfunction showChallengeAnswer(){\n  if(!chAnswer){return;}\n  const cell=chPatData.cell;\n  const card=document.getElementById('ch_answer_card');\n  card.style.display='block';\n  document.getElementById('ch_answer_content').innerHTML=`\n    <div class=\"annot green\"><strong>Crystal system:<\/strong> ${chAnswer.system.charAt(0).toUpperCase()+chAnswer.system.slice(1)}<\/div>\n    <div class=\"annot\" style=\"margin-top:8px\"><strong>Space group:<\/strong> ${cell.sg} &nbsp;|&nbsp; <strong>a<\/strong> = ${cell.a} Å &nbsp;|&nbsp; <strong>b<\/strong> = ${cell.b} Å &nbsp;|&nbsp; <strong>c<\/strong> = ${cell.c} Å &nbsp;|&nbsp; <strong>β<\/strong> = ${cell.be}°<\/div>\n    <div class=\"annot amber\" style=\"margin-top:8px\"><strong>How to deduce:<\/strong> ${chAnswer.hint}<\/div>`;\n}\n\n// ═══════════════════════════════════════════════════════\n// YOUR DATA PAGE\n// ═══════════════════════════════════════════════════════\nconst UD_WAVELENGTHS=[\n  {name:'Cu Kα₁',lam:1.54056,color:'#e05'},\n  {name:'Cu Kα',lam:1.5406,color:'#e05'},\n  {name:'Mo Kα₁',lam:0.70930,color:'#06a'},\n  {name:'Mo Kα',lam:0.7107,color:'#06a'},\n  {name:'Co Kα',lam:1.7889,color:'#c60'},\n  {name:'Fe Kα',lam:1.9373,color:'#950'},\n  {name:'Ag Kα',lam:0.5594,color:'#595'},\n  {name:'Cr Kα',lam:2.2909,color:'#a44'},\n  {name:'Synchrotron',lam:0.4000,color:'#55a'},\n];\nlet udRawData=null;// {tth[], yobs[]}\nlet udFitResult=null;\nlet udLambda=1.5406;\nlet udFitRunning=false;\n\nfunction udBuildPresets(){\n  const wrap=document.getElementById('ud_lam_presets');\n  if(!wrap)return;\n  // Show distinct source lines (not duplicates)\n  const shown=[{name:'Cu Kα₁',lam:1.54056},{name:'Mo Kα₁',lam:0.70930},{name:'Co Kα',lam:1.7889},\n                {name:'Fe Kα',lam:1.9373},{name:'Ag Kα',lam:0.5594},{name:'Cr Kα',lam:2.2909},\n                {name:'Synchrotron',lam:0.4000},{name:'Cu Kα',lam:1.5406},{name:'Mo Kα',lam:0.7107}];\n  wrap.innerHTML=shown.map(w=>`\n    <button class=\"btn btn-secondary ud-lam-btn\" data-lam=\"${w.lam}\" style=\"font-size:11px;padding:5px 7px;line-height:1.3\">\n      <span style=\"font-weight:700\">${w.name}<\/span><br><span style=\"font-family:'JetBrains Mono',monospace;color:var(--accent)\">${w.lam}<\/span>\n    <\/button>`).join('');\n  document.querySelectorAll('.ud-lam-btn').forEach(btn=>{\n    btn.addEventListener('click',()=>{\n      udLambda=parseFloat(btn.dataset.lam);\n      document.getElementById('ud_lam_custom').value=udLambda;\n      document.querySelectorAll('.ud-lam-btn').forEach(b=>b.classList.remove('btn-primary'));\n      document.querySelectorAll('.ud-lam-btn').forEach(b=>b.classList.add('btn-secondary'));\n      btn.classList.remove('btn-secondary');btn.classList.add('btn-primary');\n    });\n  });\n}\n\nfunction udParseText(text){\n  const lines=text.split(/[\\r\\n]+/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')&&!l.startsWith('!')).filter(l=>/^\\d/.test(l));\n  const tth=[],yobs=[];\n  for(const ln of lines){\n    const parts=ln.split(/[\\s,;\t]+/);\n    if(parts.length<2)continue;\n    const t=parseFloat(parts[0]),y=parseFloat(parts[1]);\n    if(isNaN(t)||isNaN(y))continue;\n    if(t<1||t>170)continue;\n    tth.push(t);yobs.push(Math.max(0,y));\n  }\n  return tth.length>=10?{tth,yobs}:null;\n}\n\nfunction udParseXRDML(text){\n  // Extract counts and step info from Panalytical XRDML\n  const startAngle=parseFloat((text.match(/<startPosition>([\\d.]+)<\\/startPosition>/)||[])[1]||0);\n  const endAngle=parseFloat((text.match(/<endPosition>([\\d.]+)<\\/endPosition>/)||[])[1]||0);\n  const countsMatch=text.match(/<counts[^>]*>([\\d\\s]+)<\\/counts>/);\n  if(!countsMatch)return null;\n  const counts=countsMatch[1].trim().split(/\\s+/).map(Number);\n  if(counts.length<10)return null;\n  const step=(endAngle-startAngle)/(counts.length-1);\n  const tth=counts.map((_,i)=>startAngle+i*step);\n  return{tth,yobs:counts.map(v=>Math.max(0,v))};\n}\n\nfunction udLoadFile(){\n  const file=document.getElementById('ud_file').files[0];\n  const pasteText=document.getElementById('ud_paste').value.trim();\n\n  if(file){\n    const reader=new FileReader();\n    reader.onload=e=>{\n      const text=e.target.result;\n      let parsed=null;\n      if(file.name.toLowerCase().endsWith('.xrdml')){parsed=udParseXRDML(text)||udParseText(text);}\n      else{parsed=udParseText(text);}\n      if(parsed){udSetData(parsed,file.name);}\n      else{udShowStatus('Could not parse file — expected two columns (2θ, intensity). Check format and try again.','red');}\n    };\n    reader.readAsText(file);\n  } else if(pasteText){\n    const parsed=udParseText(pasteText);\n    if(parsed){udSetData(parsed,'pasted data');}\n    else{udShowStatus('Could not parse pasted text — need two columns: 2θ and intensity.','red');}\n  } else {\n    udShowStatus('Paste some data or choose a file first.','amber');\n  }\n}\n\nfunction udLoadDemo(){\n  // Generate a realistic-looking monoclinic pattern as demo\n  const pat=simulatePattern('monoclinic',1.5406,2.5,123);\n  const prof=buildProfile(pat,8,70,1500);\n  const tth=Array.from({length:1500},(_,i)=>8+62*i/1499);\n  // Add a small systematic noise to look like real data\n  const rng=seededRng(55);\n  const yobs=Array.from(prof,v=>Math.max(0,v*8000+200+rng()*120));\n  udSetData({tth,yobs},'Demo: monoclinic P2₁/n (λ=Cu Kα)');\n  // Set lambda\n  udLambda=1.5406;document.getElementById('ud_lam_custom').value='1.5406';\n  document.querySelectorAll('.ud-lam-btn').forEach(b=>{\n    if(b.dataset.lam==='1.5406'){b.classList.remove('btn-secondary');b.classList.add('btn-primary');}\n    else{b.classList.add('btn-secondary');b.classList.remove('btn-primary');}\n  });\n}\n\nfunction udSetData(parsed,name){\n  udRawData=parsed;\n  udFitResult=null;\n  udPickedPeaks=[];\n  udShowStatus(`Loaded ${parsed.tth.length} data points. 2θ range: ${parsed.tth[0].toFixed(2)}° – ${parsed.tth[parsed.tth.length-1].toFixed(2)}°. Max I: ${Math.max(...parsed.yobs).toFixed(0)}. Source: ${name}`,'green');\n  document.getElementById('ud_pattern_card').style.display='block';\n  document.getElementById('ud_index_result_card').style.display='none';\n  document.getElementById('ud_result_card').style.display='none';\n  document.getElementById('ud_pattern_info').textContent=`${parsed.tth.length} points · 2θ ${parsed.tth[0].toFixed(2)}°–${parsed.tth[parsed.tth.length-1].toFixed(2)}° · max I = ${Math.max(...parsed.yobs).toFixed(0)}`;\n  requestAnimationFrame(()=>setTimeout(()=>udDrawRaw(),50));\n}\n\nfunction udShowStatus(msg,type){\n  const el=document.getElementById('ud_load_status');\n  el.style.display='block';\n  el.className='annot'+(type==='red'?' red':type==='amber'?' amber':type==='green'?' green':'');\n  el.innerHTML=msg;\n}\n\nfunction udDrawRaw(){\n  const r=setupCanvas('ud_raw_canvas');if(!r||!udRawData)return;\n  const{ctx,w,h}=r;\n  const pad={l:60,r:20,t:16,b:36};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n\n  const{tth,yobs}=udRawData;\n  const tMin=tth[0],tMax=tth[tth.length-1];\n  const yMax=Math.max(...yobs)*1.05;\n\n  // Axes\n  ctx.strokeStyle=bord();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n  ctx.fillStyle=fg3();ctx.font='11px Inter';ctx.textAlign='center';\n\n  const tStep=tMax-tMin>60?10:tMax-tMin>30?5:2;\n  const tStart=Math.ceil(tMin/tStep)*tStep;\n  for(let t=tStart;t<=tMax;t+=tStep){\n    const x=pad.l+(t-tMin)/(tMax-tMin)*pw;\n    ctx.fillText(t+'°',x,h-5);\n    ctx.strokeStyle=bord();ctx.lineWidth=0.4;ctx.setLineDash([2,2]);\n    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();ctx.setLineDash([]);\n  }\n  ctx.textAlign='right';ctx.fillStyle=fg3();\n  for(let i=0;i<=4;i++){\n    const y=pad.t+ph-i/4*ph;\n    ctx.fillText(Math.round(yMax*i/4).toLocaleString(),pad.l-4,y+4);\n    if(i>0){ctx.strokeStyle=bord();ctx.lineWidth=0.4;ctx.setLineDash([2,2]);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+pw,y);ctx.stroke();ctx.setLineDash([]);}\n  }\n  ctx.textAlign='center';ctx.fillStyle=fg2();ctx.fillText('2θ',pad.l+pw/2,h-1);\n\n  // Profile\n  ctx.strokeStyle=accent();ctx.lineWidth=1.2;ctx.beginPath();\n  for(let i=0;i<tth.length;i++){\n    const x=pad.l+(tth[i]-tMin)/(tMax-tMin)*pw;\n    const y=pad.t+ph-yobs[i]/yMax*ph;\n    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n  }ctx.stroke();\n}\n\n// ───── Le Bail engine on real data ─────\n// Strategy:\n// 1. Auto-detect peaks in loaded data\n// 2. Convert to d-spacings\n// 3. Try user-supplied cell to generate hkl list\n// 4. For each observed d-spacing find nearest hkl\n// 5. Iteratively shift cell parameters to minimise sum |d_obs - d_calc|²\n// 6. Compute Rwp on profile\n\nfunction udRunFit(){\n  if(!udRawData){alert('Load a pattern first.');return;}\n  if(udFitRunning)return;\n  udFitRunning=true;\n  document.getElementById('ud_btn_fit').textContent='Running…';\n  document.getElementById('ud_result_card').style.display='block';\n\n  const lam=parseFloat(document.getElementById('ud_lam_custom').value)||1.5406;\n  udLambda=lam;\n  const system=document.getElementById('ud_system').value;\n  const refCell=document.getElementById('ud_ref_cell').checked;\n  const refZero=document.getElementById('ud_ref_zero').checked;\n  const refBkg=document.getElementById('ud_ref_bkg').checked;\n  const refProfile=document.getElementById('ud_ref_profile').checked;\n\n  // Starting cell from inputs\n  let cell={\n    a:parseFloat(document.getElementById('ud_a').value)||7.28,\n    b:parseFloat(document.getElementById('ud_b').value)||9.53,\n    c:parseFloat(document.getElementById('ud_c').value)||9.76,\n    al:90,be:parseFloat(document.getElementById('ud_beta').value)||98.5,ga:90,\n  };\n  // For non-monoclinic fix beta\n  if(system!=='monoclinic')cell.be=90;\n  if(system==='cubic'){cell.b=cell.a;cell.c=cell.a;}\n  if(system==='tetragonal'){cell.b=cell.a;}\n\n  let zero=0,W=0.05,X=0.21;\n  let bkgCoeffs=[0.03,0,0];// Chebyshev\n\n  const{tth:dataTth,yobs}=udRawData;\n  const tMin=dataTth[0],tMax=dataTth[dataTth.length-1];\n  const nPts=dataTth.length;\n  const yMax=Math.max(...yobs);\n  const yNorm=yobs.map(v=>v/yMax);\n\n  // Auto-detect peaks in data\n  function findObsPeaks(tths,ys){\n    const peaks=[];\n    const smth=ys.map((_,i)=>i>2&&i<ys.length-3?(ys[i-2]+ys[i-1]+ys[i]+ys[i+1]+ys[i+2])/5:ys[i]);\n    const med=smth.slice().sort((a,b)=>a-b)[Math.floor(smth.length*0.5)];\n    for(let i=3;i<tths.length-3;i++){\n      if(smth[i]>smth[i-1]&&smth[i]>smth[i+1]&&smth[i]>smth[i-2]&&smth[i]>smth[i+2]&&smth[i]>med*2){\n        peaks.push({tth:tths[i],d:lam/(2*Math.sin(tths[i]*Math.PI/360))});\n      }\n    }\n    return peaks;\n  }\n  const obsPeaks=findObsPeaks(dataTth,yNorm);\n\n  // Calculate profile\n  function calcProfile(cell,zero,W,X,bkg){\n    const hkls=generateHKLs(system,8);\n    const ycalc=new Float64Array(nPts);\n    for(let i=0;i<nPts;i++){\n      const x=(i/(nPts-1));\n      ycalc[i]=bkg[0]+bkg[1]*x+bkg[2]*(2*x*x-1);\n    }\n    for(const[h,k,l]of hkls){\n      // Adapt cell to system constraints\n      const sc={...cell};\n      if(system==='cubic'){sc.b=sc.a;sc.c=sc.a;sc.be=90;}\n      if(system==='tetragonal'){sc.b=sc.a;sc.be=90;}\n      if(system==='orthorhombic')sc.be=90;\n      const sg=system==='cubic'?'Im-3m':system==='tetragonal'?'I4/mmm':system==='orthorhombic'?'Pnma':'P2₁/n';\n      if(isAbsent(sg,h,k,l))continue;\n      const d=dSpacing(sc,h,k,l);\n      if(!d)continue;\n      const sinT=lam/(2*d);if(sinT>=1||sinT<=0)continue;\n      const tth0=2*Math.asin(sinT)*180/Math.PI+zero;\n      if(tth0<tMin-1||tth0>tMax+1)continue;\n      const tR=tth0*Math.PI/360,cosT=Math.cos(tR),tanT=Math.tan(tR);\n      const fwhmGsq=Math.max(0.0001,W*tanT*tanT+0.07*tanT+0.05);\n      const fwhmG=Math.sqrt(fwhmGsq);\n      const fwhmL=X/cosT;\n      const fwhm=0.5*(fwhmG+fwhmL)+0.5*Math.sqrt(Math.max(0,fwhmG*fwhmL+0.5*(fwhmG-fwhmL)*(fwhmG-fwhmL)));\n      const eta=Math.min(0.99,fwhmL/Math.max(fwhm,0.001));\n      const LP=(1+Math.cos(2*tR)*Math.cos(2*tR))/(Math.sin(tR)*Math.sin(tR)*Math.cos(tR));\n      const mult=h===0||k===0||l===0?4:8;\n      const A=Math.min(5,LP*mult/50);\n      for(let i=0;i<nPts;i++){\n        const dt=dataTth[i]-tth0;\n        if(Math.abs(dt)>5*fwhm)continue;\n        ycalc[i]+=A*pVoigt(dataTth[i],tth0,fwhm,eta);\n      }\n    }\n    // Scale to data\n    let sumOC=0,sumCC=0;\n    for(let i=0;i<nPts;i++){sumOC+=yNorm[i]*ycalc[i];sumCC+=ycalc[i]*ycalc[i];}\n    const sc2=sumCC>0?sumOC/sumCC:1;\n    return ycalc.map(v=>v*sc2);\n  }\n\n  function rwp(ycalc){\n    let num=0,den=0;\n    for(let i=0;i<nPts;i++){\n      const w=1/Math.max(yNorm[i],0.001);\n      const d=yNorm[i]-ycalc[i];\n      num+=w*d*d;den+=w*yNorm[i]*yNorm[i];\n    }\n    return Math.sqrt(num/den)*100;\n  }\n\n  // Gradient-free minimiser (Nelder-Mead-lite) over cell params + zero + bkg + W,X\n  // Runs in steps, updating canvas each step\n  let iterCount=0;\n  const maxIter=120;\n  let bestRwp=rwp(calcProfile(cell,zero,W,X,bkgCoeffs));\n  let bestCell={...cell},bestZero=zero,bestW=W,bestX=X,bestBkg=[...bkgCoeffs];\n  let T=0.01;// step size\n\n  function step(){\n    if(iterCount>=maxIter||!udFitRunning){finaliseFit();return;}\n    iterCount++;\n    const frac=iterCount/maxIter;\n    T=0.01*(1-frac*0.9);// cooling\n\n    // Try perturbing each parameter\n    const trials=[];\n    if(refCell){\n      ['a','b','c','be'].forEach(par=>{\n        if(system==='cubic'&&(par==='b'||par==='c'||par==='be'))return;\n        if(system==='tetragonal'&&(par==='b'||par==='be'))return;\n        if(system==='orthorhombic'&&par==='be')return;\n        [1+T,-1*T].forEach(sgn=>{\n          const c2={...bestCell};\n          c2[par]*=(1+sgn);\n          const yc=calcProfile(c2,bestZero,bestW,bestX,bestBkg);\n          trials.push({cell:c2,zero:bestZero,W:bestW,X:bestX,bkg:bestBkg,rwp:rwp(yc)});\n        });\n      });\n    }\n    if(refZero){\n      [-T*0.5,T*0.5].forEach(dz=>{\n        const yc=calcProfile(bestCell,bestZero+dz,bestW,bestX,bestBkg);\n        trials.push({cell:bestCell,zero:bestZero+dz,W:bestW,X:bestX,bkg:bestBkg,rwp:rwp(yc)});\n      });\n    }\n    if(refProfile){\n      const dW=bestW*T,dX=bestX*T;\n      [[bestW+dW,bestX],[bestW-dW,bestX],[bestW,bestX+dX],[bestW,bestX-dX]].forEach(([w2,x2])=>{\n        const yc=calcProfile(bestCell,bestZero,Math.max(0.001,w2),Math.max(0,x2),bestBkg);\n        trials.push({cell:bestCell,zero:bestZero,W:Math.max(0.001,w2),X:Math.max(0,x2),bkg:bestBkg,rwp:rwp(yc)});\n      });\n    }\n    if(refBkg){\n      bkgCoeffs.forEach((_,bi)=>{\n        [T*0.05,-T*0.05].forEach(db=>{\n          const b2=[...bestBkg];b2[bi]+=db;\n          const yc=calcProfile(bestCell,bestZero,bestW,bestX,b2);\n          trials.push({cell:bestCell,zero:bestZero,W:bestW,X:bestX,bkg:b2,rwp:rwp(yc)});\n        });\n      });\n    }\n\n    // Accept best trial that improves\n    trials.sort((a,b)=>a.rwp-b.rwp);\n    if(trials.length&&trials[0].rwp<bestRwp){\n      bestRwp=trials[0].rwp;\n      bestCell={...trials[0].cell};bestZero=trials[0].zero;\n      bestW=trials[0].W;bestX=trials[0].X;bestBkg=[...trials[0].bkg];\n    }\n\n    // Update canvas every 5 iters\n    if(iterCount%5===0){\n      const ycalc=calcProfile(bestCell,bestZero,bestW,bestX,bestBkg);\n      udDrawFit(ycalc,bestRwp,iterCount,maxIter);\n    }\n    setTimeout(step,10);\n  }\n\n  function finaliseFit(){\n    udFitRunning=false;\n    document.getElementById('ud_btn_fit').textContent='▶ Run Le Bail fit';\n    const ycalc=calcProfile(bestCell,bestZero,bestW,bestX,bestBkg);\n    const finalRwp=rwp(ycalc);\n    udDrawFit(ycalc,finalRwp,maxIter,maxIter);\n    // Show refined cell\n    const sc={...bestCell};\n    if(system==='cubic'){sc.b=sc.a;sc.c=sc.a;sc.be=90;}\n    if(system==='tetragonal'){sc.b=sc.a;sc.be=90;}\n    const vol=sc.a*sc.b*sc.c*Math.sin(sc.be*Math.PI/180);\n    document.getElementById('ud_fit_cell').style.display='block';\n    document.getElementById('ud_fit_cell').innerHTML=\n      `<strong>Refined cell (${system}):<\/strong> a = ${sc.a.toFixed(4)} Å, b = ${sc.b.toFixed(4)} Å, c = ${sc.c.toFixed(4)} Å, β = ${sc.be.toFixed(3)}° — V = ${vol.toFixed(2)} Å³ — Zero = ${bestZero.toFixed(4)}° — Rwp = ${finalRwp.toFixed(1)}%`;\n    document.getElementById('ud_fit_stats').innerHTML=`\n      <div class=\"annot\" style=\"margin:0;padding:10px 14px\"><div style=\"font-size:11px;color:var(--fg3);margin-bottom:3px\">Rwp<\/div><div style=\"font-size:22px;font-weight:700;color:var(--${finalRwp<10?'accent3':finalRwp<20?'accent2':'danger'});font-family:'JetBrains Mono',monospace\">${finalRwp.toFixed(1)}%<\/div><\/div>\n      <div class=\"annot\" style=\"margin:0;padding:10px 14px\"><div style=\"font-size:11px;color:var(--fg3);margin-bottom:3px\">Zero error<\/div><div style=\"font-size:18px;font-weight:700;color:var(--fg);font-family:'JetBrains Mono',monospace\">${bestZero.toFixed(4)}°<\/div><\/div>\n      <div class=\"annot\" style=\"margin:0;padding:10px 14px\"><div style=\"font-size:11px;color:var(--fg3);margin-bottom:3px\">Volume<\/div><div style=\"font-size:18px;font-weight:700;color:var(--fg);font-family:'JetBrains Mono',monospace\">${vol.toFixed(2)} Å³<\/div><\/div>\n      <div class=\"annot\" style=\"margin:0;padding:10px 14px\"><div style=\"font-size:11px;color:var(--fg3);margin-bottom:3px\">Iterations<\/div><div style=\"font-size:18px;font-weight:700;color:var(--fg);font-family:'JetBrains Mono',monospace\">${maxIter}<\/div><\/div>`;\n    udFitResult={cell:sc,zero:bestZero,rwp:finalRwp,ycalc};\n  }\n\n  setTimeout(step,30);\n}\n\nfunction udDrawFit(ycalcNorm,rwpVal,iter,maxIter){\n  const r=setupCanvas('ud_fit_canvas');if(!r||!udRawData)return;\n  const{ctx,w,h}=r;\n  const pad={l:60,r:20,t:30,b:36};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n\n  const{tth:dataTth,yobs}=udRawData;\n  const tMin=dataTth[0],tMax=dataTth[dataTth.length-1];\n  const yMax=Math.max(...yobs);\n  const yNorm=yobs.map(v=>v/yMax);\n\n  // Axes\n  ctx.strokeStyle=bord();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n  ctx.fillStyle=fg3();ctx.font='11px Inter';ctx.textAlign='center';\n  const tStep=tMax-tMin>60?10:tMax-tMin>30?5:2;\n  const tStart2=Math.ceil(tMin/tStep)*tStep;\n  for(let t=tStart2;t<=tMax;t+=tStep){\n    const x=pad.l+(t-tMin)/(tMax-tMin)*pw;\n    ctx.fillText(t+'°',x,h-5);\n    ctx.strokeStyle=bord();ctx.lineWidth=0.4;ctx.setLineDash([2,2]);\n    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();ctx.setLineDash([]);\n  }\n\n  // Yobs (dots for sparse data, line for dense)\n  const nPts=dataTth.length;\n  if(nPts<400){\n    ctx.fillStyle=accent();\n    for(let i=0;i<nPts;i++){\n      const x=pad.l+(dataTth[i]-tMin)/(tMax-tMin)*pw;\n      const y=pad.t+ph-yNorm[i]*ph*0.85;\n      ctx.beginPath();ctx.arc(x,y,1.2,0,2*Math.PI);ctx.fill();\n    }\n  } else {\n    ctx.strokeStyle=accent();ctx.lineWidth=0.8;ctx.globalAlpha=0.7;ctx.beginPath();\n    for(let i=0;i<nPts;i++){\n      const x=pad.l+(dataTth[i]-tMin)/(tMax-tMin)*pw;\n      const y=pad.t+ph-yNorm[i]*ph*0.85;\n      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n    }ctx.stroke();ctx.globalAlpha=1;\n  }\n\n  // Ycalc\n  ctx.strokeStyle=accent2();ctx.lineWidth=1.8;ctx.beginPath();\n  for(let i=0;i<ycalcNorm.length;i++){\n    const x=pad.l+(dataTth[i]-tMin)/(tMax-tMin)*pw;\n    const y=pad.t+ph-ycalcNorm[i]*ph*0.85;\n    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n  }ctx.stroke();\n\n  // Difference\n  ctx.strokeStyle=danger();ctx.lineWidth=0.9;ctx.beginPath();\n  for(let i=0;i<nPts;i++){\n    const x=pad.l+(dataTth[i]-tMin)/(tMax-tMin)*pw;\n    const diff=yNorm[i]-ycalcNorm[i];\n    const y=pad.t+ph*0.1-diff*ph*0.4;\n    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n  }ctx.stroke();\n\n  // Progress bar + Rwp\n  const prog=iter/maxIter;\n  ctx.fillStyle=bg3();ctx.fillRect(pad.l,pad.t-14,pw,8);\n  ctx.fillStyle=accent3();ctx.fillRect(pad.l,pad.t-14,pw*prog,8);\n  ctx.fillStyle=fg2();ctx.font='11px Inter';ctx.textAlign='right';\n  ctx.fillText(`Iter ${iter}/${maxIter}  Rwp=${rwpVal.toFixed(1)}%`,pad.l+pw,pad.t-18);\n\n  // Legend\n  ctx.font='11px Inter';ctx.textAlign='left';\n  ctx.fillStyle=accent();ctx.fillRect(pad.l+8,pad.t+6,16,2);ctx.fillText('Yobs',pad.l+28,pad.t+12);\n  ctx.fillStyle=accent2();ctx.fillRect(pad.l+70,pad.t+6,16,2);ctx.fillText('Ycalc',pad.l+90,pad.t+12);\n  ctx.fillStyle=danger();ctx.fillRect(pad.l+135,pad.t+6,16,2);ctx.fillText('Diff',pad.l+155,pad.t+12);\n}\n\n// ── step navigation ──\nfunction udGoStep(n){\n  document.getElementById('ud_step1').style.display=n===1?'block':'none';\n  document.getElementById('ud_step2').style.display=n===2?'block':'none';\n  document.getElementById('ud_step3').style.display=n===3?'block':'none';\n  [1,2,3].forEach(i=>{\n    const t=document.getElementById('ud_tab'+i);\n    if(!t)return;\n    if(i===n){t.style.background='var(--accent)';t.style.color='#fff';}\n    else if(i<n){t.style.background='var(--accent3)';t.style.color='#fff';}\n    else{t.style.background='var(--bg3)';t.style.color='var(--fg3)';}\n  });\n  if(n===2)requestAnimationFrame(()=>setTimeout(()=>{\n    const sel=document.getElementById('ud_topn');if(sel)sel.value=String(udTopNValue||20);\n    const minEl=document.getElementById('ud_tth_min'),maxEl=document.getElementById('ud_tth_max');\n    if(minEl&&udTthMinValue!=null)minEl.value=udTthMinValue;\n    if(maxEl&&udTthMaxValue!=null)maxEl.value=udTthMaxValue;\n    udDrawIndexPattern();udUpdatePeakTable();\n  },80));\n  if(n===3){\n    document.getElementById('ud_lam_display').textContent=udLambda.toFixed(4)+' Å';\n  }\n}\n\n// ── peak picking on real data ──\nlet udPickedPeaks=[];\n\nfunction udDrawIndexPattern(){\n  const r=setupCanvas('ud_idx_canvas');if(!r||!udRawData)return;\n  const{ctx,w,h}=r;\n  const pad={l:60,r:20,t:16,b:36};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n  const{tth,yobs}=udRawData;\n  const tMin=tth[0],tMax=tth[tth.length-1];\n  const yMax=Math.max(...yobs);\n  ctx.strokeStyle=bord();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n  ctx.fillStyle=fg3();ctx.font='11px Inter';ctx.textAlign='center';\n  const tStep=tMax-tMin>60?10:tMax-tMin>30?5:2;\n  for(let t=Math.ceil(tMin/tStep)*tStep;t<=tMax;t+=tStep){\n    const x=pad.l+(t-tMin)/(tMax-tMin)*pw;ctx.fillText(t+'°',x,h-5);\n  }\n  ctx.strokeStyle=accent();ctx.lineWidth=1.2;ctx.beginPath();\n  for(let i=0;i<tth.length;i++){\n    const x=pad.l+(tth[i]-tMin)/(tMax-tMin)*pw;\n    const y=pad.t+ph-yobs[i]/yMax*ph*0.9;\n    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n  }ctx.stroke();\n  // picked peaks — colour by active/inactive/excluded\n  const activeSet=new Set(udActivePeaks().map(p=>p.tth));\n  for(let pi=0;pi<udPickedPeaks.length;pi++){\n    const pk=udPickedPeaks[pi];\n    const x=pad.l+(pk.tth-tMin)/(tMax-tMin)*pw;\n    const isExcluded=pk.enabled===false;\n    const isActive=activeSet.has(pk.tth)&&!isExcluded;\n    const col=isExcluded?fg3():isActive?accent2():'var(--accent2,#f59e0b)';\n    ctx.strokeStyle=col;ctx.lineWidth=isActive?2:1;ctx.setLineDash(isExcluded?[2,3]:[3,2]);\n    ctx.globalAlpha=isExcluded?0.35:1;\n    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();ctx.setLineDash([]);\n    ctx.globalAlpha=isActive?1:0.35;\n    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,pad.t+6,5,0,2*Math.PI);ctx.fill();\n    ctx.globalAlpha=1;\n    ctx.fillStyle=isActive?bg2():fg3();ctx.font='bold 9px Inter';ctx.textAlign='center';ctx.fillText(pi+1,x,pad.t+10);\n  }\n}\n\nfunction udIdxCanvasClick(e){\n  if(!udRawData)return;\n  const canvas=document.getElementById('ud_idx_canvas');\n  const rect=canvas.getBoundingClientRect();\n  const pad={l:60,r:20};const pw=rect.width-pad.l-pad.r;\n  const xRel=e.clientX-rect.left-pad.l;if(xRel<0||xRel>pw)return;\n  const{tth,yobs}=udRawData;\n  const tMin=tth[0],tMax=tth[tth.length-1];\n  const tthClick=tMin+xRel/pw*(tMax-tMin);\n  // Find local max near click (within 0.8°)\n  let bestI=-1,bestY=0;\n  for(let i=1;i<tth.length-1;i++){\n    if(Math.abs(tth[i]-tthClick)>0.8)continue;\n    if(yobs[i]>yobs[i-1]&&yobs[i]>yobs[i+1]&&yobs[i]>bestY){bestY=yobs[i];bestI=i;}\n  }\n  if(bestI<0){let minD=99;for(let i=0;i<tth.length;i++){const d=Math.abs(tth[i]-tthClick);if(d<minD){minD=d;bestI=i;}}}\n  const tthPk=tth[bestI];\n  const dPk=udLambda/(2*Math.sin(tthPk*Math.PI/360));\n  const iPct=yobs[bestI];// raw counts — normalised later\n  const existing=udPickedPeaks.findIndex(p=>Math.abs(p.tth-tthPk)<0.15);\n  if(existing>=0)udPickedPeaks.splice(existing,1);\n  else udPickedPeaks.push({tth:tthPk,d:dPk,intensity:iPct,enabled:true});\n  udPickedPeaks.sort((a,b)=>a.tth-b.tth);\n  udUpdatePeakTable();\n  udDrawIndexPattern();\n}\n\nfunction udAutoPick(){\n  if(!udRawData)return;\n  const{tth,yobs}=udRawData;\n  const smth=yobs.map((_,i)=>i>2&&i<yobs.length-3?(yobs[i-2]+yobs[i-1]+yobs[i]+yobs[i+1]+yobs[i+2])/5:yobs[i]);\n  const med=smth.slice().sort((a,b)=>a-b)[Math.floor(smth.length*0.5)];\n  udPickedPeaks=[];\n  for(let i=3;i<tth.length-3;i++){\n    if(smth[i]>smth[i-1]&&smth[i]>smth[i+1]&&smth[i]>smth[i-2]&&smth[i]>smth[i+2]&&smth[i]>med*1.8){\n      const dPk=udLambda/(2*Math.sin(tth[i]*Math.PI/360));\n      if(!udPickedPeaks.length||tth[i]-udPickedPeaks[udPickedPeaks.length-1].tth>0.25)\n        udPickedPeaks.push({tth:tth[i],d:dPk,intensity:smth[i],enabled:true});\n    }\n  }\n  udUpdatePeakTable();\n  udDrawIndexPattern();\n}\n\nlet udTopNValue=20;// persisted across display:none toggles\nlet udTthMinValue=null,udTthMaxValue=null;\n\n// Return the subset of peaks actually sent to indexing (top-N by intensity, all enabled, within 2θ range)\nfunction udActivePeaks(){\n  // Sync controls\n  const sel=document.getElementById('ud_topn');\n  if(sel)udTopNValue=parseInt(sel.value)||0;\n  const minEl=document.getElementById('ud_tth_min'),maxEl=document.getElementById('ud_tth_max');\n  const tthMin=minEl&&minEl.value!==''?parseFloat(minEl.value):null;\n  const tthMax=maxEl&&maxEl.value!==''?parseFloat(maxEl.value):null;\n  // 1. enabled\n  let peaks=udPickedPeaks.filter(p=>p.enabled!==false);\n  // 2. 2θ range\n  if(tthMin!=null)peaks=peaks.filter(p=>p.tth>=tthMin);\n  if(tthMax!=null)peaks=peaks.filter(p=>p.tth<=tthMax);\n  // 3. top-N by intensity\n  const topN=udTopNValue;\n  if(topN&&topN<peaks.length){\n    peaks=[...peaks].sort((a,b)=>(b.intensity||0)-(a.intensity||0)).slice(0,topN);\n    peaks.sort((a,b)=>a.tth-b.tth);\n  }\n  return peaks;\n}\n\nfunction udUpdatePeakTable(){\n  const wrap=document.getElementById('ud_peak_table_wrap');\n  const tbody=document.getElementById('ud_peak_tbl_body');\n  const note=document.getElementById('ud_peak_tbl_note');\n  if(!udPickedPeaks.length){wrap.style.display='none';document.getElementById('ud_idx_pick_status').innerHTML='Auto-pick or click individual peaks on the pattern above.';return;}\n  wrap.style.display='block';\n  const iMax=Math.max(...udPickedPeaks.map(p=>p.intensity||1));\n  const topN=parseInt(document.getElementById('ud_topn')?.value||'0');\n  // Mark which peaks will be sent\n  const active=udActivePeaks();\n  const activeSet=new Set(active.map(p=>p.tth));\n  tbody.innerHTML=udPickedPeaks.map((pk,i)=>{\n    const pct=Math.round((pk.intensity||0)/iMax*100);\n    const barW=Math.max(1,pct);\n    const isActive=activeSet.has(pk.tth);\n    const rowStyle=pk.enabled===false?'opacity:0.4':'';\n    return`<tr style=\"${rowStyle}\">\n      <td style=\"color:var(--fg3)\">${i+1}<\/td>\n      <td>${pk.tth.toFixed(3)}<\/td>\n      <td>${pk.d.toFixed(4)}<\/td>\n      <td style=\"font-weight:${pct>=50?'700':'400'};color:${pct>=50?'var(--accent)':'var(--fg)'}\">${pct}<\/td>\n      <td style=\"width:80px\"><div style=\"height:8px;border-radius:3px;background:var(--accent);width:${barW}%;opacity:${pk.enabled===false?0.3:0.85}\"><\/div><\/td>\n      <td><input type=\"checkbox\" data-pkidx=\"${i}\" class=\"ud_pk_chk\" ${pk.enabled===false?'':'checked'} style=\"cursor:pointer;width:14px;height:14px\"><\/td>\n      <td><button class=\"btn btn-secondary\" data-pkdel=\"${i}\" style=\"font-size:10px;padding:2px 7px;color:var(--danger)\">✕<\/button><\/td>\n    <\/tr>`;\n  }).join('');\n  // Wire checkboxes\n  tbody.querySelectorAll('.ud_pk_chk').forEach(cb=>{\n    cb.addEventListener('change',()=>{\n      const idx=parseInt(cb.dataset.pkidx);\n      udPickedPeaks[idx].enabled=cb.checked;\n      udUpdatePeakTable();udDrawIndexPattern();\n    });\n  });\n  // Wire delete buttons\n  tbody.querySelectorAll('[data-pkdel]').forEach(btn=>{\n    btn.addEventListener('click',()=>{\n      udPickedPeaks.splice(parseInt(btn.dataset.pkdel),1);\n      udUpdatePeakTable();udDrawIndexPattern();\n    });\n  });\n  const nActive=active.length;\n  const nEnabled=udPickedPeaks.filter(p=>p.enabled!==false).length;\n  const nTotal=udPickedPeaks.length;\n  const minEl=document.getElementById('ud_tth_min'),maxEl=document.getElementById('ud_tth_max');\n  const tthMin=minEl&&minEl.value!==''?parseFloat(minEl.value):null;\n  const tthMax=maxEl&&maxEl.value!==''?parseFloat(maxEl.value):null;\n  const rangeStr=tthMin!=null||tthMax!=null?` within ${tthMin!=null?tthMin+'°':'start'}–${tthMax!=null?tthMax+'°':'end'}`:''\n  let noteMsg='';\n  if(topN&&topN<nEnabled){\n    noteMsg=`Sending ${nActive} strongest lines${rangeStr} to indexing (top ${topN} of ${nEnabled} enabled by intensity). `;\n  } else if(rangeStr){\n    noteMsg=`${nActive} of ${nEnabled} enabled peaks${rangeStr} will be sent to indexing. `;\n  } else if(nEnabled<nTotal){\n    noteMsg=`${nEnabled} of ${nTotal} peaks enabled — ${nActive} will be sent to indexing. `;\n  } else {\n    noteMsg=`All ${nActive} picked peaks will be sent to indexing. `;\n  }\n  noteMsg+='Uncheck ☑ to exclude; ✕ to delete permanently.';\n  note.textContent=noteMsg;\n  document.getElementById('ud_idx_pick_status').innerHTML=`<strong>${udPickedPeaks.length} peaks picked<\/strong> — ${nActive} will be used for indexing.`;\n  udDrawIndexPattern();\n}\n\n// ── Shared scoring ──\n// Enforce cell constraints for a given system\nfunction udConstrainCell(cell,system){\n  const c={...cell};\n  if(system==='cubic'){c.b=c.a;c.c=c.a;c.al=90;c.be=90;c.ga=90;}\n  else if(system==='tetragonal'){c.b=c.a;c.al=90;c.be=90;c.ga=90;}\n  else if(system==='orthorhombic'){c.al=90;c.be=90;c.ga=90;}\n  else if(system==='hexagonal'||system==='trigonal'){c.b=c.a;c.al=90;c.be=90;c.ga=120;}\n  else if(system==='rhombohedral'){c.b=c.a;c.c=c.a;c.be=c.al;c.ga=c.al;}\n  else if(system==='monoclinic'){c.al=90;c.ga=90;}\n  // triclinic: all free\n  return c;\n}\n\nfunction udScoreCell(cell,system,qs){\n  const sc=udConstrainCell(cell,system);\n  let matches=0,residSum=0;\n  for(const q of qs){\n    let best=1;\n    for(let h=0;h<=4;h++)for(let k=-4;k<=4;k++)for(let l=-4;l<=4;l++){\n      if(h===0&&k<=0)continue;if(h===0&&k===0&&l<=0)continue;\n      const d=dSpacing(sc,h,k,l);if(!d||d<0.4||d>50)continue;\n      const qC=1/(d*d);\n      const res=Math.abs(q-qC)/q;\n      if(res<best)best=res;\n    }\n    if(best<0.025){matches++;residSum+=best;}\n  }\n  const M20=matches>0?Math.min(99,matches*0.025/(residSum/matches+0.0005)):0;\n  return{matches,M20,avgResid:matches>0?residSum/matches:1};\n}\n\n// ── Least-squares cell refinement on indexed peaks ──\nconst UD_FREE_PARAMS={\n  cubic:['a'],\n  tetragonal:['a','c'],\n  orthorhombic:['a','b','c'],\n  hexagonal:['a','c'],trigonal:['a','c'],\n  rhombohedral:['a','al'],\n  monoclinic:['a','b','c','be'],\n  triclinic:['a','b','c','al','be','ga']\n};\nfunction udLSQRefine(cell,system,qs){\n  let cur=udConstrainCell(cell,system);\n  const params=UD_FREE_PARAMS[system]||['a','b','c','be'];\n  for(let iter=0;iter<100;iter++){\n    const T=0.008*(1-iter/100)+0.001;\n    for(const par of params){\n      let bestM=udScoreCell(cur,system,qs).M20,best={...cur};\n      for(const sgn of [1,-1]){\n        const trial=udConstrainCell({...cur,[par]:cur[par]*(1+sgn*T)},system);\n        const sc=udScoreCell(trial,system,qs);\n        if(sc.M20>bestM){bestM=sc.M20;best=trial;}\n      }\n      cur=best;\n    }\n  }\n  return cur;\n}\n\n// ── TREOR ──\n// Extended: cubic, tetragonal, hexagonal, orthorhombic (via ratio lattices)\nfunction udRunTREOR(){\n  const peaks=udActivePeaks();\n  if(peaks.length<4){udShowIdxError();return;}\n  udShowIdxRunning('TREOR',`Running exhaustive integer-ratio test — ${peaks.length} lines…`);\n  setTimeout(()=>{\n    const qs=peaks.map(p=>1/(p.d*p.d));\n    const results=[];\n    const cubicInts=[1,2,3,4,5,6,8,9,10,11,12,13,14,16,18,19,20,21,22,24,25];\n    const tetHkls=[];for(let h=0;h<=5;h++)for(let k=0;k<=h;k++)for(let l=0;l<=5;l++){if(h+k+l>0)tetHkls.push([h,k,l]);}\n    const hexHkls=[];for(let h=0;h<=4;h++)for(let k=0;k<=h;k++)for(let l=0;l<=5;l++){if(h+k+l>0)hexHkls.push([h,k,l]);}\n\n    // Cubic — seed from every peak\n    for(const n0 of cubicInts){\n      for(let ip=0;ip<Math.min(4,qs.length);ip++){\n        const a2=n0/qs[ip];const a=Math.sqrt(a2);if(a<1||a>30)continue;\n        const cell=udConstrainCell({a,b:a,c:a,al:90,be:90,ga:90},'cubic');\n        const sc=udScoreCell(cell,'cubic',qs);\n        if(sc.M20>2)results.push({algo:'TREOR',system:'cubic',...cell,...sc});\n      }\n    }\n\n    // Tetragonal & hexagonal — try all peak pairs as (hk0,00l) seeds\n    for(let ia=0;ia<Math.min(5,qs.length);ia++){\n      for(const na of [1,2,4,5,8,9,10]){\n        const a2=na/qs[ia];const a=Math.sqrt(a2);if(a<1||a>25)continue;\n        for(let ic=0;ic<Math.min(6,qs.length);ic++){\n          if(ic===ia)continue;\n          for(const nc of [1,2,3,4,6,8,9]){\n            const c2=nc/qs[ic];const c=Math.sqrt(c2);if(c<1||c>35||Math.abs(c-a)<0.05)continue;\n            // tetragonal\n            const tCell=udConstrainCell({a,b:a,c,al:90,be:90,ga:90},'tetragonal');\n            const tSc=udScoreCell(tCell,'tetragonal',qs);\n            if(tSc.M20>2)results.push({algo:'TREOR',system:'tetragonal',...tCell,...tSc});\n            // hexagonal\n            const hCell=udConstrainCell({a,b:a,c,al:90,be:90,ga:120},'hexagonal');\n            const hSc=udScoreCell(hCell,'hexagonal',qs);\n            if(hSc.M20>2)results.push({algo:'TREOR',system:'hexagonal',...hCell,...hSc});\n          }\n        }\n      }\n    }\n\n    // Orthorhombic — use triplets of peaks as (h00,0k0,00l)\n    for(let ia=0;ia<Math.min(4,qs.length);ia++){\n      for(let ib=ia+1;ib<Math.min(5,qs.length);ib++){\n        for(let ic=ib+1;ic<Math.min(6,qs.length);ic++){\n          for(const na of [1,4]){for(const nb of [1,4]){for(const nc of [1,4]){\n            const a=Math.sqrt(na/qs[ia]),b=Math.sqrt(nb/qs[ib]),c=Math.sqrt(nc/qs[ic]);\n            if(a<1||b<1||c<1||a>25||b>25||c>25)continue;\n            const cell=udConstrainCell({a,b,c,al:90,be:90,ga:90},'orthorhombic');\n            const sc=udScoreCell(cell,'orthorhombic',qs);\n            if(sc.M20>2)results.push({algo:'TREOR',system:'orthorhombic',...cell,...sc});\n          }}}\n        }\n      }\n    }\n\n    udStoreAndShowResults('TREOR',results,qs,'<div class=\"annot\" style=\"margin-bottom:8px\"><strong>TREOR:<\/strong> Exhaustive integer-ratio search seeded from all peak pairs. Covers cubic, tetragonal, hexagonal, orthorhombic. Use DICVOL or MC for monoclinic/triclinic.<\/div>');\n  },30);\n}\n\n// ── DICVOL ──\nfunction udRunDICVOL(){\n  const peaks=udActivePeaks();\n  if(peaks.length<4){udShowIdxError();return;}\n  udShowIdxRunning('DICVOL',`Scanning cell volume — all 7 systems — ${peaks.length} lines…`);\n  const qs=peaks.map(p=>1/(p.d*p.d));\n  const results=[];\n  const dMax=udPickedPeaks[0].d;\n  const Vmin=Math.max(5,dMax*dMax*dMax*0.3);\n  const Vmax=dMax*dMax*dMax*120;\n  const Nshells=150;\n  const Vstep=(Vmax-Vmin)/Nshells;\n  let Vi=0;\n\n  // Axis-ratio grids per system (ra, rb, rc) — finer than before\n  const RATIOS={\n    cubic:[[1,1,1]],\n    tetragonal:[[0.6,0.6,2],[0.8,0.8,1.6],[1,1,1],[1.2,1.2,0.7],[1.5,1.5,0.5],[0.5,0.5,2.5]],\n    hexagonal:[[0.6,0.6,2],[0.8,0.8,1.5],[1,1,1],[1.3,1.3,0.7],[0.5,0.5,3]],\n    orthorhombic:[[0.5,0.8,2.5],[0.6,1,1.7],[0.7,1,1.4],[0.8,1.1,1.3],[0.6,0.9,2],[1,1.3,0.8],[0.5,1.2,1.7],[0.9,1.5,0.7]],\n    monoclinic:[[0.6,1,1.5],[0.7,1,1.3],[0.8,1.1,1.2],[0.6,0.9,1.8],[0.5,1.2,1.6],[1,1.4,0.7]],\n    rhombohedral:[[1,1,1]],\n    triclinic:[[0.7,0.9,1.3],[0.8,1,1.2],[0.6,1,1.5]]\n  };\n  const BETAS={monoclinic:[92,95,98,101,105,110,115],triclinic:[92,95,98,101,105]};\n  const ALPHAS={rhombohedral:[70,80,85,90,95,100,105],triclinic:[85,90,95,100,105]};\n  const GAMMAS_TRI=[85,90,95,100,105];\n  const systems=['cubic','tetragonal','hexagonal','orthorhombic','monoclinic','rhombohedral','triclinic'];\n\n  function scanStep(){\n    for(let si=0;si<8&&Vi<Nshells;si++,Vi++){\n      const V=Vmin+Vi*Vstep;\n      const a0=Math.cbrt(V);\n      for(const sys of systems){\n        for(const[ra,rb,rc]of RATIOS[sys]){\n          const a=a0*ra,b=a0*rb,c=a0*rc;\n          if(a<1.5||b<1.5||c<1.5||a>30||b>30||c>30)continue;\n          const beList=BETAS[sys]||[90];\n          const alList=ALPHAS[sys]||[90];\n          const gaList=sys==='triclinic'?GAMMAS_TRI:[sys==='hexagonal'?120:90];\n          for(const be of beList){\n            for(const al of alList){\n              for(const ga of gaList){\n                const cell=udConstrainCell({a,b,c,al,be,ga},sys);\n                const sc=udScoreCell(cell,sys,qs);\n                if(sc.M20>3)results.push({algo:'DICVOL',system:sys,...cell,...sc});\n              }\n            }\n          }\n        }\n      }\n      document.getElementById('ud_idx_prog').style.width=Math.round(Vi/Nshells*100)+'%';\n    }\n    if(Vi<Nshells){setTimeout(scanStep,0);}\n    else{\n      document.getElementById('ud_idx_prog').style.width='100%';\n      udStoreAndShowResults('DICVOL',results,qs,`<div class=\"annot\" style=\"margin-bottom:8px\"><strong>DICVOL:<\/strong> Scanned ${Nshells} volume shells across all 7 crystal systems (cubic → triclinic). Each shell tests multiple axis-ratio and angle combinations.<\/div>`);\n    }\n  }\n  scanStep();\n}\n\n// ── McMaille / FOX Monte Carlo ──\nfunction udRunMcMaille(){\n  const peaks=udActivePeaks();\n  if(peaks.length<4){udShowIdxError();return;}\n  udShowIdxRunning('MC (McMaille/FOX)',`Monte Carlo SA — all 7 systems — ${peaks.length} lines…`);\n  const qs=peaks.map(p=>1/(p.d*p.d));\n  const dMax=peaks[0].d,dMin=peaks[peaks.length-1].d;\n  const rng=seededRng(Date.now()&0xffff);\n  const allResults=[];\n  const systems=['cubic','tetragonal','hexagonal','orthorhombic','rhombohedral','monoclinic','triclinic'];\n  const maxIter=6000;\n  let iter=0;\n\n  // Initial cells: 2 restarts per system\n  const agents=[];\n  for(const sys of systems){\n    for(let r=0;r<2;r++){\n      const a=dMax*(0.8+rng()*1.5),c=dMax*(0.5+rng()*2);\n      const be=sys==='monoclinic'||sys==='triclinic'?92+rng()*20:90;\n      const al=sys==='rhombohedral'?75+rng()*30:sys==='triclinic'?88+rng()*20:90;\n      const ga=sys==='hexagonal'?120:sys==='triclinic'?88+rng()*20:90;\n      const cell=udConstrainCell({a,b:a*0.9,c,al,be,ga},sys);\n      const sc=udScoreCell(cell,sys,qs);\n      agents.push({sys,cell,score:sc.M20,best:{cell:{...cell},score:sc.M20}});\n    }\n  }\n\n  const FREE={\n    cubic:['a'],tetragonal:['a','c'],hexagonal:['a','c'],\n    orthorhombic:['a','b','c'],rhombohedral:['a','al'],\n    monoclinic:['a','b','c','be'],triclinic:['a','b','c','al','be','ga']\n  };\n\n  function mcStep(){\n    // Time-budget loop: run as many iterations as fit in ~14ms per animation frame\n    const tStart=performance.now();\n    while(iter<maxIter&&performance.now()-tStart<14){\n      const T=Math.pow(1-iter/maxIter,1.5);  // slow cooling: high early, low late\n      const stepSize=0.35*T+0.004;\n      for(const ag of agents){\n        const params=FREE[ag.sys];\n        const par=params[Math.floor(rng()*params.length)];\n        const proposal={...ag.cell};\n        proposal[par]*=(1+(rng()-0.5)*2*stepSize);\n        // Angle clamps\n        if(par==='be'){proposal.be=Math.max(91,Math.min(145,proposal.be));}\n        if(par==='al'||par==='ga'){proposal[par]=Math.max(60,Math.min(130,proposal[par]));}\n        // Axis clamps\n        if(['a','b','c'].includes(par)){proposal[par]=Math.max(1.5,Math.min(35,proposal[par]));}\n        const c2=udConstrainCell(proposal,ag.sys);\n        const sc=udScoreCell(c2,ag.sys,qs);\n        const delta=sc.M20-ag.score;\n        // Metropolis: guard T→0 blowup — only accept improvements when T is tiny\n        const tSafe=Math.max(T,0.002);\n        if(delta>0||rng()<Math.exp(delta/tSafe)){ag.cell=c2;ag.score=sc.M20;}\n        if(ag.score>ag.best.score){ag.best={cell:{...ag.cell},score:ag.score,...sc};}\n      }\n      iter++;\n    }\n    const topM=Math.max(...agents.map(a=>a.best.score));\n    document.getElementById('ud_idx_prog').style.width=Math.round(iter/maxIter*100)+'%';\n    document.getElementById('ud_idx_running_msg').textContent=`MC/SA: step ${iter}/${maxIter} — best M₂₀: ${topM.toFixed(1)}`;\n    if(iter<maxIter){requestAnimationFrame(mcStep);}\n    else{\n      for(const ag of agents){\n        if(ag.best.score>2)allResults.push({algo:'MC',system:ag.sys,...ag.best.cell,...ag.best});\n      }\n      const foxNote=`<div class=\"annot\" style=\"margin-bottom:10px\">\n        <strong>How FOX/McMaille indexing works:<\/strong> FOX (Favre-Nicolin &amp; Černý, J. Appl. Cryst. 2002) uses a global Monte Carlo/simulated-annealing (SA) search over the full unit-cell parameter space. At each step, one parameter is perturbed randomly. The score is <em>M₂₀ = number of lines indexed / (20 × mean |q_obs − q_calc|)<\/em>. A better move is always accepted; a worse one is accepted with probability e<sup>ΔM·8T<\/sup> (Metropolis criterion). Temperature T cools from 1→0, letting the search escape local minima early then converge. Each crystal system runs 2 independent SA trajectories from random starting cells. Unlike TREOR (integer ratios) or DICVOL (1D volume ladder), FOX explores the full continuous parameter space, so it finds monoclinic and triclinic cells reliably. FOX uses the same SA engine for <em>ab initio<\/em> structure solution.\n      <\/div>`;\n      document.getElementById('ud_idx_prog').style.width='100%';\n      udStoreAndShowResults('MC (McMaille/FOX)',allResults,qs,foxNote);\n    }\n  }\n  mcStep();\n}\n\nfunction udShowIdxError(){\n  const n=udActivePeaks().length;\n  document.getElementById('ud_index_result_card').style.display='block';\n  document.getElementById('ud_index_result_body').innerHTML=`<div class=\"annot red\">Need at least 4 active peaks to index (currently ${n}). Pick more peaks or uncheck fewer.<\/div>`;\n  document.getElementById('ud_idx_running').style.display='none';\n}\n\nfunction udShowIdxRunning(algo,msg){\n  document.getElementById('ud_idx_running').style.display='block';\n  document.getElementById('ud_idx_running_msg').textContent=msg;\n  document.getElementById('ud_idx_prog').style.width='0%';\n  document.getElementById('ud_index_result_card').style.display='none';\n}\n\nfunction udStoreAndShowResults(algo,rawResults,qs,extraHtml){\n  document.getElementById('ud_idx_running').style.display='none';\n  rawResults.sort((a,b)=>b.M20-a.M20);\n  // Deduplicate: same system + similar cell params → keep highest M20\n  const unique=[];\n  for(const r of rawResults){\n    const dup=unique.some(u=>\n      u.system===r.system&&\n      Math.abs(u.a-r.a)<0.3&&Math.abs((u.b||u.a)-(r.b||r.a))<0.3&&\n      Math.abs((u.c||u.a)-(r.c||r.a))<0.3&&Math.abs((u.be||90)-(r.be||90))<2);\n    if(!dup)unique.push(r);\n    if(unique.length>=20)break;\n  }\n  document.getElementById('ud_index_result_card').style.display='block';\n  if(!unique.length){\n    document.getElementById('ud_index_result_body').innerHTML=extraHtml+'<div class=\"annot red\">No solution found. Try: (1) pick more peaks, (2) check wavelength, (3) try a different algorithm, (4) ensure peaks are sorted low→high 2θ.<\/div>';\n    document.getElementById('ud_btn_lsq_refine').style.display='none';\n    return;\n  }\n  const badgeColor=a=>a==='TREOR'?'blue':a==='DICVOL'?'amber':a==='MC'||a.startsWith('MC')?'green':'purple';\n  const rows=unique.map((r,i)=>{\n    const showAngles=r.system==='monoclinic'||r.system==='triclinic'||r.system==='rhombohedral';\n    const al=r.al||90,be=r.be||90,ga=r.ga||(r.system==='hexagonal'?120:90);\n    const angleStr=showAngles?`${al.toFixed(1)} / ${be.toFixed(1)} / ${ga.toFixed(1)}`:`90 / ${be.toFixed(1)} / 90`;\n    return`<tr>\n      <td><span class=\"badge badge-${badgeColor(r.algo)}\" style=\"font-size:10px\">${r.algo}<\/span><\/td>\n      <td>${r.system.charAt(0).toUpperCase()+r.system.slice(1)}<\/td>\n      <td>${r.a.toFixed(3)}<\/td><td>${(r.b||r.a).toFixed(3)}<\/td><td>${(r.c||r.a).toFixed(3)}<\/td>\n      <td style=\"font-size:11px\">${angleStr}<\/td>\n      <td class=\"${r.M20>=20?'hi':r.M20>=10?'':'bad'}\">${r.M20.toFixed(1)}<\/td>\n      <td>${r.matches}<\/td>\n      <td><button class=\"btn btn-secondary\" style=\"font-size:11px;padding:3px 8px\" data-ridx=\"${i}\">Use<\/button><\/td>\n    <\/tr>`;}).join('');\n  document.getElementById('ud_index_result_body').innerHTML=extraHtml+`\n    <p class=\"annot\" style=\"margin-bottom:6px\">Showing top ${unique.length} solutions. M₂₀ ≥ 10 is acceptable; ≥ 20 is a good solution. Click <strong>Use<\/strong> to send a cell to the Le Bail step.<\/p>\n    <div style=\"overflow-x:auto\"><table class=\"tbl\"><thead><tr><th>Algo<\/th><th>System<\/th><th>a (Å)<\/th><th>b (Å)<\/th><th>c (Å)<\/th><th>α / β / γ (°)<\/th><th>M₂₀<\/th><th>Lines<\/th><th><\/th><\/tr><\/thead>\n    <tbody>${rows}<\/tbody><\/table><\/div>`;\n  document.getElementById('ud_index_result_body').dataset.solutions=JSON.stringify(unique);\n  document.getElementById('ud_btn_lsq_refine').style.display='inline-block';\n  document.querySelectorAll('[data-ridx]').forEach(btn=>{\n    btn.addEventListener('click',()=>{\n      const sols=JSON.parse(document.getElementById('ud_index_result_body').dataset.solutions||'[]');\n      const r=sols[parseInt(btn.dataset.ridx)];if(!r)return;\n      udFillCellFromIndex(r);\n    });\n  });\n}\n\nfunction udRunLSQ(){\n  const sols=JSON.parse(document.getElementById('ud_index_result_body').dataset.solutions||'[]');\n  if(!sols.length)return;\n  const qs=udActivePeaks().map(p=>1/(p.d*p.d));\n  udShowIdxRunning('Least-squares','Refining all solutions by least-squares…');\n  setTimeout(()=>{\n    // Refine top 5 solutions and re-merge with rest\n    const refined=[];\n    for(const r of sols.slice(0,5)){\n      const startCell={a:r.a,b:r.b||r.a,c:r.c||r.a,al:r.al||90,be:r.be||90,ga:r.ga||(r.system==='hexagonal'?120:90)};\n      const ref=udLSQRefine(startCell,r.system,qs);\n      const sc=udScoreCell(ref,r.system,qs);\n      refined.push({algo:'LSQ',system:r.system,...ref,...sc});\n    }\n    const combined=[...refined,...sols];\n    const topM=Math.max(...refined.map(r=>r.M20));\n    udStoreAndShowResults('LSQ',combined,qs,`<div class=\"annot green\" style=\"margin-bottom:8px\"><strong>Least-squares refine:<\/strong> Gradient-free cell-parameter refinement on the top 5 solutions. Best refined M₂₀ = ${topM.toFixed(1)}.<\/div>`);\n  },30);\n}\n\nfunction udRunIndexing(){/* legacy — not used directly now */}\n\nfunction udFillCellFromIndex(r){\n  document.getElementById('ud_system').value=r.system;\n  document.getElementById('ud_a').value=r.a.toFixed(4);\n  document.getElementById('ud_b').value=r.b.toFixed(4);\n  document.getElementById('ud_c').value=r.c.toFixed(4);\n  document.getElementById('ud_beta').value=r.be.toFixed(2);\n  udGoStep(3);\n}\n\nfunction initUDPage(){\n  udBuildPresets();\n  if(udRawData)udDrawRaw();\n  if(udFitResult)udDrawFit(udFitResult.ycalc,udFitResult.rwp,120,120);\n}\n\n// ═══════════════════════════════════════════════════════\n// NAV\n// ═══════════════════════════════════════════════════════\nfunction showPage(id){\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));\n  document.getElementById('page-'+id).classList.add('active');\n  document.querySelector(`[data-page=\"${id}\"]`)?.classList.add('active');\n  window.scrollTo(0,0);\n  requestAnimationFrame(()=>setTimeout(()=>initPage(id),80));\n}\n\nfunction initPage(id){\n  if(id==='indexing')drawIdxPattern();\n  if(id==='methods'){drawTCHZ();updateParamCount();drawLeBail();}\n  if(id==='instrument'){drawInstrPattern();drawZeroError();}\n  if(id==='challenge')drawChallengePattern();\n  if(id==='mydata')initUDPage();\n  if(id==='more'&&window.XB)XB.initAll();\n}\n\nlet isDark=false;\nfunction toggleTheme(){\n  isDark=!isDark;\n  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');\n  document.getElementById('theme-toggle').textContent=isDark?'☀️':'🌙';\n  const cur=document.querySelector('.page.active')?.id?.re
