(2 ε̄ N₂₀)<\/span>\n      <\/div>\n    <\/div>\n    <button class=\"btn btn-primary\" id=\"btn_treor\" style=\"margin-top:8px\">▶ Run TREOR<\/button>\n  <\/div>\n\n  <!-- DICVOL -->\n  <div class=\"algo-block\">\n    <div class=\"algo-hdr\" data-algo=\"dicvol\">\n      <div class=\"algo-title\"><span class=\"algo-badge\" style=\"background:var(--accent2)\">DICVOL<\/span> <span class=\"algo-sub\">Volume scan · Boultif &amp; Louër 1991<\/span><\/div>\n      <span class=\"algo-chev\">▶<\/span>\n    <\/div>\n    <div class=\"algo-body\" id=\"algo-body-dicvol\">\n      <div class=\"math-block\">\n        Scan unit cell volume V from 20–2000 Å³ in shells of 20 Å³.<br>\n        For each shell, sample axis ratios b/a and c/a on a grid.<br>\n        For monoclinic/triclinic: sweep β (or α, γ) in 2° steps.<br>\n        For each trial cell compute all Q<sub>hkl<\/sub> via the full metric tensor:<br>\n        <span class=\"eq\">Q<sub>hkl<\/sub> = S<sub>11<\/sub>h² + S<sub>22<\/sub>k² + S<sub>33<\/sub>l² + 2S<sub>12<\/sub>hk + 2S<sub>13<\/sub>hl + 2S<sub>23<\/sub>kl<\/span>\n        Accept if every observed Q is matched within tolerance.\n      <\/div>\n    <\/div>\n    <button class=\"btn btn-secondary\" id=\"btn_dicvol\" style=\"margin-top:8px\">▶ Run DICVOL<\/button>\n  <\/div>\n\n  <!-- LSQ -->\n  <div class=\"algo-block\">\n    <div class=\"algo-hdr\" data-algo=\"lsq\">\n      <div class=\"algo-title\"><span class=\"algo-badge\" style=\"background:var(--accent3)\">Least-squares<\/span> <span class=\"algo-sub\">Cell refinement<\/span><\/div>\n      <span class=\"algo-chev\">▶<\/span>\n    <\/div>\n    <div class=\"algo-body\" id=\"algo-body-lsq\">\n      <div class=\"math-block\">\n        Starting from a TREOR/DICVOL solution, minimise:<br>\n        <span class=\"eq\">χ² = Σ<sub>i<\/sub> w<sub>i<\/sub> (Q<sub>obs,i<\/sub> − Q<sub>calc,i<\/sub>(p))²<\/span>\n        where w<sub>i<\/sub> = 1/σ(Q<sub>i<\/sub>)² and p are the free cell parameters.<br>\n        Only the symmetry-allowed parameters are refined:<br>\n        cubic → a only · monoclinic → a, b, c, β · triclinic → all 6.\n      <\/div>\n    <\/div>\n    <button class=\"btn btn-secondary\" id=\"btn_lsq\" style=\"margin-top:8px\">▶ Least-squares refine<\/button>\n  <\/div>\n\n  <!-- MC/SA info only -->\n  <div class=\"algo-block\">\n    <div class=\"algo-hdr\" data-algo=\"mcsa\">\n      <div class=\"algo-title\"><span class=\"algo-badge\" style=\"background:#8b5cf6\">MC/SA<\/span> <span class=\"algo-sub\">McMaille / FOX · available on Your Data page<\/span><\/div>\n      <span class=\"algo-chev\">▶<\/span>\n    <\/div>\n    <div class=\"algo-body\" id=\"algo-body-mcsa\">\n      <div class=\"math-block\">\n        Simulated Annealing explores cell space stochastically using the Metropolis criterion:<br>\n        <span class=\"eq\">P(accept) = min(1, exp(−ΔE / T))<\/span>\n        where ΔE = −ΔM₂₀ and T = temperature.<br>\n        Each step perturbs cell parameters randomly. Good moves always accepted; bad moves accepted with probability P.<br>\n        Temperature cools geometrically: T(n) = T₀ · r<sup>n<\/sup>, r ≈ 0.995.<br>\n        Multiple restarts explore different basins.\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"idx_algo_status\" style=\"font-size:13px;color:var(--fg3);margin:12px 0 8px\"><\/div>\n  <div id=\"idx_results\" style=\"overflow-x:auto\"><\/div>\n<\/div>\n<\/div>\n\n<!-- ═══════ PAGE 2: SPACE GROUP ═══════ -->\n<div class=\"page\" id=\"page-spacegroup\">\n<div class=\"sect-hdr\"><span class=\"eyebrow\">Step 2<\/span><h2>Space Group from Systematic Absences<\/h2><\/div>\n\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>How systematic absences work<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n    <p style=\"color:var(--fg2);margin:0 0 8px\">Once you have an indexed pattern, some (hkl) reflections that should exist geometrically will have <strong>zero intensity<\/strong> — they are systematically absent due to translational symmetry elements. By identifying which classes are absent, you narrow down the space group.<\/p>\n    <div class=\"math-block\">\n      <strong>Structure factor:<\/strong> <span class=\"eq\">F<sub>hkl<\/sub> = Σ<sub>j<\/sub> f<sub>j<\/sub> exp[2πi(hx<sub>j<\/sub>+ky<sub>j<\/sub>+lz<sub>j<\/sub>)]<\/span>\n      For a body-centred cell (I lattice), atom j at (x,y,z) is also at (x+½, y+½, z+½), giving a factor (1 + e<sup>iπ(h+k+l)<\/sup>). This equals 0 when h+k+l is odd → <strong>all hkl: h+k+l odd are absent<\/strong>.\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h3>Simulate an indexed pattern<\/h3>\n  <div class=\"ctrl-row\">\n    <label>Space group<\/label>\n    <select id=\"sg_select\">\n      <option value=\"P1\">P1 (No.1) — no absences<\/option>\n      <option value=\"P21\">P2₁ (No.4) — 0k0: k odd<\/option>\n      <option value=\"P21c\">P2₁/c (No.14) — 0k0: k odd; h0l: l odd<\/option>\n      <option value=\"P21n\" selected>P2₁/n (No.14) — 0k0: k odd; h0l: h+l odd<\/option>\n      <option value=\"C2c\">C2/c (No.15) — hkl: h+k odd; h0l: l odd<\/option>\n      <option value=\"Pnma\">Pnma (No.62) — 0kl: k+l odd; h0l: h odd; hk0: h+k odd<\/option>\n      <option value=\"Im3m\">Im-3m (No.229) — hkl: h+k+l odd<\/option>\n      <option value=\"Fm3m\">Fm-3m (No.225) — hkl: mixed h,k,l parity<\/option>\n    <\/select>\n  <\/div>\n  <button class=\"btn btn-primary\" id=\"btn_sg_gen\" style=\"margin-top:6px\">Generate reflection list<\/button>\n<\/div>\n\n<div class=\"card\">\n  <h3>Reflection table — present ✓ vs absent ✗<\/h3>\n  <p style=\"color:var(--fg2);font-size:13px;margin:0 0 10px\">The pattern shows which reflections have intensity. Can you identify the absence rule?<\/p>\n  <div id=\"sg_refl_table\" style=\"overflow-x:auto\"><\/div>\n  <div id=\"sg_absence_hint\" class=\"annot\" style=\"margin-top:10px;display:none\"><\/div>\n<\/div>\n\n<div class=\"card\">\n  <h3>Your deduction<\/h3>\n  <p style=\"color:var(--fg2);font-size:13px\">Select the conditions you observe:<\/p>\n  <div id=\"sg_condition_checks\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-bottom:12px\"><\/div>\n  <button class=\"btn btn-primary\" id=\"btn_sg_check\">Check my answer<\/button>\n  <div id=\"sg_feedback\" class=\"annot\" style=\"margin-top:10px;display:none\"><\/div>\n<\/div>\n<\/div>\n\n<!-- ═══════ PAGE 3: METHODS ═══════ -->\n<div class=\"page\" id=\"page-methods\">\n<div class=\"sect-hdr\"><span class=\"eyebrow\">Step 3–5<\/span><h2>Pawley, Le Bail & Rietveld<\/h2><\/div>\n\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>The three refinement methods<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"two-col\">\n    <div style=\"border:1px solid var(--border);border-radius:8px;padding:14px\">\n      <div style=\"font-weight:700;color:var(--accent);margin-bottom:6px\">Pawley<\/div>\n      <span class=\"badge badge-blue\">Profile fitting<\/span>\n      <ul style=\"font-size:13px;color:var(--fg2);margin:8px 0 0;padding-left:16px\">\n        <li>Refines cell + profile + <em>N free intensities<\/em> (1 per reflection)<\/li>\n        <li>Can give negative intensities (unphysical but statistically valid)<\/li>\n        <li>Best for: extracting F² for direct methods, confirming cell<\/li>\n      <\/ul>\n    <\/div>\n    <div style=\"border:1px solid var(--border);border-radius:8px;padding:14px\">\n      <div style=\"font-weight:700;color:var(--accent2);margin-bottom:6px\">Le Bail<\/div>\n      <span class=\"badge badge-amber\">Iterative extraction<\/span>\n      <ul style=\"font-size:13px;color:var(--fg2);margin:8px 0 0;padding-left:16px\">\n        <li>Partitions intensity among overlapping peaks iteratively<\/li>\n        <li>Intensities always ≥ 0<\/li>\n        <li>Faster convergence than Pawley<\/li>\n        <li>Best for: quick cell/profile check; feeding structure solution<\/li>\n      <\/ul>\n    <\/div>\n    <div style=\"border:1px solid var(--border);border-radius:8px;padding:14px\">\n      <div style=\"font-weight:700;color:var(--accent3);margin-bottom:6px\">Rietveld<\/div>\n      <span class=\"badge badge-green\">Full structure<\/span>\n      <ul style=\"font-size:13px;color:var(--fg2);margin:8px 0 0;padding-left:16px\">\n        <li>Full structural model: xyz + Beq + occ<\/li>\n        <li>Fits every data point simultaneously<\/li>\n        <li>Requires starting model from SA or direct methods<\/li>\n      <\/ul>\n    <\/div>\n    <div style=\"border:1px solid var(--border);border-radius:8px;padding:14px\">\n      <div style=\"font-weight:700;color:var(--fg);margin-bottom:4px\">Parameter count<\/div>\n      <div class=\"ctrl-row\" style=\"margin-bottom:6px\"><label style=\"min-width:80px;font-size:12px\">Atoms<\/label><input type=\"range\" id=\"m_natom\" min=\"5\" max=\"80\" step=\"1\" value=\"20\"><span class=\"val\" id=\"m_natom_lbl\">20<\/span><\/div>\n      <div class=\"ctrl-row\" style=\"margin-bottom:6px\"><label style=\"min-width:80px;font-size:12px\">Reflections<\/label><input type=\"range\" id=\"m_nrefl\" min=\"20\" max=\"400\" step=\"10\" value=\"150\"><span class=\"val\" id=\"m_nrefl_lbl\">150<\/span><\/div>\n      <div id=\"m_param_table\" style=\"font-size:12px\"><\/div>\n    <\/div>\n  <\/div>\n  <\/div><!-- end card-body -->\n<\/div><!-- end collapsible card -->\n\n<div class=\"card\">\n  <h3>Live Le Bail convergence — watch χ² fall<\/h3>\n  <div class=\"ctrl-row\">\n    <label>Crystal system<\/label>\n    <select id=\"lb_system\">\n      <option value=\"cubic\">Cubic<\/option>\n      <option value=\"monoclinic\" selected>Monoclinic<\/option>\n    <\/select>\n  <\/div>\n  <div class=\"ctrl-row\">\n    <label>Starting model quality<\/label>\n    <select id=\"lb_start\">\n      <option value=\"good\">Good start (cell from indexing)<\/option>\n      <option value=\"bad\">Poor start (cell ~5% wrong)<\/option>\n    <\/select>\n  <\/div>\n  <button class=\"btn btn-primary\" id=\"btn_lb_run\">▶ Animate Le Bail<\/button>\n  <button class=\"btn btn-secondary\" id=\"btn_lb_reset\">Reset<\/button>\n  <div class=\"canvas-wrap\" style=\"margin-top:10px\"><canvas id=\"lb_canvas\" height=\"260\"><\/canvas><\/div>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px\" id=\"lb_stats\"><\/div>\n  <div id=\"lb_stage_desc\" class=\"annot\" style=\"margin-top:8px\"><\/div>\n<\/div>\n\n<div class=\"card\">\n  <h3>TCHZ peak shape — interactive<\/h3>\n  <div class=\"canvas-wrap\"><canvas id=\"tchz_canvas\" height=\"220\"><\/canvas><\/div>\n  <div class=\"ctrl-row\"><label>U<\/label><input type=\"range\" id=\"sl_U\" min=\"-2\" max=\"2\" step=\"0.05\" value=\"-0.8\"><span class=\"val\" id=\"lbl_U\">-0.80<\/span><\/div>\n  <div class=\"ctrl-row\"><label>V<\/label><input type=\"range\" id=\"sl_V\" min=\"-0.5\" max=\"0.5\" step=\"0.01\" value=\"0.07\"><span class=\"val\" id=\"lbl_V\">0.07<\/span><\/div>\n  <div class=\"ctrl-row\"><label>W<\/label><input type=\"range\" id=\"sl_W\" min=\"0.001\" max=\"0.5\" step=\"0.001\" value=\"0.05\"><span class=\"val\" id=\"lbl_W\">0.05<\/span><\/div>\n  <div class=\"ctrl-row\"><label>X (Lorentzian)<\/label><input type=\"range\" id=\"sl_X\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.21\"><span class=\"val\" id=\"lbl_X\">0.21<\/span><\/div>\n  <div class=\"annot\"><strong>FWHM² = U·tan²θ + V·tanθ + W<\/strong> (Caglioti). At low 2θ W dominates; at high 2θ U dominates. FWHM_L = X/cosθ for size/strain broadening.<\/div>\n  <button class=\"more-info-toggle\" type=\"button\" style=\"margin-top:10px\"><span class=\"mi-chev\">▶<\/span> More info: TCHZ equations &amp; Scherrer formula<\/button>\n  <div class=\"more-info-body\">\n    <div class=\"math-block\">\n      <strong>Thompson–Cox–Hastings pseudo-Voigt (TCHZ):<\/strong><br>\n      The profile function at angle 2θ is a linear combination of Gaussian (G) and Lorentzian (L):<br>\n      <span class=\"eq\">P(2θ) = η·L(2θ) + (1−η)·G(2θ)<\/span>\n      where η (mixing parameter) depends on FWHM_G and FWHM_L.<br><br>\n      <strong>Caglioti FWHM:<\/strong> <span class=\"eq\">FWHM_G² = U tan²θ + V tanθ + W<\/span><br>\n      <strong>Lorentzian size:<\/strong> <span class=\"eq\">FWHM_L = X / cosθ<\/span><br><br>\n      <strong>Scherrer equation<\/strong> (crystallite size from peak broadening):<br>\n      <span class=\"eq\">τ = Kλ / (β cosθ)<\/span>\n      where τ = volume-weighted crystallite size, K ≈ 0.9 (shape factor), λ = wavelength, β = integral breadth (in radians).\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ─── Crystallinity card ─── -->\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Calculating % Crystallinity from PXRD<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n    <p style=\"color:var(--fg2);font-size:13px;margin:0 0 10px\">The degree of crystallinity X<sub>c<\/sub> is the fraction of the sample that is crystalline. PXRD measures it by comparing the area under sharp crystalline peaks to the total scattered intensity.<\/p>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px\">\n      <div style=\"border:1px solid var(--border);border-radius:8px;padding:12px\">\n        <div style=\"font-weight:700;color:var(--accent);margin-bottom:6px;font-size:13px\">Ruland / Vonk method<\/div>\n        <ul style=\"font-size:13px;color:var(--fg2);margin:0;padding-left:16px\">\n          <li>Fit a smooth amorphous hump baseline under the whole pattern<\/li>\n          <li>Integrate crystalline peak area A<sub>c<\/sub> (above baseline)<\/li>\n          <li>Integrate total area A<sub>total<\/sub><\/li>\n          <li>Apply a polarisation correction factor K(s)<\/li>\n        <\/ul>\n      <\/div>\n      <div style=\"border:1px solid var(--border);border-radius:8px;padding:12px\">\n        <div style=\"font-weight:700;color:var(--accent2);margin-bottom:6px;font-size:13px\">Peak area ratio<\/div>\n        <ul style=\"font-size:13px;color:var(--fg2);margin:0;padding-left:16px\">\n          <li>Deconvolute each reflection from the amorphous hump<\/li>\n          <li>Simpler but less rigorous<\/li>\n          <li>Common in polymer crystallography (e.g. PET, PLA, starch)<\/li>\n          <li>Sensitive to baseline choice — report your method<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n    <div class=\"math-block\">\n      <strong>Ruland formula:<\/strong><br>\n      <span class=\"eq\">X<sub>c<\/sub> = A<sub>c<\/sub> / (A<sub>c<\/sub> + A<sub>a<\/sub>)<\/span>\n      where A<sub>c<\/sub> = area under crystalline Bragg peaks, A<sub>a<\/sub> = area under amorphous hump.<br><br>\n      <strong>Peak fitting approach (most common in practice):<\/strong><br>\n      1. Load the PXRD pattern into TOPAS, GSAS-II, or HighScore Plus.<br>\n      2. Fit all crystalline peaks with pseudo-Voigt functions.<br>\n      3. Add a broad Gaussian (or polynomial) for the amorphous component.<br>\n      4. <span class=\"eq\">X<sub>c<\/sub> (%) = Σ(crystalline peak areas) / Σ(all peak areas) × 100<\/span><br><br>\n      <strong>Practical rules of thumb:<\/strong><br>\n      • Use the 2θ range 10°–80° for most organic/inorganic samples.<br>\n      • For polymers: compare a fully amorphous reference pattern.<br>\n      • Report uncertainty (±2–5%) and the baseline model used.<br>\n      • Preferred orientation can inflate or deflate peak areas — check!\n    <\/div>\n    <div class=\"annot amber\" style=\"margin-top:8px\"><strong>Important:<\/strong> X<sub>c<\/sub> from PXRD is a relative measurement. Absolute crystallinity requires independent calibration against a well-characterised standard or DSC enthalpy data.<\/div>\n  <\/div>\n<\/div>\n\n<\/div>\n\n<!-- ═══════ PAGE 4: INSTRUMENT ═══════ -->\n<div class=\"page\" id=\"page-instrument\">\n<div class=\"sect-hdr\"><span class=\"eyebrow\">Step 4<\/span><h2>Instrument Setup & Geometry<\/h2><\/div>\n\n<div class=\"card\">\n  <h3>Transmission vs Reflection — side by side<\/h3>\n  <p style=\"color:var(--fg2);font-size:13px;margin:0 0 10px\">The same sample measured in both geometries. Adjust parameters and watch the pattern change.<\/p>\n  <div class=\"canvas-wrap\"><canvas id=\"instr_canvas\" height=\"300\"><\/canvas><\/div>\n  <div class=\"two-col\" style=\"margin-top:10px\">\n    <div>\n      <div style=\"font-weight:600;color:var(--accent);margin-bottom:6px;font-size:13px\">Transmission (Debye-Scherrer)<\/div>\n      <div class=\"ctrl-row\"><label style=\"min-width:120px;font-size:12px\">Capillary dia (mm)<\/label><input type=\"range\" id=\"tr_cap\" min=\"0.1\" max=\"1.0\" step=\"0.05\" value=\"0.3\"><span class=\"val\" id=\"tr_cap_lbl\">0.30<\/span><\/div>\n      <div class=\"ctrl-row\"><label style=\"min-width:120px;font-size:12px\">Axial divergence<\/label><input type=\"range\" id=\"tr_axial\" min=\"0\" max=\"4\" step=\"0.1\" value=\"0.5\"><span class=\"val\" id=\"tr_axial_lbl\">0.5<\/span><\/div>\n    <\/div>\n    <div>\n      <div style=\"font-weight:600;color:var(--accent2);margin-bottom:6px;font-size:13px\">Reflection (Bragg-Brentano)<\/div>\n      <div class=\"ctrl-row\"><label style=\"min-width:120px;font-size:12px\">Receiving slit (°)<\/label><input type=\"range\" id=\"bb_slit\" min=\"0.01\" max=\"0.5\" step=\"0.01\" value=\"0.1\"><span class=\"val\" id=\"bb_slit_lbl\">0.10<\/span><\/div>\n      <div class=\"ctrl-row\"><label style=\"min-width:120px;font-size:12px\">Preferred orient.<\/label><input type=\"range\" id=\"bb_po\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0\"><span class=\"val\" id=\"bb_po_lbl\">0.00<\/span><\/div>\n    <\/div>\n  <\/div>\n  <div id=\"instr_note\" class=\"annot amber\" style=\"margin-top:8px\"><\/div>\n<\/div>\n\n<div class=\"card\">\n  <h3>Zero error & wavelength calibration<\/h3>\n  <div class=\"canvas-wrap\"><canvas id=\"zeroerr_canvas\" height=\"180\"><\/canvas><\/div>\n  <div class=\"ctrl-row\"><label>Zero error Δ(2θ) °<\/label><input type=\"range\" id=\"sl_zero\" min=\"-0.15\" max=\"0.15\" step=\"0.005\" value=\"0\"><span class=\"val\" id=\"lbl_zero\">0.000°<\/span><\/div>\n  <div class=\"annot\"><strong>Effect:<\/strong> A zero error shifts ALL peaks by the same Δ(2θ). It shifts d-spacings systematically and will produce a wrong cell if not corrected. Always refine zero error in the first Le Bail fit.<\/div>\n<\/div>\n\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>TOPAS → GSAS-II parameter translation<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <table class=\"tbl\">\n    <thead><tr><th>TOPAS<\/th><th>GSAS-II<\/th><th>Meaning<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td><code>pku/pkv/pkw<\/code><\/td><td><code>GU, GV, GW<\/code><\/td><td>Gaussian Caglioti U,V,W<\/td><\/tr>\n      <tr><td><code>pkx<\/code><\/td><td><code>LX<\/code><\/td><td>Lorentzian size broadening<\/td><\/tr>\n      <tr><td><code>Simple_Axial_Model<\/code><\/td><td>Axial model L, H/L<\/td><td>Axial divergence<\/td><\/tr>\n      <tr><td><code>Zero_Error<\/code><\/td><td><code>Zero<\/code><\/td><td>2θ zero offset<\/td><\/tr>\n      <tr><td><code>bkg @<\/code><\/td><td>Background coeff.<\/td><td>Chebyshev polynomial<\/td><\/tr>\n      <tr><td><code>Auto_T(10)<\/code><\/td><td>SA Temperature factor<\/td><td>SA initial temperature<\/td><\/tr>\n      <tr><td><code>scale @<\/code><\/td><td>Scale factor<\/td><td>Overall scale<\/td><\/tr>\n    <\/tbody>\n  <\/table>\n  <\/div><!-- end card-body -->\n<\/div><!-- end collapsible card -->\n<\/div><!-- end page-instrument -->\n\n<!-- ═══════ PAGE 5: CHALLENGE ═══════ -->\n<div class=\"page\" id=\"page-challenge\">\n<div class=\"sect-hdr\"><span class=\"eyebrow\">Test yourself<\/span><h2>Challenge Mode<\/h2><\/div>\n\n<div class=\"card\">\n  <h3>Unknown sample<\/h3>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px\">\n    <button class=\"btn btn-primary\" id=\"btn_new_challenge\">New Challenge<\/button>\n    <button class=\"btn btn-secondary\" id=\"btn_show_answer\">Reveal answer<\/button>\n    <span id=\"ch_difficulty\" class=\"badge badge-amber\" style=\"line-height:30px\">—<\/span>\n  <\/div>\n  <button class=\"more-info-toggle\" type=\"button\"><span class=\"mi-chev\">▶<\/span> How to approach it<\/button>\n  <div class=\"more-info-body\">\n    <p style=\"font-size:13px;color:var(--fg2);margin:8px 0 0\">A PXRD pattern has been generated from an unknown crystal structure. The crystal system, cell parameters and space group are hidden. Work through each step to determine the structure.<\/p>\n    <ol style=\"font-size:13px;color:var(--fg2);padding-left:18px;margin:6px 0 0\">\n      <li>Auto-pick or manually click peaks in the pattern below.<\/li>\n      <li>Run the indexer — look for high M₂₀ solutions.<\/li>\n      <li>Identify systematic absences in the reflection table to deduce the space group.<\/li>\n      <li>Fill in your answer and submit.<\/li>\n    <\/ol>\n  <\/div>\n<\/div>\n\n<div class=\"card\" id=\"ch_pattern_card\">\n  <h3>Pattern — pick peaks and index<\/h3>\n  <div class=\"canvas-wrap\"><canvas id=\"ch_canvas\" height=\"220\"><\/canvas><\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:8px\">\n    <button class=\"btn btn-secondary\" id=\"ch_btn_clear\">Clear picks<\/button>\n    <button class=\"btn btn-secondary\" id=\"ch_btn_autopick\">Auto-pick<\/button>\n    <button class=\"btn btn-primary\" id=\"ch_btn_index\">Index picked peaks<\/button>\n  <\/div>\n  <div id=\"ch_index_result\" style=\"margin-top:10px\"><\/div>\n<\/div>\n\n<div class=\"card\">\n  <h3>Your deductions<\/h3>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px\">\n    <div>\n      <div style=\"font-size:12px;color:var(--fg3);font-weight:600;text-transform:uppercase;margin-bottom:4px\">Crystal system<\/div>\n      <select id=\"ch_system\" style=\"width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg)\">\n        <option value=\"\">— select —<\/option>\n        <option>Cubic<\/option><option>Tetragonal<\/option><option>Orthorhombic<\/option>\n        <option>Monoclinic<\/option><option>Triclinic<\/option><option>Hexagonal<\/option>\n      <\/select>\n    <\/div>\n    <div>\n      <div style=\"font-size:12px;color:var(--fg3);font-weight:600;text-transform:uppercase;margin-bottom:4px\">Space group<\/div>\n      <input id=\"ch_sg_input\" type=\"text\" placeholder=\"e.g. P2₁/n\" style=\"width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:14px\">\n    <\/div>\n    <div>\n      <div style=\"font-size:12px;color:var(--fg3);font-weight:600;text-transform:uppercase;margin-bottom:4px\">Cell a (Å)<\/div>\n      <input id=\"ch_a\" type=\"number\" step=\"0.01\" placeholder=\"?\" style=\"width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:14px\">\n    <\/div>\n    <div>\n      <div style=\"font-size:12px;color:var(--fg3);font-weight:600;text-transform:uppercase;margin-bottom:4px\">Cell b (Å)<\/div>\n      <input id=\"ch_b\" type=\"number\" step=\"0.01\" placeholder=\"?\" style=\"width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:14px\">\n    <\/div>\n    <div>\n      <div style=\"font-size:12px;color:var(--fg3);font-weight:600;text-transform:uppercase;margin-bottom:4px\">Cell c (Å)<\/div>\n      <input id=\"ch_c\" type=\"number\" step=\"0.01\" placeholder=\"?\" style=\"width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:14px\">\n    <\/div>\n    <div>\n      <div style=\"font-size:12px;color:var(--fg3);font-weight:600;text-transform:uppercase;margin-bottom:4px\">β angle (°)<\/div>\n      <input id=\"ch_beta\" type=\"number\" step=\"0.1\" placeholder=\"90?\" style=\"width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:14px\">\n    <\/div>\n  <\/div>\n  <button class=\"btn btn-green\" id=\"btn_ch_submit\" style=\"margin-top:12px\">Submit answer<\/button>\n  <div id=\"ch_feedback\" class=\"annot\" style=\"margin-top:10px;display:none\"><\/div>\n<\/div>\n\n<div class=\"card\" id=\"ch_answer_card\" style=\"display:none\">\n  <h3>Answer<\/h3>\n  <div id=\"ch_answer_content\"><\/div>\n<\/div>\n<\/div>\n\n<!-- ═══════ PAGE 6: YOUR DATA ═══════ -->\n<div class=\"page\" id=\"page-mydata\">\n<div class=\"sect-hdr\"><span class=\"eyebrow\">Your own data<\/span><h2>Fit Your Powder Pattern<\/h2><\/div>\n\n<!-- Step indicator -->\n<div style=\"display:flex;gap:0;margin-bottom:18px;border-radius:var(--card-r);overflow:hidden;border:1px solid var(--border)\">\n  <div class=\"ud-step-tab active\" id=\"ud_tab1\" style=\"flex:1;padding:10px 8px;text-align:center;background:var(--accent);color:#fff;font-size:12px;font-weight:700;cursor:pointer\">① Load<\/div>\n  <div class=\"ud-step-tab\" id=\"ud_tab2\" style=\"flex:1;padding:10px 8px;text-align:center;background:var(--bg3);color:var(--fg3);font-size:12px;font-weight:700;cursor:default;border-left:1px solid var(--border)\">② Index<\/div>\n  <div class=\"ud-step-tab\" id=\"ud_tab3\" style=\"flex:1;padding:10px 8px;text-align:center;background:var(--bg3);color:var(--fg3);font-size:12px;font-weight:700;cursor:default;border-left:1px solid var(--border)\">③ Le Bail fit<\/div>\n<\/div>\n\n<!-- ── STEP 1: Load ── -->\n<div id=\"ud_step1\">\n<div class=\"card\">\n  <h3>Step 1 — Load your pattern<\/h3>\n  <p style=\"color:var(--fg2);font-size:13px;margin:0 0 10px\">Upload any two-column ASCII file (<code>2θ  intensity<\/code>) or Panalytical XRDML. Then set your wavelength.<\/p>\n\n  <div style=\"display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px\">\n    <label style=\"display:flex;flex-direction:column;gap:4px;flex:1;min-width:200px\">\n      <span style=\"font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em\">Upload file (.xy .dat .csv .asc .xrdml)<\/span>\n      <input type=\"file\" id=\"ud_file\" accept=\".xy,.dat,.csv,.asc,.txt,.xrdml,.raw\" style=\"font-size:13px;padding:6px;border:1px solid var(--border);border-radius:7px;background:var(--bg2);color:var(--fg);cursor:pointer\">\n    <\/label>\n    <label style=\"display:flex;flex-direction:column;gap:4px;flex:2;min-width:260px\">\n      <span style=\"font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em\">Or paste data (2θ  intensity, one point per line)<\/span>\n      <textarea id=\"ud_paste\" rows=\"4\" placeholder=\"10.234  142&#10;10.368  158&#10;10.502  167&#10;...\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px;border:1px solid var(--border);border-radius:7px;background:var(--bg2);color:var(--fg);resize:vertical;width:100%\"><\/textarea>\n    <\/label>\n  <\/div>\n\n  <div style=\"font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px\">Wavelength<\/div>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-bottom:10px\" id=\"ud_lam_presets\"><\/div>\n  <div class=\"ctrl-row\" style=\"margin-bottom:12px\">\n    <label style=\"min-width:90px;font-size:12px\">Custom λ (Å)<\/label>\n    <input type=\"number\" id=\"ud_lam_custom\" step=\"0.0001\" value=\"1.5406\" style=\"width:120px;padding:5px 7px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:13px;font-family:'JetBrains Mono',monospace\">\n  <\/div>\n\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n    <button class=\"btn btn-primary\" id=\"ud_btn_load\">Load pattern<\/button>\n    <button class=\"btn btn-secondary\" id=\"ud_btn_demo\">Use demo pattern (monoclinic, Cu Kα)<\/button>\n  <\/div>\n  <div id=\"ud_load_status\" class=\"annot\" style=\"margin-top:8px;display:none\"><\/div>\n<\/div>\n\n<div class=\"card\" id=\"ud_pattern_card\" style=\"display:none\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px\">\n    <h3 style=\"margin:0\">Loaded pattern<\/h3>\n    <button class=\"btn btn-primary\" id=\"ud_btn_go_index\">Next: Index peaks →<\/button>\n  <\/div>\n  <div class=\"canvas-wrap\"><canvas id=\"ud_raw_canvas\" height=\"220\"><\/canvas><\/div>\n  <div id=\"ud_pattern_info\" style=\"font-size:12px;color:var(--fg3);margin-top:6px\"><\/div>\n<\/div>\n<\/div>\n\n<!-- ── STEP 2: Index ── -->\n<div id=\"ud_step2\" style=\"display:none\">\n<div class=\"card\">\n  <h3>Step 2 — Pick peaks &amp; index<\/h3>\n  <p style=\"color:var(--fg2);font-size:13px;margin:0 0 10px\">Click on the pattern to pick peaks, or auto-pick. The table below shows each peak with its relative intensity — delete impurity peaks, choose how many lines to send to indexing, then run all three algorithms.<\/p>\n  <div class=\"canvas-wrap\" id=\"ud_idx_wrap\"><canvas id=\"ud_idx_canvas\" height=\"220\"><\/canvas><\/div>\n  <div id=\"ud_idx_pick_status\" class=\"annot\" style=\"margin-top:6px\">Auto-pick or click individual peaks on the pattern above.<\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center\">\n    <button class=\"btn btn-secondary\" id=\"ud_btn_clear_picks\">Clear all<\/button>\n    <button class=\"btn btn-secondary\" id=\"ud_btn_autopick\">Auto-pick all peaks<\/button>\n    <label style=\"font-size:13px;color:var(--fg2);margin-left:8px\">Use strongest\n      <select id=\"ud_topn\" style=\"margin-left:4px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:13px\">\n        <option value=\"0\">all picked<\/option>\n        <option value=\"10\">10 lines<\/option>\n        <option value=\"15\">15 lines<\/option>\n        <option value=\"20\">20 lines<\/option>\n        <option value=\"25\">25 lines<\/option>\n        <option value=\"30\">30 lines<\/option>\n      <\/select>\n      for indexing\n    <\/label>\n    <label style=\"font-size:13px;color:var(--fg2);margin-left:16px\">2θ range:\n      <input type=\"number\" id=\"ud_tth_min\" min=\"0\" max=\"170\" step=\"0.5\" placeholder=\"min\" style=\"width:58px;margin:0 3px;padding:4px 5px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:13px\">\n      –\n      <input type=\"number\" id=\"ud_tth_max\" min=\"1\" max=\"170\" step=\"0.5\" placeholder=\"max\" style=\"width:58px;margin:0 3px 0 3px;padding:4px 5px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:13px\">\n      °\n    <\/label>\n  <\/div>\n\n  <!-- Peak table -->\n  <div id=\"ud_peak_table_wrap\" style=\"margin-top:10px;display:none\">\n    <div style=\"font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px\">Picked peaks<\/div>\n    <div style=\"overflow-x:auto;max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:6px\">\n      <table class=\"tbl\" id=\"ud_peak_tbl\" style=\"font-size:12px;min-width:360px\">\n        <thead><tr><th>#<\/th><th>2θ (°)<\/th><th>d (Å)<\/th><th>I (%)<\/th><th>Bar<\/th><th>Use<\/th><th><\/th><\/tr><\/thead>\n        <tbody id=\"ud_peak_tbl_body\"><\/tbody>\n      <\/table>\n    <\/div>\n    <div style=\"font-size:11px;color:var(--fg3);margin-top:4px\" id=\"ud_peak_tbl_note\"><\/div>\n  <\/div>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px\">\n    <div style=\"border:1px solid var(--border);border-radius:8px;padding:12px\">\n      <div style=\"font-weight:700;color:var(--accent);font-size:13px;margin-bottom:4px\">TREOR<\/div>\n      <div style=\"font-size:12px;color:var(--fg2);margin-bottom:8px\">Exhaustive trial of integer ratios of 1/d². Fast for cubic &amp; tetragonal; struggles with monoclinic.<\/div>\n      <button class=\"btn btn-primary\" id=\"ud_btn_treor\" style=\"width:100%\">Run TREOR<\/button>\n    <\/div>\n    <div style=\"border:1px solid var(--border);border-radius:8px;padding:12px\">\n      <div style=\"font-weight:700;color:var(--accent2);font-size:13px;margin-bottom:4px\">DICVOL<\/div>\n      <div style=\"font-size:12px;color:var(--fg2);margin-bottom:8px\">Systematic volume scan from small V upward. Reliable for all systems including monoclinic &amp; triclinic.<\/div>\n      <button class=\"btn btn-amber\" id=\"ud_btn_dicvol\" style=\"width:100%\">Run DICVOL<\/button>\n    <\/div>\n    <div style=\"border:1px solid var(--border);border-radius:8px;padding:12px\">\n      <div style=\"font-weight:700;color:var(--accent3);font-size:13px;margin-bottom:4px\">McMaille / FOX-style<\/div>\n      <div style=\"font-size:12px;color:var(--fg2);margin-bottom:8px\">Monte Carlo: random cell proposals, score by Σ|d_obs−d_calc|, accept/reject with temperature cooling.<\/div>\n      <button class=\"btn btn-green\" id=\"ud_btn_mcmaille\" style=\"width:100%\">Run MC indexing<\/button>\n    <\/div>\n  <\/div>\n  <div id=\"ud_idx_running\" style=\"display:none;margin-top:10px\" class=\"annot\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <div id=\"ud_idx_spinner\" style=\"width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0\"><\/div>\n      <span id=\"ud_idx_running_msg\">Running…<\/span>\n    <\/div>\n    <div class=\"prog-wrap\" style=\"margin-top:6px\"><div class=\"prog-bar\" id=\"ud_idx_prog\" style=\"width:0%\"><\/div><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\" id=\"ud_index_result_card\" style=\"display:none\">\n  <h3>Indexing results — all algorithms<\/h3>\n  <div class=\"annot amber\" style=\"margin-bottom:10px\"><strong>How to choose:<\/strong> M₂₀ ≥ 10 is acceptable; ≥ 20 is good. If TREOR and DICVOL agree, the solution is reliable. If only one finds it, use DICVOL. After least-squares refinement Rwp_cell should drop sharply.<\/div>\n  <div id=\"ud_index_result_body\"><\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:12px\">\n    <button class=\"btn btn-green\" id=\"ud_btn_use_cell\">Use top solution → Le Bail fit<\/button>\n    <button class=\"btn btn-secondary\" id=\"ud_btn_lsq_refine\" style=\"display:none\">Least-squares refine top solution<\/button>\n    <button class=\"btn btn-secondary\" id=\"ud_btn_back1\">← Back to load<\/button>\n  <\/div>\n<\/div>\n<\/div>\n\n<!-- ── STEP 3: Le Bail fit ── -->\n<div id=\"ud_step3\" style=\"display:none\">\n<div class=\"card\">\n  <h3>Step 3 — Le Bail fit<\/h3>\n  <p style=\"color:var(--fg2);font-size:13px;margin:0 0 10px\">Cell parameters pre-filled from indexing. Adjust if needed, choose what to refine, then run.<\/p>\n  <div class=\"two-col\">\n    <div>\n      <div style=\"font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px\">Crystal system<\/div>\n      <select id=\"ud_system\" style=\"width:100%;padding:7px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:13px;margin-bottom:12px\">\n        <option value=\"cubic\">Cubic<\/option>\n        <option value=\"tetragonal\">Tetragonal<\/option>\n        <option value=\"orthorhombic\">Orthorhombic<\/option>\n        <option value=\"monoclinic\" selected>Monoclinic<\/option>\n      <\/select>\n      <div style=\"font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px\">Wavelength: <span id=\"ud_lam_display\" style=\"color:var(--accent);font-family:'JetBrains Mono',monospace\">1.5406 Å<\/span><\/div>\n    <\/div>\n    <div>\n      <div style=\"font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px\">Starting cell (Å, °)<\/div>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:6px\">\n        <div><div style=\"font-size:10px;color:var(--fg3);margin-bottom:2px\">a<\/div><input type=\"number\" id=\"ud_a\" step=\"0.01\" value=\"7.28\" style=\"width:100%;padding:4px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:12px\"><\/div>\n        <div><div style=\"font-size:10px;color:var(--fg3);margin-bottom:2px\">b<\/div><input type=\"number\" id=\"ud_b\" step=\"0.01\" value=\"9.53\" style=\"width:100%;padding:4px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:12px\"><\/div>\n        <div><div style=\"font-size:10px;color:var(--fg3);margin-bottom:2px\">c<\/div><input type=\"number\" id=\"ud_c\" step=\"0.01\" value=\"9.76\" style=\"width:100%;padding:4px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:12px\"><\/div>\n        <div><div style=\"font-size:10px;color:var(--fg3);margin-bottom:2px\">β (°)<\/div><input type=\"number\" id=\"ud_beta\" step=\"0.1\" value=\"98.5\" style=\"width:100%;padding:4px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:12px\"><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div style=\"margin-top:12px\">\n    <div style=\"font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px\">Refine<\/div>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <label style=\"display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer\"><input type=\"checkbox\" id=\"ud_ref_cell\" checked style=\"accent-color:var(--accent)\"> Cell<\/label>\n      <label style=\"display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer\"><input type=\"checkbox\" id=\"ud_ref_zero\" checked style=\"accent-color:var(--accent)\"> Zero error<\/label>\n      <label style=\"display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer\"><input type=\"checkbox\" id=\"ud_ref_bkg\" checked style=\"accent-color:var(--accent)\"> Background<\/label>\n      <label style=\"display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer\"><input type=\"checkbox\" id=\"ud_ref_profile\" checked style=\"accent-color:var(--accent)\"> Profile (W, X)<\/label>\n    <\/div>\n  <\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px\">\n    <button class=\"btn btn-primary\" id=\"ud_btn_fit\">▶ Run Le Bail fit<\/button>\n    <button class=\"btn btn-secondary\" id=\"ud_btn_back2\">← Back to indexing<\/button>\n    <button class=\"btn btn-secondary\" id=\"ud_btn_reset_fit\">Reset fit<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"card\" id=\"ud_result_card\" style=\"display:none\">\n  <h3>Fit result<\/h3>\n  <div class=\"canvas-wrap\"><canvas id=\"ud_fit_canvas\" height=\"280\"><\/canvas><\/div>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px\" id=\"ud_fit_stats\"><\/div>\n  <div id=\"ud_fit_cell\" class=\"annot green\" style=\"margin-top:10px;display:none\"><\/div>\n  <div class=\"annot amber\" style=\"margin-top:8px\"><strong>Note:<\/strong> Educational Le Bail engine — refines cell, zero error, background and profile to minimise Rwp. For publication results use TOPAS, GSAS-II or FullProf.<\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div class=\"page\" id=\"page-more\">\n<div class=\"sect-hdr\"><span class=\"eyebrow\">Reference<\/span><h2>More topics<\/h2><\/div>\n<p style=\"color:var(--fg2);margin:0 0 14px\">Extra background and diagnostics from the earlier guide. Click a title to open it.<\/p>\n<div class=\"more-grp\">Background<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>What PXRD tells you<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <p>Powder X-ray diffraction (PXRD) records the intensity of X-rays scattered by a polycrystalline sample as a function of angle (2θ). Every crystalline phase produces a unique fingerprint of peaks — their positions encode the unit cell geometry; their intensities encode atomic positions and types.<\/p>\n  <p>From a PXRD pattern we can determine: <strong>crystal system<\/strong> (cubic, monoclinic…), <strong>unit cell parameters<\/strong> (a, b, c, α, β, γ), <strong>space group<\/strong> (symmetry operations), and ultimately <strong>atomic coordinates<\/strong> via Rietveld refinement.<\/p>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Roadmap: from pattern to structure<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"steps\">\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Collect data<\/h4><p>Choose geometry, wavelength, instrument. Collect good-quality data with correct instrument parameters.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Index the pattern<\/h4><p>Assign Miller indices (h k l) to each peak. Determine the unit cell and crystal system.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Determine the space group<\/h4><p>Identify systematic absences. Narrow down the space group.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Pawley or Le Bail fit<\/h4><p>Fit peak positions and widths without a structural model. Confirm the cell and instrument parameters.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Rietveld refinement<\/h4><p>Introduce atomic positions. Refine structure against the full diffraction pattern.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Validate<\/h4><p>Check R-factors, bond lengths, displacement parameters. Run PLATON ADDSYM.<\/p><\/div><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div class=\"more-grp\">Indexing and space groups<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Bragg's Law explorer<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"canvas-wrap\"><canvas id=\"x_braggCanvas\" width=\"860\" height=\"220\"><\/canvas><\/div>\n  <div class=\"ctrl-row\"><label>d-spacing (Å)<\/label><input type=\"range\" id=\"x_sl_d\" min=\"1\" max=\"8\" step=\"0.05\" value=\"3.0\" oninput=\"XB.drawBragg()\"><span id=\"x_lbl_d\">3.00<\/span><\/div>\n  <div class=\"ctrl-row\"><label>Wavelength λ (Å)<\/label><input type=\"range\" id=\"x_sl_lam\" min=\"0.3\" max=\"2.5\" step=\"0.01\" value=\"1.5406\" oninput=\"XB.drawBragg()\"><span id=\"x_lbl_lam\">1.54<\/span><\/div>\n  <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-top:10px\">\n    <div class=\"annot\" style=\"flex:1;margin:0\"><strong>2θ =<\/strong> <span id=\"x_tth_out\" style=\"font-family:monospace;color:var(--accent);font-size:16px\">30.0°<\/span><\/div>\n    <div class=\"annot\" style=\"flex:1;margin:0\"><strong>d =<\/strong> <span id=\"x_d_out\" style=\"font-family:monospace;color:var(--accent2);font-size:16px\">3.00 Å<\/span><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>d-spacing table for a cubic cell<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"ctrl-row\"><label>Cell parameter a (Å)<\/label><input type=\"range\" id=\"x_sl_a_cub\" min=\"3\" max=\"12\" step=\"0.05\" value=\"5.64\" oninput=\"XB.drawCubicTable()\"><span id=\"x_lbl_a_cub\">5.64<\/span><\/div>\n  <div class=\"ctrl-row\"><label>Wavelength (Å)<\/label><input type=\"range\" id=\"x_sl_lam2\" min=\"0.3\" max=\"2.5\" step=\"0.01\" value=\"1.5406\" oninput=\"XB.drawCubicTable()\"><span id=\"x_lbl_lam2\">1.54<\/span><\/div>\n  <div id=\"x_cubic_table\" style=\"overflow-x:auto\"><\/div>\n  <div class=\"annot amber\"><strong>Note:<\/strong> For cubic: d(hkl) = a / √(h²+k²+l²). The ratio of sin²θ values for different peaks gives integers — this is the classic powder indexing test.<\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Common monoclinic space groups and their absences<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"abs-grid\">\n    <div class=\"compare-card\">\n      <h4>P2₁/c (No. 14)<\/h4>\n      <p>Most common space group in the CSD (~35% of organic structures)<\/p>\n      <ul><li>0k0: k=2n+1 absent (2₁ axis)<\/li><li>h0l: l=2n+1 absent (c glide)<\/li><\/ul>\n    <\/div>\n    <div class=\"compare-card\">\n      <h4>P2₁/n (No. 14 alt)<\/h4>\n      <p>Setting of P2₁/c. Used for Ni0183.<\/p>\n      <ul><li>0k0: k=2n+1 absent<\/li><li>h0l: h+l=2n+1 absent (n glide)<\/li><\/ul>\n    <\/div>\n    <div class=\"compare-card\">\n      <h4>C2/c (No. 15)<\/h4>\n      <p>C-centred monoclinic. Common for coordination polymers.<\/p>\n      <ul><li>hkl: h+k=2n+1 absent (C centering)<\/li><li>h0l: l=2n+1 absent (c glide)<\/li><\/ul>\n    <\/div>\n    <div class=\"compare-card\">\n      <h4>P2₁ (No. 4)<\/h4>\n      <p>Chiral monoclinic. No inversion centre.<\/p>\n      <ul><li>0k0: k=2n+1 absent (2₁ axis only)<\/li><li>No other conditions<\/li><\/ul>\n    <\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>From absences to space group<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"steps\">\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Identify the crystal system<\/h4><p>From indexing — the metric symmetry of the cell tells you the crystal system (monoclinic if only β≠90°).<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Check all hkl reflections<\/h4><p>Look for systematic patterns of absence. Use Le Bail fit — if intensity refines to exactly zero for a class, it is absent.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Consult International Tables<\/h4><p>Match the observed absences to the extinction symbol in Volume A. This gives 1–4 candidate space groups.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Test candidates<\/h4><p>Try SA structure solution in each. The lowest Rwp with chemically sensible geometry wins. Validate with PLATON ADDSYM.<\/p><\/div><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div class=\"more-grp\">Refinement<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Parameter count: Pawley vs Le Bail vs Rietveld<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"ctrl-row\"><label>Atoms in structure<\/label><input type=\"range\" id=\"x_sl_natom\" min=\"5\" max=\"80\" step=\"1\" value=\"20\" oninput=\"XB.updateParamCount()\"><span id=\"x_lbl_natom\">20<\/span><\/div>\n  <div class=\"ctrl-row\"><label>Reflections observed<\/label><input type=\"range\" id=\"x_sl_nrefl\" min=\"20\" max=\"400\" step=\"10\" value=\"150\" oninput=\"XB.updateParamCount()\"><span id=\"x_lbl_nrefl\">150<\/span><\/div>\n  <div id=\"x_param_count_table\" style=\"overflow-x:auto;margin-top:12px\"><\/div>\n  <div class=\"annot amber\" id=\"x_param_advice\"><\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>How the three methods fit the pattern<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"canvas-wrap\"><canvas id=\"x_methodCanvas\" width=\"860\" height=\"300\"><\/canvas><\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px\">\n    <button class=\"btn btn-secondary\" onclick=\"XB.setMethod('lebail')\">Le Bail<\/button>\n    <button class=\"btn btn-secondary\" onclick=\"XB.setMethod('pawley')\">Pawley<\/button>\n    <button class=\"btn btn-primary\" onclick=\"XB.setMethod('rietveld')\">Rietveld<\/button>\n    <button class=\"btn btn-secondary\" onclick=\"XB.animateMethod()\">▶ Animate convergence<\/button>\n  <\/div>\n  <div id=\"x_method_desc\" class=\"annot\"><\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>From Le Bail to Rietveld<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"annot green\"><strong>Key insight:<\/strong> Le Bail / Pawley validate the instrument model (profile, background, cell). Once Rwp is low (&lt;15% for synchrotron), the instrument parameters are trustworthy. You then <em>freeze them<\/em> and add the structural model on top — this is exactly what SA does.<\/div>\n  <div class=\"steps\" style=\"margin-top:14px\">\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Le Bail fit — refine everything except structure<\/h4><p>Cell, background, peak shape, zero error, axial divergence. Get Rwp as low as possible. This is your baseline.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>SA structure solution — keep instrument parameters fixed<\/h4><p>Import the Le Bail .out file. Lock all instrument parameters. Let SA move the rigid body. Best-Rwp shows whether the structure is solved.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Rietveld — release parameters gradually<\/h4><p>Release: (1) scale; (2) cell; (3) profile; (4) xyz; (5) Beq; (6) everything together. Never release everything at once — the refinement will diverge.<\/p><\/div><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>What to refine, and when<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <p>Click each parameter group to toggle it. The table shows what it affects, typical starting values, and when to release it.<\/p>\n  <div id=\"x_param_grid\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px\"><\/div>\n  <div id=\"x_param_detail\" class=\"annot\"><\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>TCHZ peak shape parameters explained<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"canvas-wrap\"><canvas id=\"x_tchzCanvas\" width=\"860\" height=\"260\"><\/canvas><\/div>\n  <div class=\"ctrl-row\"><label>U (Gaussian width slope²)<\/label><input type=\"range\" id=\"x_sl_U\" min=\"-2\" max=\"2\" step=\"0.05\" value=\"-0.8\" oninput=\"XB.drawTCHZ()\"><span id=\"x_lbl_U\">-0.80<\/span><\/div>\n  <div class=\"ctrl-row\"><label>V (Gaussian width slope)<\/label><input type=\"range\" id=\"x_sl_V\" min=\"-0.5\" max=\"0.5\" step=\"0.01\" value=\"0.07\" oninput=\"XB.drawTCHZ()\"><span id=\"x_lbl_V\">0.07<\/span><\/div>\n  <div class=\"ctrl-row\"><label>W (Gaussian constant)<\/label><input type=\"range\" id=\"x_sl_W\" min=\"0.001\" max=\"0.5\" step=\"0.001\" value=\"0.05\" oninput=\"XB.drawTCHZ()\"><span id=\"x_lbl_W\">0.05<\/span><\/div>\n  <div class=\"ctrl-row\"><label>X (Lorentzian size)<\/label><input type=\"range\" id=\"x_sl_X\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.21\" oninput=\"XB.drawTCHZ()\"><span id=\"x_lbl_X\">0.21<\/span><\/div>\n  <div class=\"annot\"><strong>FWHM_G² = U·tan²θ + V·tanθ + W<\/strong> — Caglioti formula for Gaussian width. At low angle W dominates; at high angle U dominates. <strong>FWHM_L = X/cosθ<\/strong> — Lorentzian (size/microstrain broadening).<\/div>\n<\/div>\n<\/div>\n<div class=\"more-grp\">Fit quality<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>What Rp, Rwp and χ² mean<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <table class=\"tbl\">\n    <thead><tr><th>R-factor<\/th><th>Formula<\/th><th>Weights?<\/th><th>What it measures<\/th><th>Good value<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td><strong>Rp<\/strong><\/td><td>Σ|Yobs−Ycalc| / ΣYobs<\/td><td>No<\/td><td>Simple profile difference. Easy to understand.<\/td><td>&lt;8% (lab), &lt;5% (synchrotron)<\/td><\/tr>\n      <tr><td><strong>Rwp<\/strong><\/td><td>√(Σw·ΔY² / Σw·Yobs²)<\/td><td>Yes (1/σ²)<\/td><td>Weighted profile R. The minimisation target. <em>The most important R.<\/em><\/td><td>&lt;10% (lab), &lt;8% (synchrotron)<\/td><\/tr>\n      <tr><td><strong>Rexp<\/strong><\/td><td>√((N−P) / Σw·Yobs²)<\/td><td>Yes<\/td><td>Expected Rwp if the model were perfect (statistical lower bound).<\/td><td>Depends on counting statistics<\/td><\/tr>\n      <tr><td><strong>χ² (GoF)<\/strong><\/td><td>(Rwp/Rexp)²<\/td><td>—<\/td><td>How many times worse than perfect. χ²=1 means statistically perfect fit.<\/td><td>1.0–1.5 (ideal), &lt;3 (acceptable)<\/td><\/tr>\n      <tr><td><strong>RBragg<\/strong><\/td><td>Σ|Iobs−Icalc| / ΣIobs<\/td><td>No<\/td><td>Bragg intensity R (Rietveld only). Measures structure quality, not profile.<\/td><td>&lt;5%<\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>R-factors during a refinement<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <p>Drag the slider to simulate successive release of parameter groups:<\/p>\n  <div class=\"ctrl-row\"><label>Refinement stage<\/label><input type=\"range\" id=\"x_sl_stage\" min=\"0\" max=\"6\" step=\"1\" value=\"0\" oninput=\"XB.updateRfactors()\"><span id=\"x_lbl_stage\">Initial<\/span><\/div>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0\" id=\"x_rfactor_bars\"><\/div>\n  <div id=\"x_stage_desc\" class=\"annot\"><\/div>\n  <div class=\"canvas-wrap\" style=\"margin-top:14px\"><canvas id=\"x_rwpCanvas\" width=\"860\" height=\"200\"><\/canvas><\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Common Rwp traps and fixes<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <table class=\"tbl\">\n    <thead><tr><th>Symptom<\/th><th>Likely cause<\/th><th>Fix<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>Rwp stuck &gt;25%<\/td><td>Wrong space group, wrong cell, impurity peaks<\/td><td>Re-index; run CHECKCELL; look for extra peaks<\/td><\/tr>\n      <tr><td>χ² &gt;&gt; 1 but Rwp looks OK<\/td><td>Underestimated counting statistics (Poisson)<\/td><td>Check weight scheme; use correct σ(Yi)<\/td><\/tr>\n      <tr><td>Rp much worse than Rwp<\/td><td>Low-intensity tails are poorly fit<\/td><td>Check background; check axial divergence at low 2θ<\/td><\/tr>\n      <tr><td>RBragg good, Rwp bad<\/td><td>Background or profile wrong<\/td><td>Refine profile parameters; check zero error<\/td><\/tr>\n      <tr><td>Rwp improves but bond lengths go crazy<\/td><td>Wrong atom type or occupancy<\/td><td>Check scattering factors (see Scattering page)<\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/div>\n<\/div>\n<div class=\"more-grp\">Scattering<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Atomic scattering power<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <p>The structure factor F(hkl) is a sum over all atoms. Each atom contributes with weight proportional to its <em>scattering factor f(sinθ/λ)<\/em> — the number of electrons scattering coherently. Heavier atoms scatter more strongly.<\/p>\n  <div class=\"canvas-wrap\"><canvas id=\"x_scatterCanvas\" width=\"860\" height=\"260\"><\/canvas><\/div>\n  <div class=\"ctrl-row\"><label>Compare atom 1<\/label>\n    <select id=\"x_sel_atom1\" onchange=\"XB.drawScattering()\">\n      <option value=\"H\">H (1e)<\/option><option value=\"C\">C (6e)<\/option><option value=\"N\">N (7e)<\/option>\n      <option value=\"O\">O (8e)<\/option><option value=\"Na\">Na (11e)<\/option><option value=\"Ni\" selected>Ni (28e)<\/option>\n      <option value=\"Cu\">Cu (29e)<\/option><option value=\"Zn\">Zn (30e)<\/option><option value=\"Mo\">Mo (42e)<\/option>\n    <\/select>\n  <\/div>\n  <div class=\"ctrl-row\"><label>Compare atom 2<\/label>\n    <select id=\"x_sel_atom2\" onchange=\"XB.drawScattering()\">\n      <option value=\"H\">H (1e)<\/option><option value=\"C\">C (6e)<\/option><option value=\"N\">N (7e)<\/option>\n      <option value=\"O\" selected>O (8e)<\/option><option value=\"Na\">Na (11e)<\/option><option value=\"Ni\">Ni (28e)<\/option>\n      <option value=\"Cu\">Cu (29e)<\/option><option value=\"Zn\">Zn (30e)<\/option><option value=\"Mo\">Mo (42e)<\/option>\n    <\/select>\n  <\/div>\n  <div id=\"x_scatter_note\" class=\"annot amber\"><\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Why a wrong atom raises Rwp<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"ctrl-row\"><label>True atom at site<\/label>\n    <select id=\"x_sel_true\" onchange=\"XB.updateWrongAtom()\">\n      <option value=\"Ni\" selected>Ni (28e)<\/option><option value=\"Cu\">Cu (29e)<\/option>\n      <option value=\"Zn\">Zn (30e)<\/option><option value=\"Fe\">Fe (26e)<\/option>\n    <\/select>\n  <\/div>\n  <div class=\"ctrl-row\"><label>Atom placed in model<\/label>\n    <select id=\"x_sel_model\" onchange=\"XB.updateWrongAtom()\">\n      <option value=\"Ni\" selected>Ni (28e)<\/option><option value=\"Cu\">Cu (29e)<\/option>\n      <option value=\"Zn\">Zn (30e)<\/option><option value=\"Fe\">Fe (26e)<\/option>\n      <option value=\"Co\">Co (27e)<\/option><option value=\"Mn\">Mn (25e)<\/option>\n    <\/select>\n  <\/div>\n  <div id=\"x_wrong_atom_result\" class=\"annot\"><\/div>\n  <div class=\"annot amber\" style=\"margin-top:8px\"><strong>Key insight:<\/strong> Neighbouring elements in the periodic table (e.g. Ni/Cu, Fe/Co) are very hard to distinguish by X-ray powder diffraction. Use anomalous scattering (synchrotron, variable wavelength) or neutron diffraction for certainty. The Beq will also inflate to compensate for a wrong scattering factor.<\/div>\n<\/div>\n<\/div>\n<div class=\"more-grp\">Instrument<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Instrument parameters and peak shape<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"canvas-wrap\"><canvas id=\"x_instrCanvas\" width=\"860\" height=\"280\"><\/canvas><\/div>\n  <div class=\"ctrl-row\"><label>Axial divergence (mm)<\/label><input type=\"range\" id=\"x_sl_axial\" min=\"0\" max=\"5\" step=\"0.1\" value=\"0.5\" oninput=\"XB.drawInstrPeak()\"><span id=\"x_lbl_axial\">0.5<\/span><\/div>\n  <div class=\"ctrl-row\"><label>Receiving slit (°)<\/label><input type=\"range\" id=\"x_sl_slit\" min=\"0.01\" max=\"0.5\" step=\"0.01\" value=\"0.1\" oninput=\"XB.drawInstrPeak()\"><span id=\"x_lbl_slit\">0.10<\/span><\/div>\n  <div class=\"ctrl-row\"><label>Zero error (°2θ)<\/label><input type=\"range\" id=\"x_sl_zero\" min=\"-0.1\" max=\"0.1\" step=\"0.002\" value=\"0.0\" oninput=\"XB.drawInstrPeak()\"><span id=\"x_lbl_zero\">0.000<\/span><\/div>\n  <div id=\"x_instr_note\" class=\"annot\"><\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Calibrating with a standard sample<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"steps\">\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Collect standard (NIST SRM 640e Si, LaB₆, CeO₂)<\/h4><p>These have known cell parameters and negligible sample broadening. All peak broadening is from the instrument.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Le Bail fit the standard<\/h4><p>Refine: zero error, cell, peak shape (pku/pkv/pkw/pkx). Background. Axial divergence. Wavelength if synchrotron. <em>Fix these values for all subsequent samples.<\/em><\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Record instrument resolution function (IRF)<\/h4><p>FWHM vs 2θ from the standard gives the IRF. Any extra broadening in your sample is from the sample (size, strain, disorder).<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Use IRF parameters as fixed starting values<\/h4><p>In TOPAS: use !pkz, !pky fixed; refine pku, pkv, pkw, pkx for the sample. Or fix all profile params from the standard if the sample is well-crystallised.<\/p><\/div><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Optics and their effect on the pattern<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <table class=\"tbl\">\n    <thead><tr><th>Optical element<\/th><th>Effect on pattern<\/th><th>Typical parameter in TOPAS<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>Divergence slit<\/td><td>Controls beam footprint on sample. Wider → more intensity but more flat-specimen error at low 2θ.<\/td><td>Affects background, low-angle peak shape<\/td><\/tr>\n      <tr><td>Receiving slit<\/td><td>Wider slit → lower resolution, higher intensity. Narrower → better resolution.<\/td><td>Contributes to pkw (W term)<\/td><\/tr>\n      <tr><td>Monochromator (incident)<\/td><td>Removes Kβ, fluorescence. Synchrotron: single wavelength. Lab: usually Ge(111).<\/td><td>ymin_on_ymax, lam la/lo/lh<\/td><\/tr>\n      <tr><td>Soller slits<\/td><td>Limit axial divergence. Synchrotron uses them too. Narrows peaks at low 2θ.<\/td><td>Simple_Axial_Model parameter<\/td><\/tr>\n      <tr><td>Anti-scatter slit<\/td><td>Reduces background from air scatter at low 2θ.<\/td><td>Affects background level<\/td><\/tr>\n      <tr><td>Capillary diameter<\/td><td>Transmission geometry. Larger diameter → more absorption, broader peaks from depth defocusing.<\/td><td>Absorption correction term<\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/div>\n<\/div>\n<div class=\"more-grp\">Workflow<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Analysis decision tree<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"canvas-wrap\"><canvas id=\"x_treeCanvas\" width=\"860\" height=\"500\"><\/canvas><\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Checklist before you refine<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div id=\"x_checklist\"><\/div>\n<\/div>\n<\/div>\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>Manual Rietveld in a spreadsheet<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n  <div class=\"annot amber\"><strong>Educational exercise:<\/strong> You can build a simple 1D Rietveld refinement in Excel to understand what TOPAS is actually minimising.<\/div>\n  <div class=\"steps\">\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Column A: 2θ values (e.g. 10 to 80° in 0.02° steps)<\/h4><p><\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Column B: Yobs (paste your measured data)<\/h4><p><\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Column C: Background<\/h4><p>=A2*$F$1 + $F$2 (simple linear background; F1,F2 are adjustable cells)<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Column D: One peak function per reflection<\/h4><p>=scale * F(hkl) * pseudo_Voigt(2θ − 2θ_hkl, FWHM). Sum all peaks into Ycalc.<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Column E: Weighted difference squared<\/h4><p>=(B2−D2)^2 / B2 (Poisson weights: σ²=Yobs)<\/p><\/div><\/div>\n    <div class=\"step\"><div class=\"step-num\"><\/div><div class=\"step-body\"><h4>Cell for Rwp<\/h4><p>=SQRT(SUM(E:E)/SUMPRODUCT(1/B2:Bmax,B2:Bmax^2)). Use Excel Solver to minimise by adjusting cell, scale, peak parameters.<\/p><\/div><\/div>\n  <\/div>\n  <div class=\"annot green\"><strong>What this teaches:<\/strong> You will immediately see that (1) all peaks must be fit simultaneously; (2) changing the cell shifts ALL peaks at once; (3) changing scale changes overall intensity; (4) the background has enormous effect on Rwp. This is exactly what TOPAS, GSAS-II and FullProf do — just much faster.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<script>\n// ═══════════════════════════════════════════════════════\n// UTILITIES\n// ═══════════════════════════════════════════════════════\nfunction gs(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}\nfunction fg(){return gs('--fg');}\nfunction fg2(){return gs('--fg2');}\nfunction fg3(){return gs('--fg3');}\nfunction accent(){return gs('--accent');}\nfunction accent2(){return gs('--accent2');}\nfunction accent3(){return gs('--accent3');}\nfunction bg(){return gs('--bg');}\nfunction bg2(){return gs('--bg2');}\nfunction bg3(){return gs('--bg3');}\nfunction bord(){return gs('--border');}\nfunction danger(){return gs('--danger');}\n\nfunction setupCanvas(id){\n  const c=document.getElementById(id);if(!c)return null;\n  const ctx=c.getContext('2d');\n  const dpr=window.devicePixelRatio||1;\n  const w=c.clientWidth>0?c.clientWidth:(parseInt(c.getAttribute('width'))||880);\n  const h=parseInt(c.getAttribute('height'))||220;\n  c.width=w*dpr;c.height=h*dpr;\n  ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);\n  c.style.height=h+'px';\n  return{ctx,w,h};\n}\n\nif(!CanvasRenderingContext2D.prototype.roundRect){\n  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){\n    this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);\n    this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);\n    this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);\n    this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);\n    this.arcTo(x,y,x+r,y,r);this.closePath();\n  };\n}\n\nfunction pVoigt(x,x0,fwhm,eta){\n  const g=fwhm/(2*Math.sqrt(2*Math.log(2)));\n  const dx=x-x0;\n  const G=Math.exp(-(dx*dx)/(2*g*g));\n  const L=1/(1+(dx*dx)/((fwhm/2)*(fwhm/2)));\n  return eta*L+(1-eta)*G;\n}\n\nfunction seededRng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};}\n\n// ═══════════════════════════════════════════════════════\n// CRYSTAL SYSTEMS — cell definitions & d-spacing formulas\n// ═══════════════════════════════════════════════════════\nconst CELLS={\n  cubic:{a:5.6402,b:5.6402,c:5.6402,al:90,be:90,ga:90,name:'Cubic (NaCl, a=5.64 Å)',sg:'Fm-3m'},\n  tetragonal:{a:5.831,b:5.831,c:8.597,al:90,be:90,ga:90,name:'Tetragonal (a=5.83, c=8.60 Å)',sg:'I4/mmm'},\n  orthorhombic:{a:5.244,b:6.059,c:7.282,al:90,be:90,ga:90,name:'Orthorhombic (a=5.24,b=6.06,c=7.28 Å)',sg:'Pnma'},\n  monoclinic:{a:7.284,b:9.531,c:9.763,al:90,be:98.46,ga:90,name:'Monoclinic (P2₁/n, β=98.5°)',sg:'P2₁/n'},\n};\n\nfunction dSpacing(cell,h,k,l){\n  const{a,b,c,be}=cell;\n  const al=cell.al||90, ga=cell.ga||90;\n  const beR=be*Math.PI/180;\n  if(al===90&&be===90&&ga===90&&Math.abs(a-b)<0.001&&Math.abs(a-c)<0.001){\n    // cubic\n    const n2=h*h+k*k+l*l; return n2>0?a/Math.sqrt(n2):null;\n  }\n  if(al===90&&be===90&&ga===90&&Math.abs(a-b)<0.001){\n    // tetragonal\n    return 1/Math.sqrt((h*h+k*k)/(a*a)+l*l/(c*c));\n  }\n  if(al===90&&be===90&&ga===90){\n    // orthorhombic\n    return 1/Math.sqrt(h*h/(a*a)+k*k/(b*b)+l*l/(c*c));\n  }\n  // hexagonal / trigonal (a=b, al=be=90, ga=120)\n  if(Math.abs(a-b)<0.001&&Math.abs(al-90)<0.5&&Math.abs(be-90)<0.5&&Math.abs(ga-120)<0.5){\n    const inv2=4/3*(h*h+h*k+k*k)/(a*a)+l*l/(c*c);\n    return inv2>0?1/Math.sqrt(inv2):null;\n  }\n  // rhombohedral (a=b=c, al=be=ga≠90)\n  if(Math.abs(a-b)<0.001&&Math.abs(a-c)<0.001&&Math.abs(al-be)<0.5&&Math.abs(al-ga)<0.5){\n    const alR=al*Math.PI/180;\n    const cosA=Math.cos(alR),sinA=Math.sin(alR);\n    const V=a*a*a*Math.sqrt(1-3*cosA*cosA+2*cosA*cosA*cosA);\n    if(V<0.001)return null;\n    const inv2=(1/V/V)*a*a*a*a*(sinA*sinA*(h*h+k*k+l*l)+(2*cosA*cosA-2*cosA)*(h*k+k*l+h*l));\n    return inv2>0?1/Math.sqrt(inv2):null;\n  }\n  // monoclinic (unique axis b)\n  if(Math.abs(al-90)<0.5&&Math.abs(ga-90)<0.5){\n    const sinB=Math.sin(beR),cosB=Math.cos(beR);\n    const v=a*b*c*sinB;\n    const s11=b*b*c*c*sinB*sinB,s22=a*a*c*c,s33=a*a*b*b*sinB*sinB;\n    const s13=-a*b*b*c*cosB;\n    const invd2=(s11*h*h+s22*k*k+s33*l*l+2*s13*h*l)/(v*v);\n    return invd2>0?1/Math.sqrt(invd2):null;\n  }\n  // triclinic — general metric tensor\n  {\n    const alR=al*Math.PI/180,gaR=ga*Math.PI/180;\n    const cosAl=Math.cos(alR),cosBe=Math.cos(beR),cosGa=Math.cos(gaR);\n    const sinAl=Math.sin(alR),sinBe=Math.sin(beR),sinGa=Math.sin(gaR);\n    const V=a*b*c*Math.sqrt(1-cosAl*cosAl-cosBe*cosBe-cosGa*cosGa+2*cosAl*cosBe*cosGa);\n    if(V<0.001)return null;\n    const S11=b*b*c*c*sinAl*sinAl;\n    const S22=a*a*c*c*sinBe*sinBe;\n    const S33=a*a*b*b*sinGa*sinGa;\n    const S12=a*b*c*c*(cosAl*cosBe-cosGa);\n    const S23=a*a*b*c*(cosBe*cosGa-cosAl);\n    const S13=a*b*b*c*(cosGa*cosAl-cosBe);\n    const inv2=(S11*h*h+S22*k*k+S33*l*l+2*S12*h*k+2*S23*k*l+2*S13*h*l)/(V*V);\n    return inv2>0?1/Math.sqrt(inv2):null;\n  }\n}\n\n// Systematic absence check\nfunction isAbsent(sg,h,k,l){\n  if(sg==='Fm3m'||sg==='Fm-3m'){\n    // FCC: hkl mixed\n    const par=[h%2,k%2,l%2].map(x=>((x+2)%2));\n    return!(par[0]===par[1]&&par[1]===par[2]);\n  }\n  if(sg==='Im3m'||sg==='Im-3m'){return((h+k+l)%2!==0);}\n  if(sg==='Pnma'){\n    if(k===0&&l===0)return false;\n    if(h===0&&l===0)return(k%2!==0);\n    if(h===0&&k===0)return false;\n    if(k===0)return(h%2!==0);// h0l: h odd\n    if(l===0)return((h+k)%2!==0);// hk0: h+k odd\n    if(h===0)return((k+l)%2!==0);// 0kl: k+l odd\n    return false;\n  }\n  if(sg==='C2c'||sg==='C2/c'){\n    if((h+k)%2!==0)return true;// C centering\n    if(k===0&&((h%2!==0)||(l%2!==0)))return false;// h0l: l odd absent\n    if(h===0&&l===0)return(l%2!==0);\n    return false;\n  }\n  if(sg==='P21n'||sg==='P2₁/n'){\n    if(h===0&&l===0)return(k%2!==0);// 0k0: k odd\n    if(k===0)return((h+l)%2!==0);// h0l: h+l odd\n    return false;\n  }\n  if(sg==='P21c'||sg==='P2₁/c'){\n    if(h===0&&l===0)return(k%2!==0);\n    if(k===0)return(l%2!==0);\n    return false;\n  }\n  if(sg==='P21'||sg==='P2₁'){\n    if(h===0&&l===0)return(k%2!==0);\n    return false;\n  }\n  return false;\n}\n\nfunction generateHKLs(system,maxN){\n  const hkls=[];\n  const maxIdx=Math.ceil(maxN/2)+1;\n  for(let h=0;h<=maxIdx;h++)\n  for(let k=-maxIdx;k<=maxIdx;k++)\n  for(let l=-maxIdx;l<=maxIdx;l++){\n    if(h===0&&k<=0)continue;\n    if(h===0&&k===0&&l<=0)continue;\n    hkls.push([h,k,l]);\n  }\n  return hkls;\n}\n\nfunction simulatePattern(system,lambda,noiseLvl,seed){\n  const cell=CELLS[system];\n  const sg=cell.sg;\n  const hkls=generateHKLs(system,8);\n  const peaks=[];\n  const rng=seededRng(seed||42);\n  \n  for(const[h,k,l]of hkls){\n    if(isAbsent(sg,h,k,l))continue;\n    const d=dSpacing(cell,h,k,l);\n    if(!d||d<0.5)continue;\n    const sinT=lambda/(2*d);\n    if(sinT>=1||sinT<=0)continue;\n    const tth=2*Math.asin(sinT)*180/Math.PI;\n    if(tth<5||tth>80)continue;\n    // Lorentz-polarisation factor\n    const theta=tth*Math.PI/360;\n    const LP=(1+Math.cos(2*theta)*Math.cos(2*theta))/(Math.sin(theta)*Math.sin(theta)*Math.cos(theta));\n    // Multiplicity (approximate)\n    let mult=8;\n    if(h===0||k===0||l===0)mult=4;\n    if(h===0&&k===0)mult=2;\n    if(h===k||h===l||k===l)mult/=2;\n    const inten=Math.max(0.05,LP*mult/100)*(0.8+0.4*rng());\n    peaks.push({h,k,l,d,tth,inten});\n  }\n  // Sort by 2theta\n  peaks.sort((a,b)=>a.tth-b.tth);\n  // Remove near-duplicate 2thetas (overlapping)\n  const merged=[];\n  for(const p of peaks){\n    const prev=merged[merged.length-1];\n    if(prev&&Math.abs(p.tth-prev.tth)<0.08){prev.inten+=p.inten;prev.hklAll=prev.hklAll||[`${prev.h}${prev.k}${prev.l}`];prev.hklAll.push(`${p.h}${p.k}${p.l}`);}\n    else merged.push({...p});\n  }\n  // Normalize intensities\n  const maxI=Math.max(...merged.map(p=>p.inten));\n  merged.forEach(p=>{p.inten/=maxI;});\n  return{peaks:merged,cell,sg,lambda,noiseLvl,system};\n}\n\n// Build 2theta array + intensity array\nfunction buildProfile(patData,tthMin,tthMax,nPts){\n  const{peaks,lambda,noiseLvl}=patData;\n  const rng=seededRng(999);\n  const ys=new Float32Array(nPts);\n  for(let i=0;i<nPts;i++){\n    const tth=tthMin+(tthMax-tthMin)*i/(nPts-1);\n    // background\n    ys[i]=0.03+0.01*(i/nPts);\n  }\n  for(const p of peaks){\n    const theta=p.tth*Math.PI/360;\n    const cosT=Math.cos(theta);\n    // FWHM: Caglioti-like\n    const tanT=Math.tan(theta);\n    const fwhmG=Math.sqrt(Math.max(0.0001,-0.8*tanT*tanT+0.07*tanT+0.05));\n    const fwhmL=0.21/cosT;\n    const fwhm=0.5*(fwhmG+fwhmL)+0.5*Math.sqrt(fwhmG*fwhmL+0.5*(fwhmG-fwhmL)*(fwhmG-fwhmL));\n    const eta=fwhmL/fwhm;\n    for(let i=0;i<nPts;i++){\n      const tth=tthMin+(tthMax-tthMin)*i/(nPts-1);\n      if(Math.abs(tth-p.tth)>4*fwhm)continue;\n      ys[i]+=p.inten*pVoigt(tth,p.tth,fwhm,eta);\n    }\n  }\n  // Add noise\n  if(noiseLvl>0){\n    const noiseScale=noiseLvl/100;\n    for(let i=0;i<nPts;i++){\n      ys[i]+=noiseScale*(rng()-0.5)*2*Math.sqrt(ys[i]+0.01);\n    }\n  }\n  return ys;\n}\n\n// ═══════════════════════════════════════════════════════\n// INDEXING PAGE STATE\n// ═══════════════════════════════════════════════════════\nlet idxPatData=null;\nlet idxPickedPeaks=[];// array of {tth, d, peakIdx}\nlet idxProfile=null;\nconst IDX_TTH_MIN=5,IDX_TTH_MAX=80,IDX_NPTS=2000;\n\nfunction generatePattern(){\n  const system=document.getElementById('idx_system').value;\n  const lambda=parseFloat(document.getElementById('idx_lam').value);\n  const noise=parseFloat(document.getElementById('idx_noise').value);\n  idxPatData=simulatePattern(system,lambda,noise);\n  idxProfile=buildProfile(idxPatData,IDX_TTH_MIN,IDX_TTH_MAX,IDX_NPTS);\n  idxPickedPeaks=[];\n  drawIdxPattern();\n  document.getElementById('idx_pick_status').innerHTML='<strong>Pattern generated.<\/strong> Click on peaks to pick them. Pick at least 10 for reliable indexing.';\n  document.getElementById('idx_results').innerHTML='';\n  document.getElementById('idx_algo_status').textContent='';\n  updatePickTable();\n}\n\nfunction drawIdxPattern(highlightTth){\n  const r=setupCanvas('idx_canvas');if(!r)return;\n  const{ctx,w,h}=r;\n  const pad={l:50,r:20,t:16,b:36};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n\n  if(!idxProfile){\n    ctx.fillStyle=fg3();ctx.font='14px Inter';ctx.textAlign='center';\n    ctx.fillText('Press \"Generate Pattern\" to start',w/2,h/2);\n    return;\n  }\n\n  // Axes\n  ctx.strokeStyle=bord();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n\n  // 2theta labels\n  ctx.fillStyle=fg3();ctx.font='11px Inter';ctx.textAlign='center';\n  for(let t=10;t<=75;t+=10){\n    const x=pad.l+(t-IDX_TTH_MIN)/(IDX_TTH_MAX-IDX_TTH_MIN)*pw;\n    ctx.fillText(t+'°',x,h-6);\n    ctx.strokeStyle=bord();ctx.lineWidth=0.5;ctx.setLineDash([2,2]);\n    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();\n    ctx.setLineDash([]);\n  }\n  ctx.fillStyle=fg3();ctx.font='11px Inter';ctx.textAlign='center';ctx.fillText('2θ',pad.l+pw/2,h-1);\n\n  // Profile\n  ctx.strokeStyle=accent();ctx.lineWidth=1.5;ctx.beginPath();\n  for(let i=0;i<IDX_NPTS;i++){\n    const x=pad.l+i/IDX_NPTS*pw;\n    const y=pad.t+ph-idxProfile[i]*ph*0.9;\n    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n  }\n  ctx.stroke();\n\n  // Picked peak markers\n  for(const pk of idxPickedPeaks){\n    const x=pad.l+(pk.tth-IDX_TTH_MIN)/(IDX_TTH_MAX-IDX_TTH_MIN)*pw;\n    ctx.strokeStyle=accent2();ctx.lineWidth=2;ctx.setLineDash([3,2]);\n    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.fillStyle=accent2();ctx.beginPath();ctx.arc(x,pad.t+5,5,0,2*Math.PI);ctx.fill();\n    ctx.fillStyle=bg2();ctx.font='bold 9px Inter';ctx.textAlign='center';\n    ctx.fillText(idxPickedPeaks.indexOf(pk)+1,x,pad.t+9);\n  }\n}\n\nfunction idxCanvasClick(e){\n  if(!idxProfile)return;\n  const canvas=document.getElementById('idx_canvas');\n  const rect=canvas.getBoundingClientRect();\n  const xFrac=(e.clientX-rect.left)/rect.width;\n  const pad={l:50,r:20};\n  const pw=rect.width-pad.l-pad.r;\n  const xRelative=e.clientX-rect.left-pad.l;\n  if(xRelative<0||xRelative>pw)return;\n  const tthClicked=IDX_TTH_MIN+xRelative/pw*(IDX_TTH_MAX-IDX_TTH_MIN);\n\n  // Find nearest peak in pattern data\n  let nearest=null,minDist=1.5;\n  for(let i=0;i<idxPatData.peaks.length;i++){\n    const p=idxPatData.peaks[i];\n    const dist=Math.abs(p.tth-tthClicked);\n    if(dist<minDist){minDist=dist;nearest=i;}\n  }\n  if(nearest===null){\n    document.getElementById('idx_pick_status').textContent='No peak nearby — click closer to a peak maximum.';\n    return;\n  }\n  const pk=idxPatData.peaks[nearest];\n  // Check not already picked\n  if(idxPickedPeaks.some(p=>p.peakIdx===nearest)){\n    // Remove it\n    idxPickedPeaks=idxPickedPeaks.filter(p=>p.peakIdx!==nearest);\n  } else {\n    idxPickedPeaks.push({tth:pk.tth,d:pk.d,peakIdx:nearest,h:pk.h,k:pk.k,l:pk.l});\n    idxPickedPeaks.sort((a,b)=>a.tth-b.tth);\n  }\n  drawIdxPattern();\n  updatePickTable();\n}\n\nfunction autoPick(){\n  if(!idxPatData)return;\n  idxPickedPeaks=idxPatData.peaks.map((p,i)=>({tth:p.tth,d:p.d,peakIdx:i,h:p.h,k:p.k,l:p.l}));\n  drawIdxPattern();updatePickTable();\n}\n\nfunction updatePickTable(){\n  const el=document.getElementById('idx_pick_table');\n  if(!idxPickedPeaks.length){el.innerHTML='<em style=\"color:var(--fg3);font-size:13px\">No peaks picked yet.<\/em>';return;}\n  const rows=idxPickedPeaks.map((p,i)=>`<tr><td>${i+1}<\/td><td>${p.tth.toFixed(3)}°<\/td><td>${p.d.toFixed(4)} Å<\/td><td>${(1/(p.d*p.d)).toFixed(5)}<\/td><\/tr>`).join('');\n  el.innerHTML=`<table class=\"tbl\"><thead><tr><th>#<\/th><th>2θ (°)<\/th><th>d (Å)<\/th><th>1/d²<\/th><\/tr><\/thead><tbody>${rows}<\/tbody><\/table>`;\n  document.getElementById('idx_pick_status').innerHTML=`<strong>${idxPickedPeaks.length} peaks picked.<\/strong> Ready to run indexing.`;\n}\n\n// ═══════════════════════════════════════════════════════\n// INDEXING ALGORITHMS\n// ═══════════════════════════════════════════════════════\n\n// TREOR-style: test crystal systems by looking at ratios of 1/d²\nfunction runTREOR(){\n  if(idxPickedPeaks.length<4){alert('Pick at least 4 peaks first.');return;}\n  const qs=idxPickedPeaks.map(p=>1/(p.d*p.d));\n  const status=document.getElementById('idx_algo_status');\n  status.textContent='TREOR: testing crystal systems…';\n\n  const results=[];\n\n  // Test cubic: all q = integer / a²\n  // q_i / q_j should be rational with small integers\n  const q0=qs[0];\n  // Find a by trying h²+k²+l² values\n  const cubicInts=[1,2,3,4,5,6,8,9,10,11,12,13,14,16];\n  for(const n0 of cubicInts){\n    const a2=n0/q0;\n    let matches=0,residSum=0;\n    for(const q of qs){\n      const nTest=q*a2;\n      const nRound=Math.round(nTest);\n      if(cubicInts.includes(nRound)){const res=Math.abs(nTest-nRound)/nRound;if(res<0.02){matches++;residSum+=res;}}\n    }\n    if(matches>=Math.min(qs.length,4)){\n      const a=Math.sqrt(a2);\n      results.push({system:'Cubic',a,b:a,c:a,be:90,matches,avgResid:residSum/matches,M20:matches/qs.length*20*(0.01/((residSum/matches)+0.001))});\n    }\n  }\n\n  // Test tetragonal: q = (h²+k²)/a² + l²/c²\n  // Try a² from first peak, c² as multiples\n  for(let ia=0;ia<Math.min(3,qs.length);ia++){\n    for(const na of [1,2,4]){\n      const a2=na/qs[ia];\n      for(let ic=0;ic<Math.min(3,qs.length);ic++){\n        if(ic===ia)continue;\n        for(const nc of [1,2,4]){\n          const c2=nc/qs[ic];\n          if(Math.abs(c2-a2)<0.01)continue;// not cubic\n          let matches=0,residSum=0;\n          for(const q of qs){\n            // Try small hkl\n
