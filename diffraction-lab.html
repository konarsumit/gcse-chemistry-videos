<style>
/* Layout: an instrument console — step rail on the left, the bench (controls + detector) in the middle, the reading of each step beside it. */
:root{
  --bg:#edf0f2; --paper:#ffffff; --ink:#121a24; --muted:#56606e; --rule:#cfd6dd; --accent:#0d6b7c; --accent-soft:#d8ecef;
  --amber:#c97a12; --good:#1f7a4c; --bad:#b23a32; --chip:#e3e8ec; --det:#0a0f15;
  --c1:#0d6b7c;--c2:#c97a12;--c3:#7b52ab;--c4:#2f7d4a;--c5:#b5466b;
  --f-display:"Source Serif 4", Georgia, serif; --f-body:"Public Sans", system-ui, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1418;--paper:#171e24;--ink:#e3e8ec;--muted:#9aa6b2;--rule:#2b353e;--accent:#5fc0cf;--accent-soft:#16323a;--amber:#f0a646;--good:#5cc48e;--bad:#ef7d74;--chip:#212a32;--det:#05080b;--c1:#5fc0cf;--c2:#f0a646;--c3:#b294de;--c4:#6cc58e;--c5:#e58aa8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1418;--paper:#171e24;--ink:#e3e8ec;--muted:#9aa6b2;--rule:#2b353e;--accent:#5fc0cf;--accent-soft:#16323a;--amber:#f0a646;--good:#5cc48e;--bad:#ef7d74;--chip:#212a32;--det:#05080b;--c1:#5fc0cf;--c2:#f0a646;--c3:#b294de;--c4:#6cc58e;--c5:#e58aa8;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.08rem}
p{margin:0} .muted{color:var(--muted)} .small{font-size:.84rem}
.eyebrow{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header{display:flex;flex-direction:column;gap:6px}
header .sub{max-width:80ch;color:var(--muted)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:12px}
@media (max-width:960px){.rail{position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:2px}.rail button{grid-template-columns:28px;padding:6px}.rail button[aria-current="true"]{grid-template-columns:28px auto}.rail button:not([aria-current="true"]) .t{display:none}}
.rail button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer}
.rail button:hover{background:var(--chip)}
.rail button[aria-current="true"]{background:var(--paper);border-color:var(--rule)}
.rail .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 .75rem var(--f-mono);background:var(--chip);color:var(--muted)}
.rail button.done .n{background:var(--good);color:var(--paper)}
.rail button[aria-current="true"] .n{background:var(--accent);color:var(--paper)}
.rail .t{font-size:.9rem;line-height:1.25}
.step{display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.bench{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.two,.bench{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.explain{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.explain ol,.explain ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.callout{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.warn{border-left:3px solid var(--amber);padding:4px 0 4px 14px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{text-align:left;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}

@media(max-width:640px){#modeseg{display:grid;grid-template-columns:1fr 1fr;width:100%}#modeseg button+button{border-left:0}#modeseg button{border-bottom:1px solid var(--rule)}#modeseg button:nth-child(even){border-left:1px solid var(--rule)}}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
select,input[type=range]{font:inherit;color:var(--ink)}
select{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:6px 8px}
.btn{font:500 .92rem var(--f-body);border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}

button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--rule);vertical-align:top}

.tscroll{overflow-x:auto}
.mono{font-family:var(--f-mono);font-size:.84rem}

.kpi .v{font:600 1.25rem var(--f-mono)}
.kpi .l{font-size:.75rem;color:var(--muted)}
.det{background:var(--det);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.det canvas{width:100%;height:auto;display:block;border-radius:6px;image-rendering:auto}
.det .cap{color:#aab6c2;font:.75rem var(--f-mono);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.det .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#c7d0d9;font-size:.8rem}
.det select{background:#141c24;color:#d9e1e8;border-color:#2c3a46}
.det input[type=range]{flex:1;min-width:120px}
.pill{display:inline-block;font:500 .74rem var(--f-mono);padding:2px 8px;border-radius:999px;background:var(--chip)}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.no{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
pre.file{background:var(--chip);border-radius:8px;padding:12px;font:.8rem/1.45 var(--f-mono);overflow:auto;max-height:420px;margin:0;white-space:pre}
.blocker{background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.spotbox{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.spotbox{grid-template-columns:minmax(0,1fr)}}
.spotbox canvas{width:180px;height:180px;border-radius:6px;background:var(--det)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.mtab input[type=number]{width:54px;font:inherit;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:4px 6px;text-align:right}
.mtab input.scan{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.mtab td,.mtab th{padding:4px 3px}
.mtab select{padding:4px 4px}
.inst{width:100%;height:auto;border-radius:8px;border:1px solid var(--rule);display:block}
.rv canvas{width:100%;height:auto;background:var(--det);border-radius:8px;display:block}

.stephead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stephead h2{margin-top:2px}
.viewer{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.vbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.vbar .seg button{padding:6px 11px;font-size:.84rem}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:.86rem;cursor:pointer;white-space:nowrap}
details.pop{position:relative}
details.pop>summary{list-style:none;cursor:pointer;font:500 .86rem var(--f-body);border:1px solid var(--rule);border-radius:8px;padding:6px 11px}
details.pop>summary::-webkit-details-marker{display:none}
details.pop>summary::after{content:" ▾";color:var(--muted)}
.popbody{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px;width:min(340px,86vw);display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
@media (max-width:700px){.popbody{position:fixed;left:12px;right:12px;width:auto;top:22vh;max-height:64vh;overflow:auto}}
.vfree{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px;background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.slide{display:grid;grid-template-columns:auto minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:.86rem}
.slide input{width:100%}
.vmain{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:stretch}
@media (max-width:900px){.vmain{grid-template-columns:minmax(0,1fr)}}
.v3d{border:1px solid var(--rule);border-radius:8px;overflow:hidden;display:flex;align-items:center;background:var(--paper)}
.v3d canvas{width:100%;height:auto;display:block;cursor:grab;touch-action:none}
.v3d canvas:active{cursor:grabbing}
.transport{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:10px}
.transport input[type=range]{flex:1;min-width:140px}
.transport.dim{opacity:.55}
.vhint{font-size:.78rem;color:var(--muted)}
details.fold{background:var(--paper);border:1px solid var(--rule);border-radius:10px}
.sheet details.fold{border-radius:8px}
details.fold>summary{cursor:pointer;padding:11px 14px;font-weight:500;list-style:none;display:flex;gap:10px;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.fold[open]>summary::before{transform:rotate(45deg)}
details.fold>summary:hover{color:var(--accent)}
.foldbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details.fold.inline{border:0;background:transparent}
details.fold.inline>summary{padding:4px 0;font-size:.86rem;color:var(--accent)}
details.fold.inline .foldbody{padding:6px 0 0}
.iconbtn{border:0;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:2px 6px;border-radius:4px}
.iconbtn:hover:not(:disabled){color:var(--bad);background:var(--chip)}
.iconbtn:disabled{opacity:.3}

.ringgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:900px){.ringgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){#ptab{display:grid;grid-template-columns:1fr 1fr;width:100%}#ptab button{border-left:0!important;border-top:1px solid var(--rule)}#ptab button:nth-child(-n+2){border-top:0}#ptab button:nth-child(even){border-left:1px solid var(--rule)!important}}
.plotbox{display:flex;flex-direction:column;gap:6px;min-width:0}
.plotbox canvas{width:100%;display:block;border-radius:8px;border:1px solid var(--rule);touch-action:pan-y;cursor:crosshair}
.plotcap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);min-height:1.5em}
i.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.gstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--rule)}
.gstep:first-child{border-top:0}
.gstep .gn{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 .8rem var(--f-mono)}
.gstep h3{font-size:1rem;font-family:var(--f-body);font-weight:600}
.gstep>*:not(.gn):not(h3){grid-column:2;margin:0;min-width:0}
.gstep ul{padding-left:18px;display:flex;flex-direction:column;gap:2px}
.gstep .go{grid-column:2}
.geo{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.geo{grid-template-columns:minmax(0,1fr)}}
.geo svg{width:100%;height:auto;background:var(--chip);border-radius:8px}
.geo .col ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.modeinfo{max-width:80ch}
.geo svg .ln{stroke:var(--ink);fill:none;stroke-width:1.6}
.geo svg .bm{stroke:var(--accent);fill:none;stroke-width:2}
.geo svg .df{stroke:var(--amber);fill:none;stroke-width:2}
.geo svg .sm{fill:var(--ink);stroke:none}
.geo svg .dt{fill:var(--c3);stroke:none;opacity:.85}
.geo svg text{fill:var(--muted);font:10px var(--f-body)}

.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{border:1px solid var(--rule);background:var(--chip);color:var(--ink);font:500 .76rem var(--f-body);padding:3px 10px;border-radius:999px;cursor:pointer}
.qchip.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.qbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}.qbar i{display:block;height:100%;background:var(--accent)}
.qgrid{display:flex;flex-wrap:wrap;gap:4px}
.qgrid button{width:30px;height:28px;border-radius:6px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:500 .72rem var(--f-mono);cursor:pointer;padding:0}
.qgrid button.ok{background:var(--good);color:var(--paper);border-color:var(--good)}
.qgrid button.bad{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.qgrid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.qopt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:10px;padding:11px 14px;cursor:pointer;font:inherit;line-height:1.4}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt .k{font:600 .8rem var(--f-mono);color:var(--muted);min-width:18px}
.qopt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,transparent)}
.qopt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.qopt:disabled{cursor:default;color:var(--ink)}
.qexp{border-left:4px solid var(--good);padding:8px 14px;background:var(--chip);border-radius:0 8px 8px 0}
.qexp.bad{border-left-color:var(--bad)}
.qnote{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.tfs .slide{grid-template-columns:minmax(7.5em,13em) minmax(0,1fr) 7.6em}
.tfs .slide span:first-child{min-width:0}
@media (max-width:640px){.tfs .slide{grid-template-columns:minmax(0,1fr) auto}.tfs .slide input{grid-column:1/-1;order:3}}
.tg{display:inline-block;font:500 .72rem var(--f-mono);padding:2px 9px;border-radius:999px;border:1px solid}
.tg.doc{color:var(--good);border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.tg.pot{color:var(--muted);border-color:var(--muted);background:var(--chip)}
.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.icard{align-items:flex-start}
.icard ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.icard li::before{content:"✓ ";font-weight:600}
.icard li.p{color:var(--muted)}.icard li.p::before{content:"○ "}
.icard li.d{color:var(--good)}
.icard.hl{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.icard.hl2{border-color:var(--muted);border-style:dashed;box-shadow:inset 0 0 0 1px var(--muted)}
.tfsvg svg{width:100%;height:auto;background:var(--chip);border-radius:8px;display:block}
.tfsvg .bm{stroke:var(--accent);fill:none;stroke-width:1.8}
.tfsvg .df{stroke:var(--amber);fill:none;stroke-width:1.8}

.tfsvg .dt{fill:var(--ink);opacity:.8}
.cnv{width:100%;display:block;border-radius:8px;border:1px solid var(--rule);background:var(--paper)}
.res{border-left:3px solid var(--good);padding:6px 0 6px 14px;display:flex;flex-direction:column;gap:6px}
tr.hlrow td{background:var(--accent-soft)}

#primarynav{display:flex;flex-wrap:wrap;width:100%}#primarynav button{flex:1 1 170px}#primarynav button+button{border-left:0}#subnav{gap:8px}#subnav .btn{flex:0 1 auto}

.disclosure{display:block!important}.disclosure>summary{cursor:pointer;font-family:var(--f-body);font-weight:600;font-size:1rem;line-height:1.4;list-style:revert}.disclosure>summary:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.disclosure-body{padding-top:14px}.gstep.disclosure{padding:12px 14px;border:1px solid var(--rule);border-radius:8px;margin:8px 0}.gstep.disclosure>summary .gn{display:inline-grid;position:static;margin-right:10px}.gstep.disclosure>summary span:last-child{display:inline}.disclosure:not([open])>.disclosure-body{display:none!important}#primarynav button{min-width:180px;white-space:normal}#subnav:empty{display:none}
</style>
</head>
<body>


<div class="wrap">
<header>
  <span class="eyebrow" id="eyebrow"></span>
  <h1>Diffraction Lab</h1>
  <p class="sub" id="modesub"></p>
  <div class="row"><div class="seg" id="modeseg" role="tablist" aria-label="Choose a technique"><button data-m="sc">SCXRD method</button><button data-m="sci">SCXRD instruments</button><button data-m="pw">PXRD method</button><button data-m="tf">PXRD instruments</button><button data-m="an">PXRD advanced guide</button><button data-m="quiz">Check your knowledge</button></div></div>
  <p class="small muted">Information is provided in good faith for general guidance and teaching only. We cannot accept responsibility for unintentional errors. Always consult your local experts, the manufacturer's manuals and your institution's approved procedures.</p>
</header>
<div class="layout">
  <nav class="rail" id="rail" aria-label="Experiment steps"></nav>
  <main id="main"></main>
</div>

function drawDetector(cv, events, run, E, opts = {}) {
  const W = cv.width = 520, H = cv.height = 520, ctx = cv.getContext('2d'), k = W / 100;
  const img = ctx.createImageData(W, H), r = XS.rng(17 + (opts.frame || 0) * 31 + (run.id || 0) * 7);
  for (let i = 0; i < W * H; i++) { const v = 8 + r() * 14 + (r() < 0.002 ? 60 : 0); img.data[i * 4] = v * 0.8; img.data[i * 4 + 1] = v * 0.9; img.data[i * 4 + 2] = v * 1.1; img.data[i * 4 + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  const P = (x, y) => [W / 2 + x * k, H / 2 - y * k];
  ctx.lineWidth = 1; ctx.font = '12px JetBrains Mono, monospace';
  for (const d of [2.0, 1.0, 0.84]) {
    const t2 = 2 * Math.asin(Math.min(1, E.src.lambda / (2 * d))); if (!isFinite(t2)) continue;
    ctx.strokeStyle = 'rgba(95,192,207,.35)'; ctx.beginPath(); let pen = false, lab = null;
    for (let a = 0; a <= 360; a += 2) { const ps = a * Math.PI / 180, dir = [Math.cos(t2), Math.sin(t2) * Math.cos(ps), Math.sin(t2) * Math.sin(ps)]; const hit = XS.detectorHit(E, run, dir); if (hit) { const [px, py] = P(hit[0], hit[1]); if (pen) ctx.lineTo(px, py); else ctx.moveTo(px, py); pen = true; if (!lab || py < lab[1]) lab = [px, py]; } else pen = false; }
    ctx.stroke(); if (lab) { ctx.fillStyle = 'rgba(150,215,225,.8)'; ctx.fillText(d.toFixed(2) + ' Å', lab[0] + 4, lab[1] + 13); }
  }
  const t = run.tth * Math.PI / 180; if (Math.cos(t) > 0.2) { const bx = -(run.D || E.D) * Math.tan(t); if (Math.abs(bx) < 55) { const [px, py] = P(bx, 0); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(px, py, 2.6 * k, 0, 7); ctx.fill(); ctx.fillRect(px - 0.7 * k, py, 1.4 * k, H); } }
  const maxC = Math.max(1000, ...events.map(e => e.counts ?? e.I));
  for (const e of events) {
    const c = Math.max(0, e.counts ?? e.I); if (c < 3 * (e.csig ?? e.sig)) continue;
    const [px, py] = P(e.x, e.y), f = Math.min(1, Math.log10(1 + c) / Math.log10(1 + maxC)), rad = 1.1 + 2.8 * f;
    const g = ctx.createRadialGradient(px, py, 0, px, py, rad * 1.6); g.addColorStop(0, `rgba(255,${200 + 55 * f | 0},${120 + 120 * f | 0},${0.35 + 0.65 * f})`); g.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, rad * 1.6, 0, 7); ctx.fill();
  }
  if (opts.boxes) { ctx.strokeStyle = 'rgba(120,230,160,.8)'; for (const e of opts.boxes) { const [px, py] = P(e.x, e.y); ctx.strokeRect(px - 5, py - 5, 10, 10); } }
  if (opts.mark) { const [px, py] = P(opts.mark.x, opts.mark.y); ctx.strokeStyle = '#5fc0cf'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, 11, 0, 7); ctx.stroke(); }
}
function drawRecip(cv, qs, UB, view) {
  const W = cv.width = 520, H = cv.height = 360, ctx = cv.getContext('2d'); ctx.fillStyle = '#0a0f15'; ctx.fillRect(0, 0, W, H);
  let Rv;
  if (view.down) { const ax = XS.mv(UB, view.down), z = XS.scl(ax, 1 / XS.nrm(ax)); let x = Math.abs(z[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0]; x = XS.sub(x, XS.scl(z, XS.dot(x, z))); x = XS.scl(x, 1 / XS.nrm(x)); Rv = [x, XS.cross(z, x), z]; }
  else Rv = XS.mm(XS.Rx(18), XS.Rz(view.rot || 0));
  const sc = 380; ctx.font = '12px JetBrains Mono, monospace';
  qs.map(q => XS.mv(Rv, q)).sort((a, b) => a[2] - b[2]).forEach(p => { const z = Math.max(-1, Math.min(1, p[2] * 2)); ctx.fillStyle = `rgba(${200 + 55 * z | 0},${170 + 40 * z | 0},90,${0.55 + 0.45 * (z + 1) / 2})`; ctx.beginPath(); ctx.arc(W / 2 + p[0] * sc, H / 2 - p[1] * sc, 2.2, 0, 7); ctx.fill(); });

function drawSpot(cv, e) {
  const N = 15, px = 16, ctx = cv.getContext('2d'); cv.width = cv.height = N * px;
  const r = XS.rng(Math.round(e.om * 1000) % 100000), sigma = 1.35, c = Math.max(0, e.counts), bpix = e.bkg / 25, grid = [], peak = [], bk = [];

  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const f = Math.sqrt(grid[j * N + i] / mx); ctx.fillStyle = `rgb(${20 + 235 * f | 0},${24 + 200 * f | 0},${32 + 120 * f | 0})`; ctx.fillRect(i * px, j * px, px, px); }

  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(7.5 * px, 7.5 * px, Math.sqrt(20) * px, 0, 7); ctx.stroke(); ctx.setLineDash([]);

}

const anglesHelp = () => fold('angles', 'About this view: the four angles, scans and the Ewald construction', `<div class="explain">
  <p><b>2θ</b> swings the detector arm about the vertical axis; it never moves the crystal. <b>ω</b> turns the whole goniometer about the same vertical axis. <b>χ</b> tilts the φ axis out of the vertical. <b>φ</b> spins the crystal on its pin. Each run moves one angle only (the scan axis); the others stay fixed.</p>
  <p><b>ω scan versus χ scan.</b> The ω axis is always perpendicular to the beam, so turning it carries lattice points through the Ewald sphere. At ω = 0 the χ axis points along the beam: turning about it keeps every lattice point at the same distance from the sphere, so nothing new diffracts. Try the presets “χ scan at ω = 0” and “χ scan at ω = 90°”.</p>
  <p><b>Ewald construction.</b> The sphere of radius 1/λ is centred on the crystal; the reciprocal-lattice origin sits where the beam leaves it. A lattice point touching the sphere satisfies Bragg’s law, and its diffracted beam runs from the crystal through that point. Only points inside the limiting sphere (radius 2/λ) can ever diffract.</p>
  <p class="muted small">Eulerian geometry (ω, χ, φ); most lab instruments use a κ goniometer that reaches the same orientations. Ewald view after L. J. Barbour, <i>J. Appl. Cryst.</i> 51 (2018) 1734, independently implemented.</p></div>`);

// ---------- step 1 ----------
function bijvoet(X, k) { let a = 0, b = 0; for (const [el, n] of Object.entries(X.formula)) { const f = XS.f0(el, 0); b += n * f * f; a += n * XS.ANOM[k][el][1] ** 2; } return Math.sqrt(2 * a / b); }
function recommend(X, R) {
  const mo = R[0], cu = R[1];
  if (X.formula.Br) return `Recommended: <b>Mo</b>. Bromine makes absorption strong (μ = ${cu.mu.toFixed(1)} mm⁻¹ with Cu), and Mo still gives a large anomalous signal (${pct(mo.bij, 1)}).`;
  if (X.sg === 19) return `Recommended: <b>Cu</b>. Light atoms only and (as the chemist would tell you) enantiopure: the Bijvoet ratio is ${pct(cu.bij, 2)} with Cu but ${pct(mo.bij, 2)} with Mo, too small for the absolute structure.`;
  return `Either works. Light atoms absorb little with both; Cu gives more intensity from a small crystal, Mo reaches high resolution with less detector swing.`;
}
function s1() {
  const X = XS.CRYSTALS[S.ck];
  const R = ['Mo', 'Cu'].map(k => { const ab = XS.absorption(X, k), src = XS.SOURCES[k]; return { src, th: XP.thetaFor(src.lambda, 0.84), mu: ab.mu, T: [Math.exp(-ab.mu * Math.max(...X.size)), Math.exp(-ab.mu * Math.min(...X.size))], rel: (src.lambda / 0.71073) ** 3, bij: bijvoet(X, k) }; });
  return `<div class="sheet col">
    <div class="cards">${Object.values(XS.CRYSTALS).map(c => `<button class="card" data-c="${c.key}" aria-pressed="${c.key === S.ck}"><b>${c.name}</b><span class="f">${XS.formulaStr(c.formula)}</span><span class="small muted">${c.desc}</span><span class="small muted">${c.size.map(v => v.toFixed(2)).join(' × ')} mm</span></button>`).join('')}</div>
    <div class="row"><span class="small muted">Source</span><div class="seg" id="src">${['Mo', 'Cu'].map(k => `<button data-s="${k}" aria-pressed="${k === S.src}">${XS.SOURCES[k].name}</button>`).join('')}</div>
      <span class="small muted">Temperature</span><div class="seg" id="temp">${[100, 293].map(t => `<button data-t="${t}" aria-pressed="${t === S.T}">${t} K</button>`).join('')}</div>
      <span class="small muted">The space group stays hidden until step 6.</span></div></div>
  <div class="sheet col"><div class="tscroll"><table><tr><th>${X.name}</th><th class="num">Mo Kα</th><th class="num">Cu Kα</th></tr>
    <tr><td>Wavelength · photon energy</td>${R.map(r => `<td class="num">${r.src.lambda.toFixed(5)} Å · ${r.src.keV.toFixed(2)} keV</td>`).join('')}</tr>
    <tr><td>θ needed for 0.84 Å</td>${R.map(r => `<td class="num">${r.th.toFixed(1)}°</td>`).join('')}</tr>
    <tr><td>Absorption μ · transmission</td>${R.map(r => `<td class="num">${r.mu.toFixed(2)} mm⁻¹ · ${r.T[0].toFixed(2)}–${r.T[1].toFixed(2)}</td>`).join('')}</tr>
    <tr><td>Diffracted intensity (∝ λ³)</td>${R.map(r => `<td class="num">× ${r.rel.toFixed(1)}</td>`).join('')}</tr>
    <tr><td>Anomalous signal (Bijvoet ratio)</td>${R.map(r => `<td class="num">${pct(r.bij, 2)}</td>`).join('')}</tr></table></div>
    <p class="callout">${recommend(X, R)}</p></div>
  ${fold('s1how', 'Why the source and temperature matter', `<div class="explain"><p><b>Reach.</b> d = λ / (2 sin θ): Mo reaches 0.84 Å at θ = 25°, Cu needs θ ≈ 67° and a detector swung to high angle.</p><p><b>Intensity.</b> For the same flux, diffracted intensity scales roughly with λ³: about ten times more for Cu.</p><p><b>Absorption</b> grows steeply with wavelength and heavy atoms; equivalent reflections then differ and scaling must correct them.</p><p><b>Anomalous signal</b> lets you tell a molecule from its mirror image; light atoms give a usable signal only with Cu.</p><p><b>Temperature</b>: at 100 K atoms vibrate less, so high-angle reflections are much stronger.</p><p class="warn small">Simulated training crystals: realistic cells, densities and absorption; randomly generated molecules.</p></div>`)}`;
}

// ---------- step 2 ----------
function s2() {
  const M = S.M, ix = M?.ix ? constrained(M.ix, M.ix.system) : null, fresh = M && M.sig === JSON.stringify([S.mRows, S.mD]);
  const res = M ? (ix ? `<div class="kpis"><div class="kpi"><span class="v">${M.harvested.length}</span><span class="l">strong spots (I/σ > 10)</span></div><div class="kpi"><span class="v">${ix.nIdx}/${ix.nTot}</span><span class="l">indexed</span></div><div class="kpi"><span class="v">${ix.lat}</span><span class="l">Bravais lattice</span></div><div class="kpi"><span class="v">${fmtE(ix.V, ix.Vesd)}</span><span class="l">V / Å³</span></div></div>
     <div class="tscroll"><table><tr><th>a / Å</th><th>b / Å</th><th>c / Å</th><th>α / °</th><th>β / °</th><th>γ / °</th></tr><tr class="mono">${ix.cell.map((v, i) => `<td>${fmtA(v, ix.esd[i])}</td>`).join('')}</tr></table></div>` : `<p class="warn">No cell: only ${M.harvested.length} strong spots. Use more frames, longer exposure, or a scan axis that is not along the beam.</p>`) : '';
  return `${M ? viewer('m', M.runs) : ''}
  <div class="two">
    <div class="sheet col"><div class="row" style="justify-content:space-between"><span class="eyebrow">Run list</span>${fold('presets', 'Presets and examples', `<div class="row small">${PRESETS.map(([k, l, d]) => `<button class="btn" data-pre="${k}" title="${d}">${l}</button>`).join('')}</div>`, 'inline')}</div>
      <div class="tscroll"><table class="mtab"><tr><th>#</th><th>Scan</th><th class="num">2θ</th><th class="num">ω</th><th class="num">χ</th><th class="num">φ</th><th class="num">°/fr</th><th class="num">frames</th><th class="num">s/fr</th><th class="num">spots</th><th></th></tr>
      ${S.mRows.map((r, i) => `<tr><td>${i + 1}</td><td><select data-r="${i}" data-k="axis" aria-label="Scan axis of run ${i + 1}">${[['omega', 'ω'], ['phi', 'φ'], ['chi', 'χ']].map(([v, l]) => `<option value="${v}" ${r.axis === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
        ${['tth', 'om', 'chi', 'phi'].map(k => `<td class="num"><input type="number" step="1" data-r="${i}" data-k="${k}" value="${r[k]}" aria-label="${k} of run ${i + 1}" class="${(r.axis === 'omega' && k === 'om') || r.axis === k ? 'scan' : ''}"></td>`).join('')}
        <td class="num"><select data-r="${i}" data-k="width" aria-label="Frame width of run ${i + 1}">${[0.25, 0.5, 1, 2].map(v => `<option value="${v}" ${r.width === v ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
        <td class="num"><input type="number" min="1" max="120" data-r="${i}" data-k="frames" value="${r.frames}" aria-label="Frames in run ${i + 1}"></td>
        <td class="num"><input type="number" min="0.5" max="120" step="0.5" data-r="${i}" data-k="exp" value="${r.exp}" aria-label="Exposure of run ${i + 1}"></td>
        <td class="num mono">${fresh && M.runs[i] ? M.runs[i].nSpots : '–'}</td>
        <td><button class="iconbtn" data-del="${i}" aria-label="Remove run ${i + 1}" ${S.mRows.length < 2 ? 'disabled' : ''}>×</button></td></tr>`).join('')}</table></div>
      <div class="row"><button class="btn" id="madd">+ Run</button><label class="small">Detector <select id="mD">${[40, 50, 60, 80, 100].map(v => `<option value="${v}" ${v === S.mD ? 'selected' : ''}>${v} mm</option>`).join('')}</select></label>
        <span class="small muted">${S.mRows.reduce((a, r) => a + r.frames, 0)} frames · ${S.mRows.reduce((a, r) => a + r.frames * r.exp, 0).toFixed(0)} s</span><span style="flex:1"></span>
        <button class="btn primary" id="mgo">Run and index</button></div>
      <p class="small muted">Highlighted cell = the angle that moves during that run. Spots = strong spots used for indexing.${M && !fresh ? ' <b>The table has changed: press Run and index.</b>' : ''}</p></div>
    <div class="sheet col"><span class="eyebrow">Unit cell</span>${res || '<p class="muted">Press Run and index.</p>'}
      ${M ? fold('recip', 'Show the harvested spots in reciprocal space', `<div class="rv"><canvas id="rv" aria-label="Reciprocal-space view"></canvas></div><div class="row"><input type="range" id="rvrot" min="0" max="360" value="${S.view.rot || 30}" style="flex:1" aria-label="Rotate"><button class="btn" data-down="1,0,0">down a*</button><button class="btn" data-down="0,1,0">down b*</button><button class="btn" data-down="0,0,1">down c*</button></div><p class="small muted">Looking down a reciprocal axis, the spots line up in rows: the lattice the indexing found.</p>`) : ''}
      ${fold('s2how', 'How indexing works', `<ol class="explain"><li><b>Spot harvesting</b>: strong spots and their positions (x, y, angle).</li><li><b>Reciprocal vectors</b>: each spot becomes q = s − s₀, rotated back to the crystal’s zero position.</li><li><b>Indexing</b>: three short non-coplanar vectors that make every q an integer combination h a* + k b* + l c*.</li><li><b>Reduced cell → Bravais lattice</b> from the metric.</li><li><b>Least squares</b> refines UB and the cell; the scatter gives the esds.</li></ol>`)}
      ${fold('s2width', 'Frame width, distance and exposure', `<div class="explain"><p>A reflection stays in diffraction over a rocking width of about 0.5–1°. Frames narrower than that record its profile and add less background, so weak spots improve; much narrower frames add files but little signal. 0.5° is the usual compromise; photon-counting detectors favour 0.2–0.3°.</p><p>A closer detector catches more spots and higher resolution; a farther one lowers the background and separates spots from long axes. Longer exposure raises I/σ by about √(time).</p></div>`)}
    </div>
  </div>
  ${M ? anglesHelp() : ''}`;
}

// ---------- step 3 ----------
function s3() {
  if (!S.M?.ix) return blocker('Index the crystal first (step 2).');
  const ST = S.ST, o = S.sOpt, cu = S.src === 'Cu', dOpts = cu ? [0.84, 0.82, 0.80] : [0.84, 0.80, 0.77, 0.75, 0.70];
  if (!dOpts.includes(o.dmin)) o.dmin = 0.80;
  const cmax = Math.max(...S.M.ix.cell.slice(0, 3)), sep = o.D * S.E.src.lambda / cmax;
  return `<div class="sheet col"><div class="row">
      <label class="fld">Resolution<select id="sd">${dOpts.map(d => `<option value="${d}" ${d === o.dmin ? 'selected' : ''}>${d.toFixed(2)} Å (θ ${XP.thetaFor(S.E.src.lambda, d).toFixed(1)}°)</option>`).join('')}</select></label>
      <label class="fld">Detector<select id="sD">${[40, 50, 60].map(v => `<option value="${v}" ${v === o.D ? 'selected' : ''}>${v} mm</option>`).join('')}</select></label>
      <label class="fld">Exposure<select id="sx">${[5, 10, 20, 40].map(v => `<option value="${v}" ${v === o.exposure ? 'selected' : ''}>${v} s/frame</option>`).join('')}</select></label>
      <label class="fld">Frame width<select id="sw">${[0.5, 1.0].map(v => `<option value="${v}" ${v === o.width ? 'selected' : ''}>${v}°</option>`).join('')}</select></label>
      <label class="fld">Redundancy<select id="sr">${[3, 4, 6, 8].map(v => `<option value="${v}" ${v === o.redundancy ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="fld">Friedel pairs<select id="sa"><option value="0" ${!o.anomalous ? 'selected' : ''}>merged</option><option value="1" ${o.anomalous ? 'selected' : ''}>separate</option></select></label>
      <span style="flex:1"></span><button class="btn primary" id="sgo">Calculate strategy</button></div>
    <p class="small muted">Closest spots ≈ ${sep.toFixed(2)} mm apart (${cmax.toFixed(1)} Å axis at ${o.D} mm). Below ~0.5 mm they start to overlap.</p>
    ${ST ? `<div class="kpis"><div class="kpi"><span class="v">${pct(ST.comp)}</span><span class="l">completeness to ${ST.dmin} Å</span></div><div class="kpi"><span class="v">${ST.red.toFixed(1)}</span><span class="l">redundancy</span></div><div class="kpi"><span class="v">${ST.frames}</span><span class="l">frames · ${ST.runs.length} runs</span></div><div class="kpi"><span class="v">${(ST.time / 3600).toFixed(1)} h</span><span class="l">exposure</span></div><div class="kpi"><span class="v">${(ST.tthMax / 2).toFixed(1)}°</span><span class="l">θ max</span></div></div>
    <div class="tscroll"><table><tr><th>Run</th><th class="num">2θ</th><th class="num">ω start → end</th><th class="num">χ</th><th class="num">φ</th><th class="num">frames</th></tr>${ST.runs.map((r, i) => `<tr><td>${i + 1}</td><td class="num">${r.tth}°</td><td class="num">${r.w0}° → ${r.w1}°</td><td class="num">${r.chi}°</td><td class="num">${r.phi}°</td><td class="num">${Math.round((r.w1 - r.w0) / r.width)}</td></tr>`).join('')}</table></div>` : ''}</div>
  ${ST ? fold('s3shell', 'Completeness by resolution shell', `<div class="tscroll"><table><tr><th>Shell / Å</th><th class="num">unique</th><th class="num">completeness</th><th class="num">redundancy</th></tr>${ST.shells.map(s => `<tr><td>${shellLab(s)}</td><td class="num">${s.n}</td><td class="num">${pct(s.comp)}</td><td class="num">${s.red.toFixed(1)}</td></tr>`).join('')}</table></div>`) : ''}
  ${fold('s3how', 'How a strategy is chosen', `<ul class="explain"><li>The orientation matrix predicts which reflections every possible scan records; scans are added until the targets are met.</li><li><b>Completeness</b> ≥ 99% to the target resolution, assuming Laue group ${S.M.ix.system === 'monoclinic' ? '2/m' : 'mmm'} from the ${S.M.ix.lat} lattice.</li><li><b>Resolution</b>: journals expect d ≤ 0.84 Å (θ ≥ 25° Mo, θ ≥ 67° Cu); high angle needs the detector swung out.</li><li><b>Redundancy</b> improves precision and feeds the absorption correction.</li><li><b>Friedel pairs separate</b> for an absolute structure: more scans are needed.</li></ul>`)}`;
}

// ---------- step 4 ----------
function s4() {
  if (!S.ST) return blocker('Calculate a strategy first (step 3).');
  const D = S.D;
  if (!D) return blocker(`Your strategy has ${S.ST.runs.length} runs and ${S.ST.frames} frames.`, '<button class="btn primary" id="dgo">Collect and integrate</button>');
  const obs = D.obs, n2 = obs.filter(o => o.I > 2 * o.sig).length, ix = constrained(S.M.ix, S.M.ix.system), pr = constrained(D.cell, S.M.ix.system);
  return `${viewer('d', S.ST.runs, `<label class="tog"><input type="checkbox" id="dbox" ${S.view.boxes ? 'checked' : ''}> Predicted boxes</label>`)}
  <div class="two">
    <div class="sheet col"><div class="row" style="justify-content:space-between"><span class="eyebrow">Integration summary</span><button class="btn" id="dgo">Collect again</button></div>
      <div class="kpis"><div class="kpi"><span class="v">${obs.length}</span><span class="l">reflections integrated</span></div><div class="kpi"><span class="v">${pct(n2 / obs.length)}</span><span class="l">with I > 2σ(I)</span></div><div class="kpi"><span class="v">${(S.ST.time / 3600).toFixed(1)} h</span><span class="l">measuring time</span></div></div>
      <div class="tscroll"><table><tr><th>from</th><th>a / Å</th><th>b / Å</th><th>c / Å</th><th>β / °</th><th>V / Å³</th></tr>
      <tr class="mono"><td>matrix</td>${[0, 1, 2, 4].map(i => `<td>${fmtA(ix.cell[i], ix.esd[i])}</td>`).join('')}<td>${fmtE(ix.V, ix.Vesd)}</td></tr>
      <tr class="mono"><td>all&nbsp;data</td>${[0, 1, 2, 4].map(i => `<td>${fmtA(pr.cell[i], pr.esd[i])}</td>`).join('')}<td>${fmtE(pr.V, pr.Vesd)}</td></tr></table></div>
      ${fold('s4shell', 'Mean I/σ by resolution shell', `<div class="tscroll"><table><tr><th>Shell / Å</th><th class="num">observations</th><th class="num">⟨I/σ⟩</th></tr>${D.rawShells.map(s => `<tr><td>${shellLab(s)}</td><td class="num">${s.nObs}</td><td class="num">${s.ios.toFixed(1)}</td></tr>`).join('')}</table></div>`)}</div>
    <div class="sheet col">${fold('spot', 'Integrate one spot, step by step', `<div class="row"><button class="btn" data-spot="strong">strong spot</button><button class="btn" data-spot="weak">weak spot</button><button class="btn" data-spot="high">high-angle spot</button></div><div id="spotout"><p class="small muted">Pick a spot: the viewer jumps to its frame and circles it.</p></div>`)}
      ${fold('s4how', 'What the integration program does', `<ol class="explain"><li><b>Prediction</b> of every spot from UB and the goniometer angles (green boxes).</li><li><b>Summation</b> inside the spot mask, minus the background per pixel from a surrounding ring.</li><li><b>σ(I)</b> from counting statistics.</li><li><b>Profile fitting</b> of weak spots with the average shape of strong neighbours.</li><li><b>Lorentz–polarisation correction</b>.</li><li><b>Post-refinement</b> of the cell from thousands of centroids, far more precise than the matrix run.</li></ol>`)}</div>
  </div>${anglesHelp()}`;
}

// ---------- step 5 ----------
function s5() {
  if (!S.D) return blocker('Collect the data first (step 4).');
  const SC = S.SC;
  if (!SC) return blocker('Equivalent reflections still disagree because of absorption and beam drift.', '<button class="btn primary" id="scgo">Scale and correct absorption</button>');
  const r = SC.res, runsS = S.ST.runs.map((_, i) => { const s = r.scales.filter(x => x.run === i).map(x => x.s); return s.length ? [Math.min(...s), Math.max(...s)] : [1, 1]; });
  return `<div class="sheet col"><div class="kpis"><div class="kpi"><span class="v">${pct(S.D.rawR)}</span><span class="l">R<sub>int</sub> before</span></div><div class="kpi"><span class="v">${pct(SC.R)}</span><span class="l">R<sub>int</sub> after</span></div><div class="kpi"><span class="v">${r.Tratio.toFixed(3)}</span><span class="l">T<sub>min</sub>/T<sub>max</sub> (true ${r.Ttrue.toFixed(3)})</span></div><div class="kpi"><span class="v">${r.e.toFixed(3)}</span><span class="l">error-model g</span></div></div>
    <div class="tscroll"><table><tr><th>Shell / Å</th><th class="num">N obs</th><th class="num">N unique</th><th class="num">redundancy</th><th class="num">⟨I/σ⟩</th><th class="num">R<sub>int</sub></th><th class="num">R<sub>σ</sub></th></tr>${SC.shells.map(s => `<tr><td>${shellLab(s)}</td><td class="num">${s.nObs}</td><td class="num">${s.nU}</td><td class="num">${s.red.toFixed(1)}</td><td class="num">${s.ios.toFixed(1)}</td><td class="num">${pct(s.rint)}</td><td class="num">${pct(s.rsig)}</td></tr>`).join('')}</table></div>
    <div class="row"><span class="small muted">${SC.merged.length} unique reflections, Laue group ${S.ST.laue}${S.ST.anomalous ? ', Friedel pairs separate' : ''}.</span><span style="flex:1"></span><button class="btn" id="scgo">Scale again</button></div></div>
  ${fold('s5runs', 'Scale factors by run', `<div class="tscroll"><table><tr><th>Run</th><th class="num">scale factor range</th></tr>${runsS.map((s, i) => `<tr><td>${i + 1}</td><td class="num">${s[0].toFixed(3)} – ${s[1].toFixed(3)}</td></tr>`).join('')}</table></div>`)}
  ${fold('s5how', 'What the scaling program does', `<ol class="explain"><li>Group equivalent reflections with the Laue group.</li><li>Refine scale factors for blocks of frames (every 15° here).</li><li>Refine a smooth absorption surface in the incident and diffracted beam directions (multi-scan, as in SADABS or SCALE3 ABSPACK).</li><li>Error model σ′² = σ² + (g·I)², so the scatter of equivalents matches σ.</li><li>Merge and report R<sub>int</sub> and R<sub>σ</sub> by shell. Try Crystal C with Cu for a large improvement.</li></ol>`)}`;
}

// ---------- step 6 ----------
function s6() {
  if (!S.SC) return blocker('Scale the data first (step 5).');
  const G = S.SG;
  if (!G) return blocker('Check lattice, Laue symmetry, absences and intensity statistics.', '<button class="btn primary" id="sggo">Analyse the data</button>');
  const lat = G.lattice.filter(x => x.L !== 'P');
  return `<div class="sheet col"><p class="callout">Best candidate: <b><i>${sgName(S.sgChoice)}</i></b> (No. ${S.sgChoice}). Lattice ${G.L}; ⟨|E² − 1|⟩ = ${G.e21.toFixed(3)} (0.968 centric, 0.736 acentric).</p>
    <div class="tscroll"><table><tr><th></th><th>Space group</th><th class="num">No.</th><th>centric</th><th class="num">predicted absences</th><th class="num">violations</th><th></th></tr>${G.cands.slice(0, 6).map(c => `<tr><td><input type="radio" name="sgc" value="${c.g}" ${c.g === S.sgChoice ? 'checked' : ''} aria-label="Choose ${esc(DBX[c.g].s)}"></td><td><i>${sgName(c.g)}</i></td><td class="num">${c.g}</td><td>${c.centro ? 'yes' : 'no'}</td><td class="num">${c.nAbs}</td><td class="num">${c.viol}</td><td>${c.ok ? '<span class="pill ok">consistent</span>' : '<span class="pill no">ruled out</span>'}</td></tr>`).join('')}</table></div>
    <div class="row"><span class="small muted">Among consistent groups the one explaining most absences ranks first.</span><span style="flex:1"></span><button class="btn" id="sggo">Analyse again</button></div></div>
  ${fold('s6lat', 'Lattice centring', `<div class="tscroll"><table><tr><th>Centring</th><th class="num">N tested</th><th class="num">N > 3σ</th><th class="num">⟨I/σ⟩</th><th></th></tr>${lat.map(x => `<tr><td>${x.L}</td><td class="num">${x.n}</td><td class="num">${x.nStrong}</td><td class="num">${x.ios.toFixed(1)}</td><td>${x.nStrong <= Math.max(2, 0.01 * x.n) ? '<span class="pill ok">absent</span>' : '<span class="pill no">present</span>'}</td></tr>`).join('')}</table></div>`)}
  ${fold('s6laue', 'Laue group', `<div class="tscroll"><table><tr><th>Laue group</th><th class="num">R<sub>int</sub></th></tr>${G.laue.map(l => `<tr><td>${l.l}</td><td class="num">${pct(l.r)}</td></tr>`).join('')}</table></div><p class="small muted">Choose the highest symmetry whose R<sub>int</sub> stays close to that of 1̄.</p>`)}
  ${fold('s6abs', 'Systematic absences', `<div class="tscroll"><table><tr><th>Class</th><th>Condition</th><th class="num">N</th><th class="num">N > 3σ</th><th class="num">⟨I/σ⟩</th><th></th></tr>${G.classes.filter(c => c.n).map(c => `<tr><td class="mono">${c.cls}</td><td>${c.cond}</td><td class="num">${c.n}</td><td class="num">${c.nStrong}</td><td class="num">${c.ios.toFixed(1)}</td><td>${c.nStrong <= Math.max(1, 0.02 * c.n) ? '<span class="pill ok">absent</span>' : ''}</td></tr>`).join('')}</table></div>`)}
  ${fold('s6how', 'How the space group is found', `<ol class="explain"><li>Lattice centring from reflections a centred lattice would extinguish.</li><li>Laue group from the R<sub>int</sub> of merging.</li><li>Glide planes from zone absences, screw axes from row absences.</li><li>Centric or not from the |E|² distribution (Wilson B = ${G.wilson.B.toFixed(2)} Å²).</li><li>Every space group of the Laue class tested against the absences. The structure solution is the final test.</li></ol>`)}`;

// generic plot: series of lines or dots, tick rows, optional difference curve; returns x<->px mapping
function plotXY(cv, o) {

  const L = 56, R = 14, T = 12, B = 34 + tickH + dH, pw = W - L - R, ph = H - T - B;

  if (!o.ymax) { for (const s of o.series) for (let i = 0; i < s.x.length; i++) if (s.x[i] >= x0 && s.x[i] <= x1 && s.y[i] > ymax) ymax = s.y[i]; ymax *= 1.06; }
  const X = x => L + (x - x0) / (x1 - x0) * pw, Y = y => T + ph - (y - ymin) / (ymax - ymin) * ph;
  // grid + axes
  c.strokeStyle = rule; c.lineWidth = 1; c.font = '11px JetBrains Mono, monospace'; c.fillStyle = muted; c.textAlign = 'center';
  const span = x1 - x0, st = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20].find(s => span / s <= 10) || 20;
  for (let t = Math.ceil(x0 / st) * st; t <= x1 + 1e-9; t += st) { const px = X(t); c.beginPath(); c.moveTo(px, T); c.lineTo(px, T + ph); c.globalAlpha = 0.5; c.stroke(); c.globalAlpha = 1; c.fillText(+t.toFixed(2), px, H - 8 - (o.xlab ? 12 : 0) + (o.xlab ? 0 : 0)); }
  c.save(); c.translate(14, T + ph / 2); c.rotate(-Math.PI / 2); c.fillText(o.ylab || 'Intensity (counts)', 0, 0); c.restore();
  c.textAlign = 'right'; for (let k = 0; k <= 4; k++) { const v = ymin + (ymax - ymin) * k / 4; c.fillText(v >= 1000 ? (v / 1000).toFixed(v >= 1e4 ? 0 : 1) + 'k' : v.toFixed(v < 10 ? 1 : 0), L - 6, Y(v) + 4); }
  c.textAlign = 'center'; if (o.xlab) c.fillText(o.xlab, L + pw / 2, H - 4);
  c.strokeStyle = muted; c.beginPath(); c.moveTo(L, T); c.lineTo(L, T + ph); c.lineTo(L + pw, T + ph); c.stroke();
  c.save(); c.beginPath(); c.rect(L, T, pw, ph); c.clip();
  for (const s of o.series) {
    c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = s.width || 1.4; c.globalAlpha = s.alpha || 1;
    if (s.mode === 'dots') { for (let i = 0; i < s.x.length; i++) { if (s.x[i] < x0 || s.x[i] > x1) continue; c.fillRect(X(s.x[i]) - 1, Y(s.y[i]) - 1, 2, 2); } }
    else { c.beginPath(); let pen = false; for (let i = 0; i < s.x.length; i++) { if (s.x[i] < x0 - span * 0.01 || s.x[i] > x1 + span * 0.01) { pen = false; continue; } const px = X(s.x[i]), py = Y(s.y[i]); pen ? c.lineTo(px, py) : c.moveTo(px, py); pen = true; } c.stroke(); }

  // difference curve
  if (o.diff) { const y0 = H - 34 - dH / 2 - (o.xlab ? 0 : 0) - 0; const dm = Math.max(...o.diff.y.map(Math.abs), 1); const k = (dH / 2 - 4) / Math.max(dm, (ymax - ymin) * 0.08); c.strokeStyle = muted; c.lineWidth = 1; c.beginPath(); let pen = false; for (let i = 0; i < o.diff.x.length; i++) { if (o.diff.x[i] < x0 || o.diff.x[i] > x1) { pen = false; continue; } const px = X(o.diff.x[i]), py = y0 - o.diff.y[i] * k; pen ? c.lineTo(px, py) : c.moveTo(px, py); pen = true; } c.stroke(); c.fillStyle = muted; c.textAlign = 'left'; c.fillText('obs − calc', L + 4, y0 - dH / 2 + 10); }

  cv.onpointermove = e => { const r = cv.getBoundingClientRect(), px = e.clientX - r.left; if (drag) { drag[1] = px; onZoom(null, drag); return; } if (hover) hover(getMap().inv(px), px); };

  cv.ondblclick = () => onZoom('reset');

}

  const f = P.fitRes && P.fitRes.sig === P.unk + JSON.stringify(P.unk === 'mine' ? P.mix : 0) ? P.fitRes : null;
  if (f) {
    const truth = Object.fromEntries((u.phases || []).map(p => [p.id, p.w]));
    $('#pfitres').innerHTML = `<div class="kpis"><div class="kpi"><span class="v">${(f.Rwp * 100).toFixed(2)}%</span><span class="l">R<sub>wp</sub></span></div><div class="kpi"><span class="v">${f.chi2.toFixed(2)}</span><span class="l">χ² (≈ 1 is ideal)</span></div><div class="kpi"><span class="v">${f.z.toFixed(2)}°</span><span class="l">zero shift</span></div></div>
      <div class="tscroll"><table><tr><th>Phase</th><th class="num">weight %</th>${P.reveal || P.unk === 'mine' ? '<th class="num">true %</th>' : ''}</tr>${f.parts.map(p => `<tr><td><i class="sw" style="background:var(${PCOL[p.id]})"></i>${PW.LIB[p.id].name}</td><td class="num">${(p.wt * 100).toFixed(1)}</td>${P.reveal || P.unk === 'mine' ? `<td class="num">${((truth[p.id] || 0) * 100).toFixed(0)}</td>` : ''}</tr>`).join('')}</table></div>
      ${f.dropped.length ? `<p class="small">Dropped (scale went negative): ${f.dropped.map(id => PW.LIB[id].short).join(', ')}.</p>` : ''}
      <p class="small muted">Look at the difference curve under the plot: peaks left over mean a phase is missing from the model.</p>`;
  }
}

function wirePowder() {

  $('#ptmax').onchange = e => { P.tmax = +e.target.value; P.zoom = null; P.fitRes = null; P.sm = null; render(); };

const gs = (n, title, body, goTo) => `<details class="gstep disclosure"><summary><span class="gn">${n}</span><span>${title}</span></summary><div class="disclosure-body">${body}${goTo !== undefined ? `<div class="go"><button class="btn" data-go="${goTo[0]}">${goTo[1]}</button></div>` : ''}</div></details>`;

// SC guide (index 8)
function g_sc() {

    gs(2, 'Mount it', gl(['Air- or moisture-sensitive crystals: cover them in inert oil (for example a perfluoropolyether or Paratone oil) and pick them up on a micromount loop.', 'Stable crystals at room temperature can be glued to a glass fibre or placed in a thin capillary.', 'Use as little oil or glue as possible: surplus adds background scatter and hides weak spots.'])) +
    gs(3, 'Centre and cool', gl(['Fit the loop to the goniometer head and centre the crystal in the beam with the video camera, checking at several φ angles.', 'Start the cold nitrogen stream (commonly about 100 K) before the crystal can dry or lose solvent. Ice forms if the gas is not dry.', 'Close the enclosure and check the interlocks and shutter before any exposure, and follow your local radiation rules.'])) +
    gs(4, 'Choose the X-ray source and temperature', gp('Select wavelength using composition, absorption and the required anomalous signal. Cu can help light-atom absolute-structure work; Mo is often useful for heavier-element samples. Cooling often reduces thermal motion, but may cause a phase transition.'), [0, 'Open: Crystal & X-ray source']) +
    gs(5, 'Matrix run and unit cell', gp('A few short scans give enough spots to find the unit cell and Bravais lattice. Check the cell is sensible and the spots are sharp and round, not split.'), [1, 'Open: Matrix run & unit cell']) +
    gs(6, 'Data-collection strategy', gp('Plan the scans for the crystal system: aim for high completeness, redundancy of about 4–6, and resolution to about 0.80 Å or better. Exposure per frame is set by how strongly the crystal diffracts.'), [2, 'Open: Strategy']) +
    gs(7, 'Collect and integrate', gp('Collect all frames. Integration converts spot intensities on the frames into a list of h, k, l and intensity values.'), [3, 'Open: Collect & integrate']) +
    gs(8, 'Scale and absorption correction', gp('Frames are scaled to each other and corrected for absorption. Rint and Rsigma tell you how consistent equivalent reflections are.'), [4, 'Open: Scale & absorption']) +
    gs(9, 'Space group', gp('Systematic absences and the Laue symmetry point to candidate space groups. Several can look similar, so check intensity statistics before choosing.'), [5, 'Open: Space group']) +
    gs(10, 'Write the .ins and .hkl files', gp('The .hkl holds the reflections (h k l F² σ(F²)); the .ins holds the cell, space group and the atoms in the formula.'), [6, 'Open: .ins & .hkl files']) +
    gs(11, 'Solve and refine', gp('Solve with SHELXT (or Olex2) to find the atoms, then refine with SHELXL. Finish with a CIF and run checkCIF before you trust the structure.')));
}

// PW 1: sample preparation (index 9)
function g_prep() {
  return sheet('Prepare the sample',
    gs(1, 'Grind to a fine, even powder', gl(['Aim for particles of about 1–10 µm so enough crystallites diffract and the intensities are reliable.', 'Grind gently in an agate mortar, ideally with a little ethanol. Hard grinding can add strain, broaden peaks or even change the phase.', 'Soft or layered samples (clays, hydrates, molecular solids) need extra care: do not over-grind.'])) +
    gs(2, 'Avoid preferred orientation', gl(['Platy or needle crystals line up in a flat holder and distort the intensities.', 'Load from the back or side of the holder instead of pressing from the top, or mix with a little amorphous filler.', 'A rotating capillary largely avoids the problem.'])) +
    gs(3, 'Check the amount and the surface', gl(['A standard flat holder needs a gram or so. For very small amounts use a low-background plate or a capillary.', 'The surface must be flat and level with the holder rim. A raised or sunken surface shifts all the peaks (sample displacement).'])) +
    gs(4, 'Add a standard when you need one', gl(['An internal standard such as silicon or corundum fixes the zero shift and lets you measure the amorphous fraction.', 'Use a known mass ratio and mix it in thoroughly.'])) +
    gs(5, 'Protect sensitive samples', gl(['Air-sensitive samples: load in a glovebox into a sealed capillary or an airtight dome holder.', 'Toxic or nanosized powders: follow your local safety rules for handling and disposal.'])));

// PW 2: geometry (index 10)
const GEO = {
  plate: { name: 'Flat plate (reflection)', best: 'Routine phase ID and Rietveld on well-prepared powders with plenty of sample.',
    pros: ['Highest intensity for a given sample amount on a laboratory instrument.', 'Fast, simple, widely available (Bragg–Brentano focusing).', 'Easy to change samples; works for bulk solids, films and pressed pellets.'],
    cons: ['Preferred orientation is common; surface roughness and sample height errors matter.', 'Needs more sample, and the beam footprint at low angle can overspill the sample.', 'Absorption-sensitive intensities at low angle for very absorbing material.'] },
  cap: { name: 'Capillary (Debye–Scherrer)', best: 'Small amounts, air-sensitive samples, molecular or organic materials, structure solution and in-situ gas or temperature work.',
    pros: ['Needs only a few mg and the sample is sealed.', 'Rotation averages the orientation of the grains and reduces preferred orientation.', 'Good for strongly absorbing samples when diluted.'],
    cons: ['Lower intensity, so longer counting.', 'Absorption in the capillary needs checking, especially with Cu radiation.', 'Packing the capillary evenly takes practice.'] },
  trans: { name: 'Transmission (flat sample)', best: 'Thin foils, films between supports, quick screening of small amounts, soft materials that stay in a thin layer.',
    pros: ['Little preferred orientation compared with reflection.', 'Small samples between two thin films (such as Kapton or Mylar) work well.', 'Fixed geometry, so no sample height problem.'],
    cons: ['Sample thickness must match absorption: too thick and the beam is lost.', 'Supports add background, often a broad hump.', 'Needs a parallel or focused beam optic suited to transmission.'] }
};
function geoSvg(k) {

  if (k === 'trans') return `<svg viewBox="0 0 260 180" role="img" aria-label="Transmission geometry: beam passes through a thin flat sample"><rect class="sm" x="8" y="76" width="16" height="28" rx="2"/><text x="6" y="116">X-ray tube</text><line class="bm" x1="24" y1="90" x2="127" y2="90"/><rect class="sm" x="127" y="52" width="6" height="76" rx="1"/><text x="104" y="146">thin flat sample</text><line class="bm" x1="133" y1="90" x2="214" y2="90" stroke-dasharray="4 3"/><line class="df" x1="133" y1="90" x2="205" y2="40"/><line class="df" x1="133" y1="90" x2="205" y2="140"/><path class="ln" d="M214 30 A 110 110 0 0 1 214 150"/><rect class="dt" x="212" y="82" width="10" height="16"/><text x="206" y="170">detector</text></svg>`;
  return `<svg viewBox="0 0 260 180" role="img" aria-label="Capillary geometry: beam passes across a thin rotating capillary"><rect class="sm" x="8" y="76" width="16" height="28" rx="2"/><text x="6" y="116">X-ray tube</text><line class="bm" x1="24" y1="90" x2="127" y2="90"/><rect class="ln" x="126" y="46" width="8" height="88" rx="4"/><rect class="sm" x="128" y="64" width="4" height="52"/><text x="92" y="146">capillary, rotating</text><path class="ln" d="M144 60 A 18 18 0 0 1 156 74"/><line class="bm" x1="134" y1="90" x2="214" y2="90" stroke-dasharray="4 3"/><line class="df" x1="134" y1="90" x2="205" y2="40"/><line class="df" x1="134" y1="90" x2="205" y2="140"/><path class="ln" d="M214 30 A 110 110 0 0 1 214 150"/><rect class="dt" x="212" y="82" width="10" height="16"/><text x="206" y="170">detector</text></svg>`;
}

    gs(2, 'Choose the geometry and beam optics', gl(['Bragg–Brentano with a flat plate is the routine laboratory choice.', 'For capillary or transmission work use a focusing or parallel-beam optic (a curved monochromator or mirror) with a Debye–Scherrer set-up.', 'Parallel-beam optics suit rough, curved or small samples because the pattern is less sensitive to the sample height.'])) +

    gs(4, 'Choose the detector', gl(['Point detector: simple and slow.', 'Linear or area detector: collects many angles at once, so a scan takes minutes instead of hours.', 'Synchrotron beamlines give very high resolution, tiny samples and fast time-resolved data; neutrons help with light elements and magnetic order.'])) +

function g_vt() {
  return sheet('Variable-temperature and humidity stages',
    gs(1, 'Decide what you need to follow', gl(['Phase transitions and thermal expansion: variable temperature.', 'Hydration, dehydration and gas uptake (for example in framework materials): controlled humidity or gas flow.', 'Reactions and crystallisation: time-resolved measurements in a heated or gas-flow cell.'])) +

      <tr><td>Cold nitrogen stream (capillary)</td><td>About 80–500 K</td><td>Quick to change; good for capillaries</td></tr>
      <tr><td>Closed-cycle helium cryostat</td><td>About 10–300 K</td><td>Low temperatures; slower and needs windows</td></tr>
      <tr><td>High-temperature furnace or strip heater</td><td>To several hundred or over 1000 °C</td><td>Choose holder material to avoid reaction with the sample</td></tr>
      <tr><td>Humidity (relative humidity) chamber</td><td>Roughly 5–95 % RH at a set temperature</td><td>Needs equilibration time at each step</td></tr></table></div>

function g_collect() {

// PW: phase ID (14), structure solution (15), Rietveld (16)
function g_phase_intro() {
  return sheet('Phase identification',
    gs(1, 'Prepare the pattern', gl(['Subtract or model the background and check the zero shift. An internal standard helps.', 'Find the peak positions and note any peaks that are broad, split or unusually strong.'])) +
    gs(2, 'Search and match', gl(['Restrict the search with the elements you know are present.', 'Match positions (d-spacings) first and intensities second; intensities change with preferred orientation.', 'Typical databases: PDF (ICDD), the free COD, ICSD; free programs such as Profex or QualX can be used.'])) +
    gs(3, 'Check all the peaks', gl(['Every strong peak should belong to a phase. Look for small leftover peaks: they may be minor phases.', 'Solid solutions move the peaks, so the match can be close rather than exact.'])) +
    gs(4, 'Quantify', gp('Use the Rietveld method or the reference-intensity ratio method for weight fractions. Add an internal standard to estimate the amorphous content.'))) +
    `<div class="sheet col modeinfo"><span class="eyebrow">Try it</span><p>Use the simulator below: search and match an unknown pattern, then fit the weight fractions of a mixture.</p></div>`;
}
function g_solve() {
  return sheet('Structure solution from powder data',
    gp('This route is for a new or poorly known structure. It needs high-quality data, so use a capillary and a monochromatic beam, and count for a long time.') +
    gs(1, 'Collect good data', gp('Use a rotating capillary, a Kα1 or synchrotron beam and a long scan to a d-spacing of about 1 Å or better.')) +
    gs(2, 'Index the pattern', gl(['Find accurate peak positions and index them to get the unit cell (programs such as DICVOL, TREOR, X-Cell or the indexing routine in TOPAS).', 'A figure of merit such as M20 above about 20 means the solution is likely correct. Check that the volume is consistent with the formula and density.'])) +
    gs(3, 'Find the space group', gp('Use the systematic absences, then confirm the cell and the intensities with a Pawley or Le Bail fit that needs no structural model.')) +
    gs(4, 'Solve the structure', gl(['Inorganic structures: direct methods or charge flipping on the extracted intensities (programs such as EXPO or Superflip).', 'Molecular materials: global optimisation in direct space, building the molecule as a rigid body or with a Z-matrix (DASH, TOPAS and FOX are examples).', 'Heavy peak overlap is the main difficulty, so think about which method copes best with it.'])) +
    gs(5, 'Complete and refine', gp('Add missing atoms from difference Fourier maps, then refine by the Rietveld method with restraints on bond lengths and angles.')) +
    gs(6, 'Check the result', gl(['Chemistry: sensible bond lengths, coordination and packing.', 'Fit: flat difference curve and sensible R factors.', 'Optional: compare with a computed structure (for example a DFT geometry optimisation).'])));
}
function g_riet() {
  return sheet('Rietveld refinement',
    gp('The Rietveld method fits the whole measured pattern with a calculated one built from the structure and the instrument. Refine in small steps and add parameters only when the fit needs them.') +
    gs(1, 'Start with scale and background', gp('Refine the scale factor and a flexible background (Chebyshev polynomial with about 6–12 terms).')) +
    gs(2, 'Fix the peak positions', gp('Refine the zero shift or sample displacement and then the unit cell parameters.')) +
    gs(3, 'Refine the peak shape', gl(['Refine width and shape parameters (for example Caglioti U, V, W, or fundamental parameters).', 'Add crystallite size and strain broadening next, and asymmetry at low angle if needed.'])) +
    gs(4, 'Add the atomic parameters', gl(['Refine atomic positions, with restraints for molecular materials.', 'Refine isotropic displacement parameters (grouped by element or site) before any anisotropic ones.', 'Refine occupancies only when you have a good reason and good data.'])) +
    gs(5, 'Correct the intensities if needed', gp('Add a preferred-orientation correction (March–Dollase or spherical harmonics) only if the difference curve shows it. Check that absorption and surface roughness effects are not misleading.')) +
    gs(6, 'Judge the fit', `<div class="tscroll"><table><tr><th>Check</th><th>What to look for</th></tr>
      <tr><td>Difference curve</td><td>Flat, without systematic features at the peaks</td></tr>
      <tr><td>Rwp compared with Rexp</td><td>Goodness of fit Rwp/Rexp close to 1 (a value up to about 2 is often acceptable for good data)</td></tr>
      <tr><td>RBragg</td><td>Quality of the structural model for each phase</td></tr>
      <tr><td>Chemistry</td><td>Sensible bond lengths and displacement parameters</td></tr>
      <tr><td>Parameter values and esds</td><td>Stay reasonable and stable when the refinement is repeated; esds from Rietveld are usually underestimated</td></tr></table></div>`) +
    gs(7, 'Report it', gp('Report the radiation, instrument, range, the refinement software and version, the R values, the cell and the key refined parameters. Include a figure of the fit with the difference curve.')) +
    `<p class="small muted">Common programs: TOPAS (a Bruker product), GSAS-II, FullProf, Profex/BGMN and Jana2020. Names belong to their owners; no affiliation or endorsement is implied. Step-by-step TOPAS notes will be added on the website.</p>`);
}

function tf_optics() {
  return sheet('Divergent or parallel beam?', `<p class="small muted">Rays leave the source, meet the sample and reach the detector. Raise the sample surface and see which geometry cares.</p>
    <div class="row">${segb('geo', [['div', 'Divergent (Bragg–Brentano)'], ['par', 'Parallel (mirror)']])}</div>
    <div class="tfs"><div class="tfsvg" id="osvg"></div>${sl('th', 'Bragg angle θ', 5, 70, 1, '°')}${sl('hs', 'Sample height error', -1, 1, 0.05, ' mm')}</div>
    <div class="kpis" id="okpi"></div>
    <p class="small muted">Divergent rays are <i>focused</i> back to the detector slit, so well-prepared flat powders give sharp peaks, but a surface that is not at the goniometer axis shifts the peaks. A parallel beam keeps nearly the same direction, so height errors change where rays land, not the angle. Parallel is not automatically sharper or more intense.</p>`) +
    sheet('Footprint at low angle', `<p class="small muted">At grazing incidence a narrow beam is smeared into a long stripe. If the stripe is longer than the sample, part of the beam misses it.</p>
    <div class="tfs">${sl('fw', 'Beam width', 0.05, 2, 0.05, ' mm')}${sl('fo', 'Incident angle ω', 0.1, 30, 0.1, '°')}${sl('fl', 'Sample length', 5, 50, 1, ' mm')}</div>
    <div class="tfsvg" id="fsvg"></div><div class="kpis" id="fkpi"></div>`) +
    sheet('Slits and optics: what each one does', `<div class="tscroll"><table><tr><th>Component</th><th>Main job</th><th>Why it matters</th></tr>
      <tr><td>Divergence slit</td><td>Limits incident spread in the diffraction plane</td><td>Sets footprint and incident intensity</td></tr>
      <tr><td>Soller slits</td><td>Parallel foils restrict spread <i>out of</i> the diffraction plane (axial)</td><td>Improves peak symmetry, especially at low angle</td></tr>
      <tr><td>Anti-scatter slit / knife</td><td>Blocks unwanted scattered rays</td><td>Lowers background from air and surroundings</td></tr>
      <tr><td>Receiving slit</td><td>Limits angular acceptance before a point detector</td><td>Narrower acceptance can sharpen resolution</td></tr>
      <tr><td>Beam mask</td><td>Limits beam length across the specimen</td><td>Keeps the beam off the holder and sample edges</td></tr></table></div>
    <p class="small muted">Narrower apertures usually lose counts. Position-sensitive detectors may use an active angular window instead of a conventional receiving slit.</p>`);
}
function wireOptics() {

    if (TFS.geo === 'div') {

      g += `<circle cx="${Sx}" cy="${Sy}" r="6" class="dt"/><text x="${Sx - 8}" y="${Sy - 12}" text-anchor="middle">source</text><rect x="${Dx - 3}" y="${Dy - 14}" width="6" height="28" class="dt"/><text x="${Dx}" y="${Dy - 20}" text-anchor="middle">receiving slit</text>`;
    } else {

        g += `<line class="bm" x1="${sx}" y1="${sy}" x2="${hx}" y2="${ys}"/><line class="df" x1="${hx}" y1="${ys}" x2="${hx + 250 * dx}" y2="${ys - 250 * dy}"/>`; }
      g += `<polygon points="${Sx - 8},${Sy - 44} ${Sx + 8},${Sy - 44} ${Sx + 8},${Sy + 44} ${Sx - 8},${Sy + 44}" class="f2" transform="rotate(${-TFS.th * 0.4} ${Sx} ${Sy})"/><text x="${Sx - 8}" y="${Sy - 52}" text-anchor="middle">Göbel mirror</text>
        <rect x="${Dx - 10}" y="${Dy - 30}" width="20" height="60" class="f3"/><text x="${Dx}" y="${Dy - 38}" text-anchor="middle">parallel-plate collimator</text>`;

function wireSource() {
  const a = () => AN[TFS.an], f = () => FIL[TFS.fil];
  const draw = () => {
    const A = a(), F = f(), lmin = 12.398 / A.kv, x = [], y = [];
    for (let l = lmin; l <= A.l2 * 1.22; l += (A.l2 * 1.22 - lmin) / 1400) {
      const r = l / lmin, cont = 12 * (r - 1) / (r * r * r) * 5.2 * F.c;
      const v = cont + 100 * F.a1 * gauss(l - A.l1, 0.0035 * A.l1 / 1.54) + 50 * F.a2 * gauss(l - A.l2, 0.0035 * A.l1 / 1.54) + 20 * F.b * gauss(l - A.lb, 0.0035 * A.l1 / 1.54);
      x.push(l); y.push(v);
    }
    plotXY($('#spl'), { h: 240, xr: [lmin, A.l2 * 1.22], series: [{ x, y, color: cssv('--accent'), width: 1.5 }], xlab: 'wavelength (Å)', ylab: 'relative intensity', ymax: 112, ymin: 0 });
    $('#splr').textContent = `${TFS.an}: Kα1 ${A.l1.toFixed(4)} Å · Kα2 ${A.l2.toFixed(4)} Å · Kβ ${A.lb.toFixed(4)} Å · Kβ filter material: ${A.flt}`;
    // doublet profile at chosen d
    const d = TFS.dd, s1 = A.l1 / (2 * d);
    if (s1 >= 1) { const c = cvs('dpl', 220); c.c.fillStyle = cssv('--paper'); c.c.fillRect(0, 0, c.W, 220); c.c.fillStyle = cssv('--muted'); c.c.font = '13px Public Sans'; c.c.fillText('This d-spacing is not reachable with this wavelength (sinθ > 1).', 14, 40); $('#dplr').textContent = ''; }
    else {
      const t = l => 2 * Math.asin(Math.min(1, l / (2 * d))) * R2D_, t1 = t(A.l1), t2 = t(A.l2), tb = t(A.lb), lo = t1 - 0.7, hi = Math.max(t2, t1) + 0.9, xs = [], ys = [], w = 0.05;
      for (let q = lo; q <= hi; q += (hi - lo) / 600) { xs.push(q); ys.push(100 * F.a1 * gauss(q - t1, w) + 50 * F.a2 * gauss(q - t2, w) + 20 * F.b * gauss(q - tb, w)); }
      plotXY($('#dpl'), { h: 220, xr: [lo, hi], series: [{ x: xs, y: ys, color: cssv('--c2'), width: 1.6 }], xlab: '2θ (°)', ylab: 'counts (relative)', ymax: 112, ymin: 0 });
      $('#dplr').textContent = `Kα1 at ${t1.toFixed(3)}° · Kα2 at ${t2.toFixed(3)}° · splitting ${(t2 - t1).toFixed(3)}° (grows with tanθ)` + (tb > lo - 5 && tb < hi + 5 ? '' : ` · Kβ at ${tb.toFixed(2)}° (off scale)`);
    }
    $('#atab').innerHTML = `<table><tr><th>Anode</th><th>Kα1 (Å)</th><th>2θ at d=${d.toFixed(2)} Å</th></tr>${Object.entries(AN).map(([k, v]) => { const s = v.l1 / (2 * d); return `<tr class="${k === TFS.an ? 'hlrow' : ''}"><td>${k}</td><td>${v.l1.toFixed(4)}</td><td>${s < 1 ? (2 * Math.asin(s) * R2D_).toFixed(2) + '°' : 'not reachable'}</td></tr>`; }).join('')}</table>`;

(--shadow);font-size:17px}\n\n/* Peak marker */\n.peak-dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);display:inline-block;vertical-align:middle;margin-right:4px}\n\n/* Progress bar */\n.prog-wrap{background:var(--bg3);border-radius:4px;height:8px;overflow:hidden;margin:3px 0}\n.prog-bar{height:100%;border-radius:4px;transition:width .3s;background:var(--accent)}\n.prog-bar.green{background:var(--accent3)}.prog-bar.amber{background:var(--accent2)}\n\n/* Absence grid */\n.abs-cell{display:inline-block;width:28px;height:28px;border-radius:4px;text-align:center;line-height:28px;font-size:11px;font-weight:600;margin:2px;cursor:default;border:1px solid var(--border)}\n.abs-present{background:color-mix(in srgb,var(--accent3) 20%,var(--bg2));color:var(--accent3)}\n.abs-absent{background:color-mix(in srgb,var(--danger) 20%,var(--bg2));color:var(--danger);text-decoration:line-through}\n.abs-unknown{background:var(--bg3);color:var(--fg3)}\n\n.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n@media(max-width:600px){.two-col{grid-template-columns:1fr}}\n@keyframes spin{to{transform:rotate(360deg)}}\n\n/* ── Collapsible cards ── */\n.card.collapsible>.card-hdr{cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between;margin-bottom:0}\n.card.collapsible>.card-hdr h3{margin:0}\n.card.collapsible>.card-hdr .chev{font-size:12px;color:var(--fg3);transition:transform .2s;flex-shrink:0;margin-left:8px}\n.card.collapsible.open>.card-hdr .chev{transform:rotate(90deg)}\n.card.collapsible>.card-body{overflow:hidden;max-height:0;transition:max-height .3s ease,padding .2s}\n.card.collapsible.open>.card-body{max-height:3000px;padding-top:12px}\n\n/* ── More-info detail ── */\n.more-info{margin-top:10px}\n.more-info-toggle{background:none;border:none;padding:0;cursor:pointer;font-size:12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:5px}\n.more-info-toggle .mi-chev{transition:transform .2s;font-size:10px}\n.more-info-toggle.open .mi-chev{transform:rotate(90deg)}\n.more-info-body{max-height:0;overflow:hidden;transition:max-height .35s ease}\n.more-info-body.open{max-height:4000px}\n.math-block{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.75;margin:8px 0}\n.math-block code{font-size:12.5px;color:var(--accent)}\n.eq{text-align:center;padding:6px 0;font-style:italic;font-size:14px;color:var(--fg)}\n/* Algorithm blocks */\n.algo-block{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px}\n.algo-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none;background:var(--bg2);transition:background .15s}\n.algo-hdr:hover{background:var(--bg3)}\n.algo-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.algo-badge{color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:5px;white-space:nowrap}\n.algo-sub{font-size:12px;color:var(--fg3)}\n.algo-chev{font-size:11px;color:var(--fg3);transition:transform .2s;flex-shrink:0}\n.algo-hdr.open .algo-chev{transform:rotate(90deg)}\n.algo-body{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 14px}\n.algo-body.open{max-height:1200px;padding:12px 14px}\n\n\n.more-grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);margin:22px 0 8px}\n#page-more .card.collapsible.open>.card-body{max-height:9000px}\n<\/style>\n<\/head>\n<body>\n\n<div id=\"topnav\">\n  <button class=\"navbtn active\" data-page=\"indexing\">① Indexing<\/button>\n  <button class=\"navbtn\" data-page=\"spacegroup\">② Space Group<\/button>\n  <button class=\"navbtn\" data-page=\"methods\">③ Pawley/Le Bail/Rietveld<\/button>\n  <button class=\"navbtn\" data-page=\"instrument\">④ Instrument<\/button>\n  <button class=\"navbtn\" data-page=\"challenge\">⑤ Challenge<\/button>\n  <button class=\"navbtn\" data-page=\"mydata\">⑥ Your Data<\/button>\n  <button class=\"navbtn\" data-page=\"more\">⑦ More topics<\/button>\n<\/div>\n<button id=\"theme-toggle\">🌙<\/button>\n\n<!-- ═══════ PAGE 1: INDEXING ═══════ -->\n<div class=\"page active\" id=\"page-indexing\">\n<div class=\"sect-hdr\"><span class=\"eyebrow\">Step 1<\/span><h2>Indexing a Powder Pattern<\/h2><\/div>\n\n<div class=\"card collapsible\">\n  <div class=\"card-hdr\"><h3>What you will do here<\/h3><span class=\"chev\">▶<\/span><\/div>\n  <div class=\"card-body\">\n    <p style=\"color:var(--fg2);margin:0\">A simulated PXRD pattern is generated from a real crystal structure. <strong>Your job: click on peaks<\/strong> to pick them, then run the indexing algorithms and watch them search for a unit cell that explains all your d-spacings. You will see exactly how TREOR, DICVOL and least-squares work — and why they sometimes fail.<\/p>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h3>Pattern settings<\/h3>\n  <div class=\"ctrl-row\">\n    <label>Crystal system<\/label>\n    <select id=\"idx_system\">\n      <option value=\"cubic\">Cubic (NaCl-type, easy)<\/option>\n      <option value=\"tetragonal\">Tetragonal (medium)<\/option>\n      <option value=\"orthorhombic\">Orthorhombic (medium)<\/option>\n      <option value=\"monoclinic\" selected>Monoclinic (hard)<\/option>\n    <\/select>\n  <\/div>\n  <div class=\"ctrl-row\">\n    <label>Wavelength λ (Å)<\/label>\n    <input type=\"range\" id=\"idx_lam\" min=\"0.3\" max=\"2.0\" step=\"0.01\" value=\"1.5406\">\n    <span class=\"val\" id=\"idx_lam_lbl\">1.5406<\/span>\n  <\/div>\n  <div class=\"ctrl-row\">\n    <label>Add noise<\/label>\n    <input type=\"range\" id=\"idx_noise\" min=\"0\" max=\"5\" step=\"0.5\" value=\"1\">\n    <span class=\"val\" id=\"idx_noise_lbl\">1.0<\/span>\n  <\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:6px\">\n    <button class=\"btn btn-primary\" id=\"btn_gen_pattern\">Generate Pattern<\/button>\n    <button class=\"btn btn-secondary\" id=\"btn_clear_picks\">Clear picks<\/button>\n    <button class=\"btn btn-secondary\" id=\"btn_autopick\">Auto-pick all peaks<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h3>Simulated pattern — click peaks to pick them<\/h3>\n  <div class=\"canvas-wrap\" id=\"idx_canvas_wrap\"><canvas id=\"idx_canvas\" height=\"220\"><\/canvas><\/div>\n  <div id=\"idx_pick_status\" class=\"annot\" style=\"margin-top:8px\">Generate a pattern then click on peaks to pick them. Pick at least 10 peaks for reliable indexing.<\/div>\n<\/div>\n\n<div class=\"card\">\n  <h3>Picked d-spacings<\/h3>\n  <div id=\"idx_pick_table\" style=\"overflow-x:auto;min-height:40px\"><em style=\"color:var(--fg3);font-size:13px\">No peaks picked yet.<\/em><\/div>\n<\/div>\n\n<div class=\"card\">\n  <h3>Run indexing algorithms<\/h3>\n  <p style=\"font-size:13px;color:var(--fg2);margin:0 0 12px\">Each algorithm searches for unit cell parameters (a,b,c,α,β,γ) so that every measured d-spacing maps to an integer (h,k,l) triple. Tap an algorithm name to learn how it works, then press the button to run it.<\/p>\n\n  <!-- TREOR -->\n  <div class=\"algo-block\">\n    <div class=\"algo-hdr\" data-algo=\"treor\">\n      <div class=\"algo-title\"><span class=\"algo-badge\" style=\"background:var(--accent)\">TREOR<\/span> <span class=\"algo-sub\">Trial-and-Error · Werner 1964<\/span><\/div>\n      <span class=\"algo-chev\">▶<\/span>\n    <\/div>\n    <div class=\"algo-body\" id=\"algo-body-treor\">\n      <div class=\"math-block\">\n        Convert each peak to Q&nbsp;=&nbsp;1/d².<br>\n        For every pair (Q<sub>i<\/sub>, Q<sub>j<\/sub>), test integer ratios h²+k²+l² expected for each crystal system.<br>\n        Orthorhombic d-spacing formula:<br>\n        <span class=\"eq\">1/d² = h²/a² + k²/b² + l²/c²<\/span>\n        Score each trial cell by counting matched Q values within δQ = 0.0001 Å⁻².<br>\n        Keep cells with figure of merit M₂₀ &gt; 8:<br>\n        <span class=\"eq\">M₂₀ = Q₂₀ /
