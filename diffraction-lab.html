place('page-','');\n  if(cur)requestAnimationFrame(()=>setTimeout(()=>initPage(cur),80));\n}\n\n// ═══════════════════════════════════════════════════════\n// INIT\n// ═══════════════════════════════════════════════════════\ndocument.addEventListener('DOMContentLoaded',()=>{\n  // Nav\n  document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));\n  document.getElementById('theme-toggle').addEventListener('click',toggleTheme);\n\n  // Indexing\n  document.getElementById('btn_gen_pattern').addEventListener('click',generatePattern);\n  document.getElementById('btn_clear_picks').addEventListener('click',()=>{idxPickedPeaks=[];drawIdxPattern();updatePickTable();});\n  document.getElementById('btn_autopick').addEventListener('click',autoPick);\n  document.getElementById('btn_treor').addEventListener('click',runTREOR);\n  document.getElementById('btn_dicvol').addEventListener('click',runDICVOL);\n  document.getElementById('btn_lsq').addEventListener('click',runLSQ);\n  document.getElementById('idx_lam').addEventListener('input',()=>{document.getElementById('idx_lam_lbl').textContent=parseFloat(document.getElementById('idx_lam').value).toFixed(4);});\n  document.getElementById('idx_noise').addEventListener('input',()=>{document.getElementById('idx_noise_lbl').textContent=parseFloat(document.getElementById('idx_noise').value).toFixed(1);});\n  document.getElementById('idx_canvas').addEventListener('click',idxCanvasClick);\n\n  // Space group\n  document.getElementById('btn_sg_gen').addEventListener('click',generateSGReflections);\n  document.getElementById('btn_sg_check').addEventListener('click',checkSGAnswer);\n\n  // Methods\n  document.getElementById('btn_lb_run').addEventListener('click',startLeBail);\n  document.getElementById('btn_lb_reset').addEventListener('click',resetLeBail);\n  document.getElementById('sl_U').addEventListener('input',drawTCHZ);\n  document.getElementById('sl_V').addEventListener('input',drawTCHZ);\n  document.getElementById('sl_W').addEventListener('input',drawTCHZ);\n  document.getElementById('sl_X').addEventListener('input',drawTCHZ);\n  document.getElementById('m_natom').addEventListener('input',updateParamCount);\n  document.getElementById('m_nrefl').addEventListener('input',updateParamCount);\n\n  // Instrument\n  document.getElementById('tr_cap').addEventListener('input',drawInstrPattern);\n  document.getElementById('tr_axial').addEventListener('input',drawInstrPattern);\n  document.getElementById('bb_slit').addEventListener('input',drawInstrPattern);\n  document.getElementById('bb_po').addEventListener('input',drawInstrPattern);\n  document.getElementById('sl_zero').addEventListener('input',drawZeroError);\n\n  // Challenge\n  document.getElementById('btn_new_challenge').addEventListener('click',newChallenge);\n  document.getElementById('btn_show_answer').addEventListener('click',showChallengeAnswer);\n  document.getElementById('ch_btn_clear').addEventListener('click',()=>{chPickedPeaks=[];drawChallengePattern();});\n  document.getElementById('ch_btn_autopick').addEventListener('click',chAutoPick);\n  document.getElementById('ch_btn_index').addEventListener('click',chIndex);\n  document.getElementById('btn_ch_submit').addEventListener('click',submitChAnswer);\n  document.getElementById('ch_canvas').addEventListener('click',chCanvasClick);\n\n  // Your Data page — Step 1\n  document.getElementById('ud_btn_load').addEventListener('click',udLoadFile);\n  document.getElementById('ud_btn_demo').addEventListener('click',udLoadDemo);\n  document.getElementById('ud_lam_custom').addEventListener('input',e=>{udLambda=parseFloat(e.target.value)||1.5406;});\n  document.getElementById('ud_btn_go_index').addEventListener('click',()=>udGoStep(2));\n  // Step 2\n  document.getElementById('ud_btn_clear_picks').addEventListener('click',()=>{udPickedPeaks=[];udUpdatePeakTable();udDrawIndexPattern();});\n  document.getElementById('ud_btn_autopick').addEventListener('click',udAutoPick);\n  document.getElementById('ud_topn').addEventListener('change',()=>{udTopNValue=parseInt(document.getElementById('ud_topn').value)||0;udUpdatePeakTable();udDrawIndexPattern();});\n  ['ud_tth_min','ud_tth_max'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{udUpdatePeakTable();udDrawIndexPattern();}));\n  // Restore controls on each step-2 entry\n  document.getElementById('ud_topn').value=String(udTopNValue||20);\n  document.getElementById('ud_btn_treor').addEventListener('click',udRunTREOR);\n  document.getElementById('ud_btn_dicvol').addEventListener('click',udRunDICVOL);\n  document.getElementById('ud_btn_mcmaille').addEventListener('click',udRunMcMaille);\n  document.getElementById('ud_btn_lsq_refine').addEventListener('click',udRunLSQ);\n  document.getElementById('ud_btn_use_cell').addEventListener('click',()=>{\n    const sols=JSON.parse(document.getElementById('ud_index_result_body').dataset.solutions||'[]');\n    if(sols.length)udFillCellFromIndex(sols[0]);\n  });\n  document.getElementById('ud_btn_back1').addEventListener('click',()=>udGoStep(1));\n  document.getElementById('ud_idx_canvas').addEventListener('click',udIdxCanvasClick);\n  // Step 3\n  document.getElementById('ud_btn_fit').addEventListener('click',udRunFit);\n  document.getElementById('ud_btn_back2').addEventListener('click',()=>udGoStep(2));\n  document.getElementById('ud_btn_reset_fit').addEventListener('click',()=>{\n    udFitRunning=false;udFitResult=null;\n    document.getElementById('ud_result_card').style.display='none';\n    document.getElementById('ud_fit_cell').style.display='none';\n    document.getElementById('ud_btn_fit').textContent='▶ Run Le Bail fit';\n  });\n\n  // Wire algo-block headers\n  document.querySelectorAll('.algo-hdr').forEach(hdr=>{\n    const id=hdr.dataset.algo;\n    const body=document.getElementById('algo-body-'+id);\n    if(!body)return;\n    hdr.addEventListener('click',()=>{\n      hdr.classList.toggle('open');\n      body.classList.toggle('open');\n    });\n  });\n  // Wire collapsible cards\n  document.querySelectorAll('.card.collapsible').forEach(card=>{\n    const hdr=card.querySelector('.card-hdr');\n    if(!hdr)return;\n    hdr.addEventListener('click',()=>{card.classList.toggle('open');if(card.closest('#page-more')&&window.XB)setTimeout(XB.initAll,60)});\n  });\n  // Wire more-info toggles\n  document.querySelectorAll('.more-info-toggle').forEach(btn=>{\n    btn.addEventListener('click',()=>{\n      btn.classList.toggle('open');\n      const body=btn.nextElementSibling;\n      if(body&&body.classList.contains('more-info-body'))body.classList.toggle('open');\n    });\n  });\n\n  // Initial renders\n  initPage('indexing');\n  updateParamCount();\n\n  window.addEventListener('resize',()=>{\n    const cur=document.querySelector('.page.active')?.id?.replace('page-','');\n    if(cur)initPage(cur);\n  });\n});\n<\/script>\n<script>\n(function(){\nfunction getStyle(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}\nfunction fg(){return getStyle('--fg');}\nfunction fg2(){return getStyle('--fg2');}\nfunction fg3(){return getStyle('--fg3');}\nfunction accent(){return getStyle('--accent');}\nfunction accent2(){return getStyle('--accent2');}\nfunction accent3(){return getStyle('--accent3');}\nfunction bg(){return getStyle('--bg');}\nfunction bg2(){return getStyle('--bg2');}\nfunction bg3(){return getStyle('--bg3');}\nfunction border(){return getStyle('--border');}\n\nfunction setupCanvas(id){\n  const c=document.getElementById(id);\n  if(!c)return null;\n  const ctx=c.getContext('2d');\n  const dpr=window.devicePixelRatio||1;\n  const w=c.clientWidth||c.width;\n  const h=parseInt(c.getAttribute('height'));\n  c.width=w*dpr; c.height=h*dpr;\n  ctx.scale(dpr,dpr);\n  ctx.clearRect(0,0,w,h);\n  c.style.height=h+'px';\n  return {ctx,w,h};\n}\n\n// pseudo-Voigt\nfunction pVoigt(x,x0,fwhm,eta){\n  const g=fwhm/(2*Math.sqrt(2*Math.log(2)));\n  const G=Math.exp(-((x-x0)**2)/(2*g**2));\n  const L=1/(1+((x-x0)/(fwhm/2))**2);\n  return eta*L+(1-eta)*G;\n}\n\n// ── BRAGG CANVAS ─────────────────────────────────────────────────\nfunction drawBragg(){\n  const d=+document.getElementById('x_sl_d').value;\n  const lam=+document.getElementById('x_sl_lam').value;\n  document.getElementById('x_lbl_d').textContent=d.toFixed(2);\n  document.getElementById('x_lbl_lam').textContent=lam.toFixed(2);\n  const sinT=lam/(2*d);\n  const tth = sinT>=1 ? null : 2*Math.asin(sinT)*180/Math.PI;\n  document.getElementById('x_tth_out').textContent=tth?tth.toFixed(2)+'°':'—';\n  document.getElementById('x_d_out').textContent=d.toFixed(2)+' Å';\n\n  const r=setupCanvas('x_braggCanvas');if(!r)return;\n  const {ctx,w,h}=r;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n\n  // Draw crystal planes\n  const cx=w/2, cy=h/2+10;\n  const nd=5, spacing=Math.min(40,Math.max(14,d*12));\n  ctx.strokeStyle=accent();ctx.lineWidth=1.5;\n  for(let i=-nd;i<=nd;i++){\n    const y=cy+i*spacing;\n    ctx.beginPath();ctx.moveTo(cx-180,y);ctx.lineTo(cx+180,y);ctx.stroke();\n    if(i===0){ctx.fillStyle=accent2();ctx.font='11px JetBrains Mono';ctx.fillText('d = '+d.toFixed(2)+' Å',cx+100,y-5);}\n  }\n\n  if(tth){\n    const theta=tth/2*Math.PI/180;\n    // incident ray\n    ctx.strokeStyle=accent2();ctx.lineWidth=2;\n    const len=140;\n    ctx.beginPath();\n    ctx.moveTo(cx-len*Math.cos(theta), cy-len*Math.sin(theta));\n    ctx.lineTo(cx,cy);ctx.stroke();\n    // diffracted ray\n    ctx.beginPath();\n    ctx.moveTo(cx,cy);\n    ctx.lineTo(cx+len*Math.cos(theta), cy-len*Math.sin(theta));ctx.stroke();\n    // angle arc\n    ctx.strokeStyle=accent3();ctx.lineWidth=1;\n    ctx.beginPath();ctx.arc(cx,cy,45,Math.PI-theta,-theta,false);ctx.stroke();\n    ctx.fillStyle=accent3();ctx.font='12px Inter';\n    ctx.fillText('2θ='+tth.toFixed(1)+'°',cx-28,cy-50);\n  } else {\n    ctx.fillStyle='var(--danger)';ctx.font='13px Inter';\n    ctx.fillText('No diffraction (λ > 2d)',cx-70,cy-50);\n  }\n  ctx.fillStyle=fg2();ctx.font='12px Inter';\n  ctx.fillText('nλ = 2d·sinθ',cx-50,h-10);\n}\n\n// ── CUBIC TABLE ───────────────────────────────────────────────────\nfunction drawCubicTable(){\n  const a=+document.getElementById('x_sl_a_cub').value;\n  const lam=+document.getElementById('x_sl_lam2').value;\n  document.getElementById('x_lbl_a_cub').textContent=a.toFixed(2);\n  document.getElementById('x_lbl_lam2').textContent=lam.toFixed(2);\n  const rows=[];\n  const hkls=[[1,0,0],[1,1,0],[1,1,1],[2,0,0],[2,1,0],[2,1,1],[2,2,0],[3,0,0],[3,1,0],[2,2,2]];\n  for(const [h,k,l] of hkls){\n    const d=a/Math.sqrt(h*h+k*k+l*l);\n    const sinT=lam/(2*d);\n    if(sinT>=1)continue;\n    const tth=2*Math.asin(sinT)*180/Math.PI;\n    rows.push(`<tr><td>${h}${k}${l}<\/td><td>${(h*h+k*k+l*l)}<\/td><td>${d.toFixed(4)}<\/td><td>${tth.toFixed(3)}<\/td><\/tr>`);\n  }\n  document.getElementById('x_cubic_table').innerHTML=`<table class=\"tbl\"><thead><tr><th>hkl<\/th><th>h²+k²+l²<\/th><th>d (Å)<\/th><th>2θ (°)<\/th><\/tr><\/thead><tbody>${rows.join('')}<\/tbody><\/table>`;\n}\n\n// ── ABSENCES ─────────────────────────────────────────────────────\nfunction updateAbsences(){\n  const cent=document.getElementById('sel_cent').value;\n  const screw=document.getElementById('sel_screw').value;\n  const rules={\n    P:'No general systematic absences from centering.',\n    I:'hkl: h+k+l = odd → absent (body centering).',\n    F:'hkl: mixed odd/even h,k,l → absent (face centering). Only all-odd or all-even hkl observed.',\n    A:'hkl: k+l = odd → absent (A-centering).',\n    C:'hkl: h+k = odd → absent (C-centering).'\n  };\n  const screwRules={\n    none:'No screw axis / glide condition.',\n    '21b':'0k0: k = odd → absent (2₁ screw axis along b).',\n    '21a':'h00: h = odd → absent (2₁ screw axis along a).',\n    '41':'00l: l ≠ 4n → absent (4₁ screw along c).',\n    'n_glide':'h0l: h+l = odd → absent (n-glide perpendicular to a).',\n    'c_glide':'0kl: l = odd → absent (c-glide perpendicular to b).'\n  };\n  document.getElementById('absence_output').innerHTML=`\n    <div class=\"annot\"><strong>Centering (all hkl):<\/strong> ${rules[cent]}<\/div>\n    <div class=\"annot amber\" style=\"margin-top:8px\"><strong>Screw/glide (zone reflections):<\/strong> ${screwRules[screw]}<\/div>\n    <div class=\"annot green\" style=\"margin-top:8px\"><strong>→ Space group candidates:<\/strong> ${getSGCandidates(cent,screw)}<\/div>`;\n}\nfunction getSGCandidates(cent,screw){\n  if(cent==='C'&&screw==='21b') return 'C2/c (No.15), Cc (No.9), C2 (No.5) — monoclinic C-centred with 2₁';\n  if(cent==='P'&&screw==='21b') return 'P2₁/c (No.14), P2₁/n (No.14 alt), P2₁ (No.4), Pc (No.7)';\n  if(cent==='P'&&screw==='n_glide') return 'P2₁/n (No.14), Pn (No.7)';\n  if(cent==='I') return 'Im-3m (No.229), I4/mmm (No.139) — depends on crystal system';\n  if(cent==='F') return 'Fm-3m (No.225), F-43m (No.216) — face-centred cubic (e.g. NaCl, diamond)';\n  return 'See International Tables Vol. A, extinction symbols table.';\n}\n\n// ── PARAM COUNT ───────────────────────────────────────────────────\nfunction updateParamCount(){\n  const n=+document.getElementById('x_sl_natom').value;\n  const nr=+document.getElementById('x_sl_nrefl').value;\n  document.getElementById('x_lbl_natom').textContent=n;\n  document.getElementById('x_lbl_nrefl').textContent=nr;\n  // instrument: ~12 (cell 6, profile 4, bkg 6, zero 1, axial 1, scale 1)\n  const inst=12+6; // generous\n  const struct_xyz=3*n, struct_beq=n, struct_occ=Math.round(n*0.1);\n  const pawley=inst+nr;\n  const lebail=inst; // intensities not counted as params\n  const rietveld=inst+struct_xyz+struct_beq+struct_occ;\n  const datapts=Math.round(nr*15); // ~15 points per reflection on average\n  const html=`<table class=\"tbl\"><thead><tr><th>Method<\/th><th>Instrument params<\/th><th>Structural params<\/th><th>Intensity params<\/th><th>Total<\/th><th>Data points<\/th><th>Ratio<\/th><\/tr><\/thead><tbody>\n    <tr><td>Le Bail<\/td><td>${inst}<\/td><td>0<\/td><td>0 (extracted, not refined)<\/td><td>${lebail}<\/td><td>${datapts}<\/td><td>${(datapts/lebail).toFixed(0)}:1<\/td><\/tr>\n    <tr><td>Pawley<\/td><td>${inst}<\/td><td>0<\/td><td>${nr} (one per refl.)<\/td><td>${pawley}<\/td><td>${datapts}<\/td><td>${(datapts/pawley).toFixed(1)}:1<\/td><\/tr>\n    <tr><td>Rietveld<\/td><td>${inst}<\/td><td>${struct_xyz+struct_beq+struct_occ} (xyz+Beq+occ)<\/td><td>0 (from model)<\/td><td>${rietveld}<\/td><td>${datapts}<\/td><td>${(datapts/rietveld).toFixed(1)}:1<\/td><\/tr>\n  <\/tbody><\/table>`;\n  document.getElementById('x_param_count_table').innerHTML=html;\n  const ratio=datapts/rietveld;\n  document.getElementById('x_param_advice').innerHTML=ratio<3?\n    '<strong>Warning:<\/strong> Data:parameter ratio <3 — Rietveld is likely underdetermined! Increase 2θ range or apply constraints/restraints.':\n    ratio>5?'<strong>Good:<\/strong> Data:parameter ratio '+ratio.toFixed(1)+' — Rietveld refinement is well-determined.':\n    '<strong>Marginal:<\/strong> Data:parameter ratio '+ratio.toFixed(1)+' — use restraints to stabilise refinement.';\n}\n\n// ── METHOD CANVAS ────────────────────────────────────────────────\nlet methodMode='lebail';\nlet animT=0, animRunning=false;\nconst reflections=[{tth:12.3,d:3.8,I:1200},{tth:17.5,d:2.7,I:800},{tth:21.2,d:2.25,I:1500},{tth:24.8,d:1.95,I:600},{tth:28.1,d:1.73,I:1100},{tth:31.4,d:1.56,I:450},{tth:34.2,d:1.44,I:900}];\n\nfunction setMethod(m){\n  methodMode=m;\n  drawMethod(1.0);\n  document.getElementById('x_method_desc').innerHTML={\n    lebail:'<strong>Le Bail:<\/strong> Peaks are placed at the correct 2θ positions from the cell. Intensities are extracted iteratively — shared proportionally when peaks overlap. No atom positions needed. Rwp tells you how well the instrument model fits.',\n    pawley:'<strong>Pawley:<\/strong> Same positions as Le Bail, but each reflection\\'s intensity is an independent refined parameter. The fit is usually better than Le Bail because intensities are free. Can give negative intensities for weak/absent reflections.',\n    rietveld:'<strong>Rietveld:<\/strong> Intensities are calculated from the structure factor F(hkl), which depends on atomic positions, types, and displacement parameters. The model must be physically reasonable — this is the final refinement step.'\n  }[m];\n}\n\nfunction drawMethod(progress){\n  const r=setupCanvas('x_methodCanvas');if(!r)return;\n  const {ctx,w,h}=r;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n  const pad={l:50,r:20,t:20,b:30};\n  const pw=w-pad.l-pad.r, ph=h-pad.t-pad.b;\n  // axes\n  ctx.strokeStyle=border();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n  ctx.fillStyle=fg2();ctx.font='11px Inter';\n  ctx.fillText('2θ (°)',pad.l+pw/2,h-4);\n  ctx.save();ctx.translate(14,pad.t+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText('Intensity',0,0);ctx.restore();\n\n  const x2p=tth=>(tth-8)/(40)*pw+pad.l;\n  const y2p=I=>pad.t+ph - I/1800*ph*0.85;\n\n  // background\n  ctx.strokeStyle=fg3();ctx.lineWidth=1;ctx.setLineDash([4,3]);\n  ctx.beginPath();\n  for(let i=0;i<=pw;i++){const x=i/pw*32+8; const bg_=80+30*Math.sin(x*0.3); ctx.i===0?ctx.moveTo(pad.l+i,y2p(bg_)):ctx.lineTo(pad.l+i,y2p(bg_));}\n  ctx.stroke();ctx.setLineDash([]);\n\n  // Yobs (dots)\n  ctx.fillStyle=fg2();\n  for(let i=0;i<=pw;i+=3){\n    const x2t=i/pw*32+8;\n    let yc=80+30*Math.sin(x2t*0.3);\n    for(const r2 of reflections) yc+=r2.I*pVoigt(x2t,r2.tth,0.35,0.5)*Math.pow(progress,2);\n    yc+=5*(Math.random()-0.5);\n    ctx.fillRect(pad.l+i,y2p(yc),1.5,1.5);\n  }\n\n  // Ycalc\n  const colors={lebail:accent2(),pawley:accent(),rietveld:accent3()};\n  ctx.strokeStyle=colors[methodMode];ctx.lineWidth=2;\n  ctx.beginPath();\n  for(let i=0;i<=pw;i++){\n    const x2t=i/pw*32+8;\n    let yc=80+30*Math.sin(x2t*0.3);\n    for(const r2 of reflections){\n      const sc=methodMode==='rietveld'?progress:1;\n      yc+=r2.I*pVoigt(x2t,r2.tth,0.35,0.5)*sc;\n    }\n    i===0?ctx.moveTo(pad.l+i,y2p(yc)):ctx.lineTo(pad.l+i,y2p(yc));\n  }\n  ctx.stroke();\n\n  // tick marks\n  ctx.strokeStyle=accent();ctx.lineWidth=1;\n  for(const r2 of reflections){ctx.beginPath();ctx.moveTo(x2p(r2.tth),pad.t+ph+2);ctx.lineTo(x2p(r2.tth),pad.t+ph+10);ctx.stroke();}\n\n  // legend\n  const lx=w-180,ly=pad.t+15;\n  [[fg2(),'Yobs (data)'],[colors[methodMode],'Ycalc ('+methodMode+')']].forEach(([col,lbl],i)=>{\n    ctx.fillStyle=col;ctx.fillRect(lx,ly+i*20,18,3);\n    ctx.fillStyle=fg();ctx.font='12px Inter';ctx.fillText(lbl,lx+22,ly+i*20+5);\n  });\n}\n\nfunction animateMethod(){\n  if(animRunning)return;\n  animRunning=true;animT=0;\n  function step(){\n    animT+=0.025;drawMethod(Math.min(animT,1));\n    if(animT<1)requestAnimationFrame(step);else animRunning=false;\n  }\n  requestAnimationFrame(step);\n}\n\n// ── PARAM GRID ───────────────────────────────────────────────────\nconst paramData=[\n  {id:'cell',label:'Unit cell',badge:'blue',when:'Always first',detail:'a, b, c, α, β, γ. Must be refined from the start. Even a small error (0.001 Å) shifts ALL peaks. In TOPAS: a @, b @, etc. For SA: fix the cell (use ! prefix) if you trust the Le Bail result.'},\n  {id:'scale',label:'Scale factor',badge:'green',when:'Always',detail:'Overall multiplier between Yobs and Ycalc. Must always be refined. If wrong, all intensities are off by a constant factor. TOPAS: scale @'},\n  {id:'bkg',label:'Background',badge:'blue',when:'Always',detail:'Chebyshev polynomial (usually 6 terms). The background contributes strongly to Rwp. Too few terms → poor fit at low angle. Too many → absorbs real peak intensity.'},\n  {id:'profile',label:'Peak shape',badge:'amber',when:'Early (after cell)',detail:'TCHZ pku, pkv, pkw, pkx. Refine after the cell is stable. These control FWHM vs 2θ. If wrong, Rwp will be large even if the structure is correct.'},\n  {id:'zero',label:'Zero error',badge:'amber',when:'Early',detail:'2θ zero offset. Even 0.01° causes systematic d-spacing errors. Calibrate with a standard. TOPAS: Zero_Error(zero, 0.004`)'},\n  {id:'axial',label:'Axial divergence',badge:'amber',when:'Early',detail:'Low-angle peak asymmetry. Affects peaks below ~30° 2θ. Important for synchrotron capillary data. TOPAS: Simple_Axial_Model(axial, 0.5`)'},\n  {id:'xyz',label:'Atomic xyz',badge:'red',when:'Rietveld only',detail:'Fractional coordinates of each atom. The core of Rietveld refinement. Release after cell, scale, background, and profile are stable. Release a few atoms at a time, not all at once.'},\n  {id:'beq',label:'Beq (ADP)',badge:'red',when:'Late',detail:'Isotropic atomic displacement parameter. Release only after xyz is stable. If Beq goes negative, the atomic position is wrong. If Beq is very large (>10 Å²), the atom may be in a wrong position or wrong type.'},\n  {id:'occ',label:'Occupancy',badge:'red',when:'Last',detail:'Site occupancy. Only refine if there is chemical reason (disorder, mixed sites). Correlated with Beq — refining both simultaneously is dangerous. Fix one, refine the other.'},\n];\nfunction initParamGrid(){\n  const div=document.getElementById('x_param_grid');\n  div.innerHTML=paramData.map(p=>`<div class=\"compare-card\" style=\"cursor:pointer;border:2px solid transparent\" id=\"x_pg_${p.id}\" onclick=\"XB.selectParam('${p.id}')\">\n    <h4>${p.label}<\/h4><span class=\"badge badge-${p.badge}\">${p.when}<\/span>\n  <\/div>`).join('');\n  selectParam('cell');\n}\nfunction selectParam(id){\n  document.querySelectorAll('[id^=\"x_pg_\"]').forEach(e=>e.style.borderColor='transparent');\n  document.getElementById('x_pg_'+id).style.borderColor='var(--accent)';\n  const p=paramData.find(x=>x.id===id);\n  document.getElementById('x_param_detail').innerHTML=`<strong>${p.label}:<\/strong> ${p.detail}`;\n}\n\n// ── TCHZ CANVAS ───────────────────────────────────────────────────\nfunction drawTCHZ(){\n  const U=+document.getElementById('x_sl_U').value;\n  const V=+document.getElementById('x_sl_V').value;\n  const W=+document.getElementById('x_sl_W').value;\n  const X=+document.getElementById('x_sl_X').value;\n  document.getElementById('x_lbl_U').textContent=U.toFixed(2);\n  document.getElementById('x_lbl_V').textContent=V.toFixed(2);\n  document.getElementById('x_lbl_W').textContent=W.toFixed(3);\n  document.getElementById('x_lbl_X').textContent=X.toFixed(2);\n  const r=setupCanvas('x_tchzCanvas');if(!r)return;\n  const {ctx,w,h}=r;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n  const angles=[15,30,50,70];\n  const pad={l:50,r:20,t:20,b:30};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.strokeStyle=border();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n\n  const cols=[accent(),accent2(),accent3(),'#a855f7'];\n  angles.forEach((tth,ai)=>{\n    const th=tth/2*Math.PI/180;\n    const tanT=Math.tan(th), cosT=Math.cos(th);\n    const fwhmG2=U*tanT*tanT+V*tanT+W;\n    const fwhmG=fwhmG2>0?Math.sqrt(fwhmG2):0.001;\n    const fwhmL=X/cosT;\n    const fwhm=0.5*(fwhmG+fwhmL)+0.5*Math.sqrt(fwhmG*fwhmL+0.5*(fwhmG-fwhmL)**2);\n    const eta=fwhmL/fwhm;\n    // draw peak centered in its quarter\n    const cx=pad.l+(ai+0.5)*pw/4;\n    const range=fwhm*8;\n    ctx.strokeStyle=cols[ai];ctx.lineWidth=2;\n    ctx.beginPath();\n    for(let i=0;i<100;i++){\n      const dx=(i/100-0.5)*range;\n      const x=cx+dx/range*(pw/4*0.8);\n      const y=pad.t+ph-pVoigt(dx,0,fwhm,eta)*ph*0.85;\n      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n    }\n    ctx.stroke();\n    ctx.fillStyle=cols[ai];ctx.font='11px Inter';\n    ctx.fillText(`2θ=${tth}°`,cx-20,pad.t+ph-6);\n    ctx.fillText(`FWHM=${fwhm.toFixed(3)}°`,cx-24,pad.t+16+ai*4);\n  });\n  ctx.fillStyle=fg2();ctx.font='11px Inter';ctx.fillText('Peak shape at different 2θ angles',pad.l+10,pad.t+14);\n}\n\n// ── R-FACTORS ─────────────────────────────────────────────────────\nconst stages=[\n  {name:'Initial (no model)',rp:62,rwp:68,rexp:5.2,chi2:171,rb:null,desc:'No structural model. Ycalc = background only. Rwp is very high because all Bragg peaks are unaccounted for.'},\n  {name:'Scale only',rp:48,rwp:52,rexp:5.2,chi2:100,rb:null,desc:'Scale factor released. Ycalc now has the right overall intensity level but all peaks are still misplaced.'},\n  {name:'Cell + profile',rp:28,rwp:31,rexp:5.2,chi2:35.5,rb:null,desc:'Cell and peak shape parameters refined (Le Bail / Pawley stage). Peaks are now at the right positions with the right widths. This is the baseline Rwp.'},\n  {name:'Add structure (SA result)',rp:22,rwp:25,rexp:5.2,chi2:23.1,rb:38,desc:'Structural model introduced from SA. Intensities are now calculated from atomic positions. Big drop in Rwp.'},\n  {name:'Release xyz',rp:14,rwp:16,rexp:5.2,chi2:9.5,rb:12,desc:'Atomic coordinates refined. This is usually the biggest improvement in Rietveld. Bond lengths and angles become reliable.'},\n  {name:'Release Beq',rp:11,rwp:13,rexp:5.2,chi2:6.3,rb:8,desc:'Displacement parameters released. Rwp improves further. Watch for physically unreasonable values (Beq<0 or Beq>15).'},\n  {name:'Full refinement',rp:8.5,rwp:10.2,rexp:5.2,chi2:3.8,rb:5.5,desc:'All parameters released simultaneously (with constraints). Final Rwp. χ² near 2 is good for real data with minor model deficiencies.'},\n];\nfunction updateRfactors(){\n  const s=+document.getElementById('x_sl_stage').value;\n  document.getElementById('x_lbl_stage').textContent=stages[s].name;\n  const st=stages[s];\n  document.getElementById('x_rfactor_bars').innerHTML=[\n    ['Rp',st.rp,8,'blue'],['Rwp',st.rwp,10,'blue'],['Rexp',st.rexp,null,'green'],\n    ['χ²',st.chi2,null,'amber'],['RBragg',st.rb,5,'red']\n  ].map(([name,val,good,col])=>val==null?`<div>\n    <div style=\"font-size:12px;font-weight:600;color:var(--fg2)\">${name}<\/div>\n    <div style=\"font-size:11px;color:var(--fg3)\">N/A at this stage<\/div><\/div>`:`<div>\n    <div style=\"display:flex;justify-content:space-between;font-size:12px;font-weight:600\"><span style=\"color:var(--fg2)\">${name}<\/span><span style=\"color:var(--accent);font-family:monospace\">${val.toFixed(1)}%<\/span><\/div>\n    <div class=\"rp-bar-wrap\"><div class=\"rp-bar ${col==='amber'?'amber':col==='green'?'green':''}\" style=\"width:${Math.min(100,val/80*100)}%\"><\/div><\/div>\n    ${good?`<div style=\"font-size:10px;color:var(--fg3)\">Target: &lt;${good}%<\/div>`:''}\n  <\/div>`).join('');\n  document.getElementById('x_stage_desc').innerHTML='<strong>'+st.name+':<\/strong> '+st.desc;\n  drawRwpHistory();\n}\nfunction drawRwpHistory(){\n  const s=+document.getElementById('x_sl_stage').value;\n  const r=setupCanvas('x_rwpCanvas');if(!r)return;\n  const {ctx,w,h}=r;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n  const pad={l:50,r:20,t:15,b:30};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.strokeStyle=border();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n  // y axis\n  for(let v=0;v<=70;v+=10){const y=pad.t+ph-v/70*ph;ctx.strokeStyle=border();ctx.setLineDash([2,2]);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+pw,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=fg3();ctx.font='10px Inter';ctx.fillText(v+'%',pad.l-28,y+4);}\n  // line\n  ctx.strokeStyle=accent();ctx.lineWidth=2.5;ctx.beginPath();\n  stages.forEach((st,i)=>{\n    const x=pad.l+i/(stages.length-1)*pw;\n    const y=pad.t+ph-st.rwp/70*ph;\n    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n  });\n  ctx.stroke();\n  // current point\n  stages.forEach((st,i)=>{\n    const x=pad.l+i/(stages.length-1)*pw;\n    const y=pad.t+ph-st.rwp/70*ph;\n    ctx.beginPath();ctx.arc(x,y,i===s?6:4,0,2*Math.PI);\n    ctx.fillStyle=i===s?accent2():accent();ctx.fill();\n  });\n  ctx.fillStyle=fg2();ctx.font='10px Inter';\n  stages.forEach((st,i)=>{const x=pad.l+i/(stages.length-1)*pw;ctx.fillText(i+1,x-4,pad.t+ph+15);});\n  ctx.fillText('Refinement stage',pad.l+pw/2-40,h-2);\n}\n\n// ── SCATTERING ────────────────────────────────────────────────────\nconst atomData={\n  H:{Z:1,a:[0.489918,0.262003,0.196767,0.049879],b:[20.6593,7.74039,49.5519,2.20159],c:0.001305},\n  C:{Z:6,a:[2.26069,1.56165,1.05075,0.839259],b:[22.6907,0.656665,9.75618,55.5949],c:0.286977},\n  N:{Z:7,a:[12.2126,3.13220,2.01250,1.16630],b:[0.005700,9.89330,28.9975,0.582600],c:-11.529},\n  O:{Z:8,a:[3.04850,2.28680,1.54630,0.86700],b:[13.2771,5.70110,0.323900,32.9089],c:0.250800},\n  Na:{Z:11,a:[4.76260,3.17360,1.26740,1.11280],b:[3.28500,8.84220,0.313600,129.424],c:0.676000},\n  Fe:{Z:26,a:[11.1764,7.38630,3.39480,2.34900],b:[4.61470,0.300500,11.6729,38.5566],c:0.307200},\n  Co:{Z:27,a:[12.2841,7.34090,4.00340,2.34880],b:[4.27910,0.278400,13.5359,71.1692],c:0.340400},\n  Mn:{Z:25,a:[11.2819,7.35730,3.01930,2.24410],b:[5.34090,0.343200,10.1411,42.7461],c:0.358400},\n  Ni:{Z:28,a:[12.8376,7.29200,4.44380,2.38000],b:[3.87850,0.256500,12.1763,66.3421],c:0.316900},\n  Cu:{Z:29,a:[13.3380,7.16760,5.61580,1.67350],b:[3.58280,0.247000,11.3966,64.8126],c:1.19100},\n  Zn:{Z:30,a:[14.0743,7.03180,5.16520,2.41000],b:[3.26550,0.233300,10.3163,58.7097],c:1.30410},\n  Mo:{Z:42,a:[3.70250,17.2356,12.8876,3.74290],b:[0.277200,1.09580,11.0040,61.6584],c:4.38750}\n};\nfunction atomF(elem,st){\n  const a=atomData[elem];if(!a)return 0;\n  return a.a.reduce((s,ai,i)=>s+ai*Math.exp(-a.b[i]*st*st),0)+a.c;\n}\nfunction drawScattering(){\n  const e1=document.getElementById('x_sel_atom1').value;\n  const e2=document.getElementById('x_sel_atom2').value;\n  const r=setupCanvas('x_scatterCanvas');if(!r)return;\n  const {ctx,w,h}=r;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n  const pad={l:50,r:20,t:20,b:30};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.strokeStyle=border();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n  const maxZ=Math.max(atomData[e1].Z,atomData[e2].Z);\n  [[e1,accent()],[e2,accent2()]].forEach(([el,col])=>{\n    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();\n    for(let i=0;i<=100;i++){\n      const st=i/100*0.7;\n      const f=atomF(el,st);\n      const x=pad.l+i/100*pw;\n      const y=pad.t+ph-f/maxZ*ph*0.9;\n      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n    }\n    ctx.stroke();\n    ctx.fillStyle=col;ctx.font='13px Inter';\n    ctx.fillText(el+' (Z='+atomData[el].Z+')',pad.l+10+(el===e2?120:0),pad.t+16);\n  });\n  for(let v=0;v<=maxZ;v+=5){const y=pad.t+ph-v/maxZ*ph*0.9;ctx.fillStyle=fg3();ctx.font='10px Inter';ctx.fillText(v,pad.l-20,y+4);}\n  ctx.fillStyle=fg2();ctx.font='11px Inter';\n  ctx.fillText('sinθ/λ →',pad.l+pw-60,pad.t+ph+15);\n  ctx.fillText('f (electrons)',4,pad.t+ph/2);\n  const diff=Math.abs(atomData[e1].Z-atomData[e2].Z);\n  document.getElementById('x_scatter_note').innerHTML=diff<3?\n    '<strong>Warning:<\/strong> '+e1+' and '+e2+' have very similar scattering factors (ΔZ='+diff+'). They will be almost indistinguishable in X-ray powder diffraction. Consider anomalous diffraction or neutron data.':\n    '<strong>OK:<\/strong> '+e1+' (Z='+atomData[e1].Z+') and '+e2+' (Z='+atomData[e2].Z+') differ by '+diff+' electrons — distinguishable in X-ray diffraction.';\n}\n\nfunction updateWrongAtom(){\n  const tr=document.getElementById('x_sel_true').value;\n  const mo=document.getElementById('x_sel_model').value;\n  const Ztrue=atomData[tr].Z, Zmodel=atomData[mo].Z;\n  const frac=Math.abs(Ztrue-Zmodel)/Ztrue;\n  const dRwp=(frac*35).toFixed(1);\n  document.getElementById('x_wrong_atom_result').innerHTML=\n    tr===mo?'<strong>✓ Correct atom:<\/strong> Model matches reality. No systematic error introduced.':\n    '<strong>⚠ Wrong atom:<\/strong> True atom '+tr+' (Z='+Ztrue+'), model has '+mo+' (Z='+Zmodel+').<br>Scattering factor mismatch: '+(frac*100).toFixed(0)+'%. Expect Rwp increase of ~'+dRwp+'% and inflated/deflated Beq on this site. Neighbouring atoms may also shift to compensate.';\n}\n\n// ── INSTRUMENT PEAK ───────────────────────────────────────────────\nfunction drawInstrPeak(){\n  const axial=+document.getElementById('x_sl_axial').value;\n  const slit=+document.getElementById('x_sl_slit').value;\n  const zero=+document.getElementById('x_sl_zero').value;\n  document.getElementById('x_lbl_axial').textContent=axial.toFixed(1);\n  document.getElementById('x_lbl_slit').textContent=slit.toFixed(2);\n  document.getElementById('x_lbl_zero').textContent=zero.toFixed(3);\n  const r=setupCanvas('x_instrCanvas');if(!r)return;\n  const {ctx,w,h}=r;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n  const pad={l:50,r:20,t:20,b:30};\n  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.strokeStyle=border();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ph);ctx.lineTo(pad.l+pw,pad.t+ph);ctx.stroke();\n\n  const tth0=12.0, range=4; // show a low-angle peak\n  // \"ideal\" peak\n  ctx.strokeStyle=fg3();ctx.lineWidth=1;ctx.setLineDash([3,3]);\n  ctx.beginPath();\n  for(let i=0;i<=200;i++){\n    const x2t=tth0-range/2+i/200*range;\n    const y=pVoigt(x2t,tth0+zero,0.1+slit,0.3);\n    const px=pad.l+i/200*pw;\n    const py=pad.t+ph-y*ph*0.85;\n    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);\n  }\n  ctx.stroke();ctx.setLineDash([]);\n\n  // asymmetric peak with axial divergence\n  ctx.strokeStyle=accent();ctx.lineWidth=2.5;\n  ctx.beginPath();\n  for(let i=0;i<=200;i++){\n    const x2t=tth0-range/2+i/200*range;\n    const dx=x2t-(tth0+zero);\n    // simple axial divergence: sharper on high side, tail on low side\n    const asym=axial>0?Math.exp(-Math.max(0,-dx)*axial*2):0;\n    const fwhm=0.1+slit+axial*0.08;\n    const y=pVoigt(x2t,tth0+zero,fwhm,0.5+axial*0.1)*(1-asym*0.3);\n    const px=pad.l+i/200*pw;\n    const py=pad.t+ph-y*ph*0.85;\n    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);\n  }\n  ctx.stroke();\n\n  // zero error marker\n  if(Math.abs(zero)>0.001){\n    const marker=pad.l+(tth0+zero-tth0+range/2)/range*pw;\n    ctx.strokeStyle=accent2();ctx.lineWidth=1.5;ctx.setLineDash([2,2]);\n    ctx.beginPath();ctx.moveTo(marker,pad.t);ctx.lineTo(marker,pad.t+ph);ctx.stroke();ctx.setLineDash([]);\n    ctx.fillStyle=accent2();ctx.font='11px Inter';ctx.fillText('zero='+zero.toFixed(3)+'°',marker+4,pad.t+20);\n  }\n\n  ctx.fillStyle=fg2();ctx.font='11px Inter';\n  ctx.fillText('Low-angle peak (2θ≈12°)',pad.l+10,pad.t+16);\n  ctx.setLineDash([3,3]);ctx.strokeStyle=fg3();ctx.lineWidth=1;\n  ctx.beginPath();ctx.moveTo(pad.l+5,pad.t+28);ctx.lineTo(pad.l+25,pad.t+28);ctx.stroke();ctx.setLineDash([]);\n  ctx.fillText('Ideal (no axial)',pad.l+28,pad.t+32);\n  ctx.strokeStyle=accent();ctx.lineWidth=2;\n  ctx.beginPath();ctx.moveTo(pad.l+5,pad.t+44);ctx.lineTo(pad.l+25,pad.t+44);ctx.stroke();\n  ctx.fillStyle=fg2();ctx.fillText('With instrument corrections',pad.l+28,pad.t+48);\n\n  document.getElementById('x_instr_note').innerHTML=\n    axial>1?'<strong>High axial divergence:<\/strong> Strong low-angle asymmetry (peak tail on low-2θ side). Important to model with Simple_Axial_Model in TOPAS.':\n    axial>0.3?'<strong>Moderate axial divergence:<\/strong> Visible asymmetry. Standard for lab diffractometers without Soller slits.':\n    '<strong>Low axial divergence:<\/strong> Well-collimated beam (synchrotron with Soller slits). Peak is nearly symmetric.';\n}\n\n// ── DECISION TREE ─────────────────────────────────────────────────\nfunction drawTree(){\n  const r=setupCanvas('x_treeCanvas');if(!r)return;\n  const {ctx,w,h}=r;\n  ctx.fillStyle=bg3();ctx.fillRect(0,0,w,h);\n  const nodes=[\n    {x:.5,y:.04,text:'Raw PXRD data',col:accent(),w:160},\n    {x:.5,y:.18,text:'Check data quality\\n(resolution, bkg, impurities)',col:accent2(),w:200},\n    {x:.5,y:.33,text:'Indexing\\n(DICVOL, TREOR, TOPAS)',col:accent(),w:180},\n    {x:.18,y:.5,text:'Failed →\\nCheck sample purity,\\ntry different indexer',col:'var(--danger)',w:160},\n    {x:.5,y:.5,text:'Space-group candidates\\nfrom absences and intensity evidence',col:accent(),w:180},\n    {x:.5,y:.65,text:'Le Bail / Pawley fit\\n(test cell and profile)',col:accent2(),w:180},\n    {x:.5,y:.8,text:'SA structure solution\\nor direct methods',col:accent(),w:180},\n    {x:.5,y:.93,text:'Rietveld refinement\\n→ validate with PLATON',col:accent3(),w:200},\n  ];\n  const arrows=[[0,1],[1,2],[2,4],[2,3],[4,5],[5,6],[6,7]];\n  ctx.strokeStyle=fg3();ctx.lineWidth=1.5;\n  arrows.forEach(([a,b])=>{\n    if(b===3){\n      ctx.strokeStyle=accent2();ctx.setLineDash([4,3]);\n    } else {ctx.strokeStyle=border();ctx.setLineDash([]);}\n    const n1=nodes[a],n2=nodes[b];\n    ctx.beginPath();ctx.moveTo(n1.x*w,n1.y*h+14);ctx.lineTo(n2.x*w,n2.y*h-14);ctx.stroke();\n  });\n  ctx.setLineDash([]);\n  nodes.forEach(n=>{\n    const x=n.x*w,y=n.y*h;\n    const lines=n.text.split('\\n');\n    const bw=Math.max(n.w,lines.reduce((m,l)=>Math.max(m,l.length*6.5),0));\n    const bh=lines.length*18+14;\n    ctx.fillStyle=bg2();ctx.strokeStyle=n.col;ctx.lineWidth=2;\n    ctx.beginPath();ctx.roundRect(x-bw/2,y-bh/2,bw,bh,7);ctx.fill();ctx.stroke();\n    ctx.fillStyle=fg();ctx.font='12px Inter';ctx.textAlign='center';\n    lines.forEach((l,i)=>ctx.fillText(l,x,y+(i-(lines.length-1)/2)*18+5));\n  });\n  ctx.textAlign='left';\n}\n\n// ── CHECKLIST ─────────────────────────────────────────────────────\nfunction buildChecklist(){\n  const items=[\n    {text:'Sample is a single crystalline phase (check for impurity peaks)',cat:'Sample'},\n    {text:'Correct wavelength entered (synchrotron: check beamline logbook)',cat:'Instrument'},\n    {text:'Zero error calibrated with a standard sample',cat:'Instrument'},\n    {text:'Correct geometry (transmission / reflection) selected in software',cat:'Instrument'},\n    {text:'Background model fits the data (Chebyshev terms adjusted)',cat:'Fitting'},\n    {text:'Indexing gives M₂₀ > 10 (preferably > 20)',cat:'Indexing'},\n    {text:'Systematic absences checked; space group candidates listed',cat:'Space group'},\n    {text:'Le Bail/Pawley residuals and difference curve assessed in the context of counting statistics, background and profile quality',cat:'Le Bail'},\n    {text:'Peak shape parameters are physically reasonable (no negative W)',cat:'Profile'},\n    {text:'Candidate solutions checked for chemical plausibility and reproducibility; Rwp alone does not validate a structure',cat:'SA'},\n    {text:'C–C, C–N, Ni–O bond lengths within expected ranges in CIF',cat:'Rietveld'},\n    {text:'Displacement parameters checked for physical plausibility at the measurement temperature and for parameter correlations',cat:'Rietveld'},\n    {text:'χ², RBragg and profile residuals interpreted alongside uncertainties, systematic errors and model plausibility',cat:'Rietveld'},\n    {text:'PLATON ADDSYM run on final CIF — no missed symmetry',cat:'Validation'},\n  ];\n  const cats={};\n  items.forEach(it=>{ if(!cats[it.cat]) cats[it.cat]=[]; cats[it.cat].push(it); });\n  const catCols={Sample:'blue',Instrument:'amber',Fitting:'blue',Indexing:'green',\n    'Space group':'green',  'Le Bail':'blue',Profile:'amber',SA:'amber',\n    Rietveld:'green',Validation:'green'};\n  document.getElementById('x_checklist').innerHTML=Object.entries(cats).map(([cat,items])=>`\n    <div style=\"margin-bottom:14px\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin-bottom:6px\">${cat}<\/div>\n      ${items.map((it,i)=>`<label style=\"display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;color:var(--fg2)\">\n        <input type=\"checkbox\" style=\"margin-top:3px;accent-color:var(--accent)\" onchange=\"this.parentElement.style.opacity=this.checked?.5:1\">\n        <span>${it.text}<\/span>\n      <\/label>`).join('')}\n    <\/div>`).join('');\n}\n\n\nwindow.XB={accent,accent2,accent3,animateMethod,atomF,bg,bg2,bg3,border,buildChecklist,drawBragg,drawCubicTable,drawInstrPeak,drawMethod,drawRwpHistory,drawScattering,drawTCHZ,drawTree,fg,fg2,fg3,getSGCandidates,getStyle,initParamGrid,pVoigt,selectParam,setMethod,setupCanvas,updateAbsences,updateParamCount,updateRfactors,updateWrongAtom,\ninitAll:function(){try{setMethod('lebail')}catch(e){}[updateParamCount,initParamGrid,drawTCHZ,updateRfactors,drawRwpHistory,drawScattering,updateWrongAtom,drawInstrPeak,drawTree,buildChecklist,drawBragg,drawCubicTable].forEach(function(f){try{f()}catch(e){console.error(f.name,e)}})}};\n})();\n<\/script>\n<style>\ndetails.lab-disclosure{border:1px solid var(--border,#ccc);border-radius:8px;padding:12px;margin:10px 0}details.lab-disclosure>summary{cursor:pointer;font-weight:600}details.lab-disclosure>div{padding-top:12px}.collapsible:not(.open)>.card-body{display:none!important}\n<\/style><script>\nwindow.addEventListener('load',function(){\n document.querySelectorAll('.collapsible').forEach(function(c){c.classList.remove('open');});\n document.querySelectorAll('details').forEach(function(d){d.open=false;});\n document.querySelectorAll('.card:not(.collapsible)').forEach(function(c){\n const h=c.querySelector('h2,h3,.card-hdr');if(!h||h.querySelector('button,input,select'))return;\n const d=document.createElement('details'),sm=document.createElement('summary'),bd=document.createElement('div');\n d.className=c.className+' lab-disclosure';sm.textContent=h.textContent;\n Array.from(c.childNodes).forEach(function(n){if(n!==h&&!n.contains?.(h))bd.appendChild(n);});d.append(sm,bd);c.replaceWith(d);\n d.addEventListener('toggle',function(){if(d.open)window.dispatchEvent(new Event('resize'));});\n });\n});\n<\/script><\/body>\n<\/html>\n\n<\/body><\/html>";

r your crystallographer, wherever you work. Fill in the details, preview your document and save it as a PDF to share with your chosen laboratory.</p></div><aside class=\"ticket\"><span class=\"brand\">Your sample’s next chapter</span><strong>From crystal<br>to clarity.</strong><small>SCXRD request<br>One sample. One scientific story.</small></aside></header>\n<div class=\"route\"><b>01 Researcher</b><span>02 Question</span><span>03 Sample</span><span>04 Handling</span><span>05 Measurement</span><span>06 Reference</span><span>07 Clues</span></div>\n<p class=\"hint\">Fields marked * are required. Unknown information is welcome: say what needs clarification. Please agree sample acceptance before delivery.</p>\n<form id=\"request\">\n<details class=\"section\" open><summary><span class=\"num\">01</span><span><strong>Meet the researcher</strong><small>Who should hear the crystal’s story?</small></span><span class=\"plus\" aria-hidden=\"true\">+</span></summary><div class=\"fields\"><label>Your name <span aria-label=required>*</span><input type=\"text\" name=\"Researcher\" required placeholder=\"\" ></label><label>Email address <span aria-label=required>*</span><input type=\"email\" name=\"email\" required placeholder=\"\" ></label><label>University / company <span aria-label=required>*</span><input type=\"text\" name=\"Organisation\" required placeholder=\"\" ></label><label>Group leader / supervisor<input type=\"text\" name=\"Supervisor\"  placeholder=\"\" ></label><label>Phone, including country code<input type=\"tel\" name=\"Phone\"  placeholder=\"\" ></label><label>Project name or reference<input type=\"text\" name=\"Project\"  placeholder=\"\" ></label></div></details><details class=\"section\" ><summary><span class=\"num\">02</span><span><strong>The question behind the crystal</strong><small>What would you like to discover?</small></span><span class=\"plus\" aria-hidden=\"true\">+</span></summary><div class=\"fields\"><label>Main request <span aria-label=required>*</span><select name=\"Requested_service\" required><option value=\"\">Choose an option</option><option>Complete structure determination and refinement</option><option>Unit-cell determination / screening</option><option>Data collection only</option><option>Absolute-structure / configuration assessment</option><option>Relative stereochemistry</option><option>Polymorph or identity comparison</option><option>Advice first / not sure</option><option>Other request</option></select></label><label>Timing <span aria-label=required>*</span><select name=\"Timing\" required><option value=\"\">Choose an option</option><option>Standard scheduling</option><option>Time-sensitive: explain below</option><option>Flexible / exploratory</option></select></label><label class=\"wide\">Scientific question *<textarea name=\"Scientific_question\" rows=\"3\" placeholder=\"What decision will these results help you make?\" required></textarea></label><label>Preferred completion date, if relevant<input type=\"date\" name=\"Preferred_date\"  placeholder=\"\" ></label><label>Data use<select name=\"Intended_use\" ><option value=\"\">Choose an option</option><option>Research / publication</option><option>Student project / teaching</option><option>Industrial R&amp;D</option><option>Other / discuss</option></select></label><label class=\"wide\">Timing or special requirements<textarea name=\"Special_requirements\" rows=\"3\" placeholder=\"A requested date is not a confirmed booking.\" ></textarea></label></div></details><details class=\"section\" ><summary><span class=\"num\">03</span><span><strong>A passport for your sample</strong><small>One form per sample. Give it a memorable code.</small></span><span class=\"plus\" aria-hidden=\"true\">+</span></summary><div class=\"fields\"><label>Sample code <span aria-label=required>*</span><input type=\"text\" name=\"Sample_code\" required placeholder=\"e.g. SK-042-blue\" ></label><label>Proposed molecular formula<input type=\"text\" name=\"Proposed_formula\"  placeholder=\"Use plain text, e.g. C14H12N2O2\" ></label><label>Compound name / identity, if known<input type=\"text\" name=\"Proposed_identity\"  placeholder=\"\" ></label><label>Material class <span aria-label=required>*</span><select name=\"Material_class\" required><option value=\"\">Choose an option</option><option>Organic / pharmaceutical</option><option>Coordination compound / organometallic</option><option>Inorganic / mineral</option><option>Metal–organic framework</option><option>Protein / macromolecule</option><option>Unknown / other</option></select></label><label>Crystal appearance<select name=\"Crystal_habit\" ><option value=\"\">Choose an option</option><option>Block / prism</option><option>Needle</option><option>Plate</option><option>Irregular fragment</option><option>Mixed shapes</option><option>Not yet examined</option></select></label><label>Colour<select name=\"Colour\" ><option value=\"\">Choose an option</option><option>Colourless</option><option>White / opaque</option><option>Yellow / orange</option><option>Red / pink</option><option>Blue / purple</option><option>Green</option><option>Brown / black</option><option>Other</option></select></label><label>Approximate dimensions, mm (optional)<input type=\"text\" name=\"Crystal_dimensions\"  placeholder=\"length × width × thickness\" ></label><label>Amount / number of crystals available<input type=\"text\" name=\"Amount_available\"  placeholder=\"\" ></label><label class=\"wide\">Crystallisation method and mother liquor<textarea name=\"Crystallisation_details\" rows=\"3\" placeholder=\"Cooling, evaporation, diffusion, slurry, melt… Include mother liquor composition.\" ></textarea></label><label class=\"wide\">All solvents the sample has contacted *<textarea name=\"Solvent_history\" rows=\"3\" placeholder=\"Include crystallisation, washing and storage solvents.\" required></textarea></label><fieldset class=\"wide choices\"><legend>Supporting analyses already available</legend><label><input type=\"checkbox\" name=\"Supporting_analyses\" value=\"NMR\"> NMR</label><label><input type=\"checkbox\" name=\"Supporting_analyses\" value=\"IR / Raman\"> IR / Raman</label><label><input type=\"checkbox\" name=\"Supporting_analyses\" value=\"Mass spectrometry\"> Mass spectrometry</label><label><input type=\"checkbox\" name=\"Supporting_analyses\" value=\"Elemental analysis\"> Elemental analysis</label><label><input type=\"checkbox\" name=\"Supporting_analyses\" value=\"PXRD\"> PXRD</label><label><input type=\"checkbox\" name=\"Supporting_analyses\" value=\"DSC / TGA\"> DSC / TGA</label><label><input type=\"checkbox\" name=\"Supporting_analyses\" value=\"Other\"> Other</label></fieldset><label class=\"wide\">Expected components, counterions and possible byproducts<textarea name=\"Composition_notes\" rows=\"3\" placeholder=\"Include known solvate / hydrate possibilities and possible mixtures.\" ></textarea></label></div></details><details class=\"section\" ><summary><span class=\"num\">04</span><span><strong>Handle with knowledge</strong><small>Tell us what the crystal needs before it travels.</small></span><span class=\"plus\" aria-hidden=\"true\">+</span></summary><div class=\"fields\"><label>Air sensitivity <span aria-label=required>*</span><select name=\"Air_sensitivity\" required><option value=\"\">Choose an option</option><option>Stable in air</option><option>Air sensitive</option><option>Unknown</option></select></label><label>Moisture sensitivity <span aria-label=required>*</span><select name=\"Moisture_sensitivity\" required><option value=\"\">Choose an option</option><option>Moisture stable</option><option>Moisture sensitive</option><option>Unknown</option></select></label><label>Temperature / storage <span aria-label=required>*</span><select name=\"Storage\" required><option value=\"\">Choose an option</option><option>Room temperature</option><option>Refrigerated</option><option>Frozen</option><option>Other controlled temperature</option><option>Unknown / discuss</option></select></label><label>Solvent loss <span aria-label=required>*</span><select name=\"Solvent_loss\" required><option value=\"\">Choose an option</option><option>Stable outside mother liquor</option><option>May lose solvent / needs mother liquor</option><option>Unknown</option></select></label><label>Hazard information <span aria-label=required>*</span><select name=\"Hazard_status\" required><option value=\"\">Choose an option</option><option>Known hazards: details provided below</option><option>No known hazards after assessment</option><option>Hazards not established: advice required</option></select></label><label>Sample location <span aria-label=required>*</span><select name=\"Sample_location\" required><option value=\"\">Choose an option</option><option>Retained in my laboratory pending arrangements</option><option>Ready for agreed delivery</option><option>Already supplied by prior arrangement</option></select></label><label class=\"wide\">Hazards, storage and handling instructions *<textarea name=\"Handling_instructions\" rows=\"3\" placeholder=\"List known chemical, biological, radiological or other hazards. Explain any unknowns. State safe storage and transport needs.\" required></textarea></label><label>Return preference <span aria-label=required>*</span><select name=\"Sample_return\" required><option value=\"\">Choose an option</option><option>Return requested: discuss arrangements</option><option>No return needed: agree disposal arrangements</option><option>Discuss first</option></select></label><label class=\"wide\">Additional handling notes<textarea name=\"Handling_notes\" rows=\"3\" placeholder=\"Please agree acceptance and delivery before sending physical material.\" ></textarea></label></div></details><details class=\"section\"><summary><span class=\"num\">05</span><span><strong>Plan the measurement</strong><small>Your preferences, confirmed by the crystallographer.</small></span><span class=\"plus\" aria-hidden=\"true\">+</span></summary><div class=\"fields\"><label>Preferred radiation<select name=\"Requested_radiation\"><option value=\"\">No preference / discuss</option><option>Cu Kα</option><option>Mo Kα</option><option>Ag Kα</option><option>Other: explain below</option></select></label><label>Preferred collection temperature<select name=\"Requested_temperature\"><option value=\"\">No preference / discuss</option><option>100 K</option><option>150 K</option><option>200 K</option><option>250 K</option><option>293 K</option><option>298 K</option><option>Room temperature (actual K to be recorded)</option><option>Other temperature / series</option></select></label><label>Other temperature or series, K<input name=\"Other_temperature\" placeholder=\"e.g. 120 K, or 100 / 200 / 300 K\"></label><label>Absolute-structure assessment needed?<select name=\"Absolute_structure_request\"><option value=\"\">No preference / discuss</option><option>Yes: known enantiopure sample</option><option>Yes: assess absolute structure / inversion twinning</option><option>Relative stereochemistry only</option><option>No</option><option>Not sure</option></select></label><label>Further collections if needed<select name=\"Additional_collections\"><option value=\"\">No preference / discuss</option><option>Please contact me before any additional collection</option><option>Additional collections authorised within agreed scope</option><option>Single dataset only</option></select></label><label>Account / purchase-order reference, if applicable<input name=\"Account_reference\" ></label><label class=\"wide\">Measurement rationale or restrictions<textarea name=\"Measurement_notes\" rows=\"3\" placeholder=\"Explain wavelength or temperature needs, known phase transitions or required atom numbering.\"></textarea></label><p class=\"wide hint\">These are requested conditions, not measured values. The final CIF must use the actual radiation, wavelength and collection temperature.</p></div></details><details class=\"section\"><summary><span class=\"num\">06</span><span><strong>A crystal with a backstory</strong><small>Optional reference data for repeat measurements.</small></span><span class=\"plus\" aria-hidden=\"true\">+</span></summary><div class=\"fields\"><label>Is this a known structure / repeat sample?<select name=\"Known_structure\"><option value=\"\">No preference / discuss</option><option>New structure / no reference available</option><option>Known structure: repeat collection</option><option>Known unit cell only</option><option>Possible match: needs confirmation</option></select></label><label>Reference DOI, CCDC / ICSD code or previous sample code<input name=\"Structure_reference\" ></label><label>Reference crystal system<select name=\"Reference_crystal_system\"><option value=\"\">No preference / discuss</option><option>Triclinic</option><option>Monoclinic</option><option>Orthorhombic</option><option>Tetragonal</option><option>Trigonal</option><option>Hexagonal</option><option>Cubic</option><option>Unknown</option></select></label><label>Reference space group, including setting<input name=\"Reference_space_group\" placeholder=\"e.g. P 21/c, unique axis b\"></label><label>a / Å<input name=\"Reference_cell_a\" inputmode=\"decimal\" placeholder=\"10.123(4)\"></label><label>b / Å<input name=\"Reference_cell_b\" inputmode=\"decimal\" placeholder=\"12.456(5)\"></label><label>c / Å<input name=\"Reference_cell_c\" inputmode=\"decimal\" placeholder=\"15.789(6)\"></label><label>α / degrees<input name=\"Reference_cell_alpha\" inputmode=\"decimal\" placeholder=\"90\"></label><label>β / degrees<input name=\"Reference_cell_beta\" inputmode=\"decimal\" placeholder=\"103.45(2)\"></label><label>γ / degrees<input name=\"Reference_cell_gamma\" inputmode=\"decimal\" placeholder=\"90\"></label><label>Reference cell temperature / K<input name=\"Reference_cell_temperature\" inputmode=\"decimal\" placeholder=\"e.g. 100(2)\"></label><label>Reference Z, if known<input name=\"Reference_Z\" type=\"number\" min=\"1\" step=\"1\"></label><label>Reference CIF (optional)<input name=\"attachment_reference\" type=\"file\" accept=\".cif,text/plain\"></label><label class=\"wide\">Reference notes / expected differences<textarea name=\"Reference_notes\" rows=\"3\" placeholder=\"Reference conditions, suspected polymorph, isotopic change, repeat sample details…\"></textarea></label><p class=\"wide hint\">Enter only known reference values. Leave unknowns blank; do not assume 90° angles. Values such as 10.123(4) are accepted. Reference cells are exported in a separate CIF block and must not replace newly measured values.</p></div></details><details class=\"section\" ><summary><span class=\"num\">07</span><span><strong>Add the clues</strong><small>A structure sketch and safety information help.</small></span><span class=\"plus\" aria-hidden=\"true\">+</span></summary><div class=\"fields\"><p class=\"wide hint\">Supporting files: PDF, PNG or JPEG; the reference field also accepts CIF. Selected file names will appear in your PDF. The original supporting files must be supplied separately to your crystallographer.</p><label>Proposed structure / reaction / crystal photo<input type=\"file\" name=\"attachment\"  placeholder=\"\" accept=\".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg\"></label><label>Safety data sheet / risk information<input type=\"file\" name=\"attachment_safety\"  placeholder=\"\" accept=\".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg\"></label><label class=\"wide\">Links to additional supporting information<textarea name=\"Supporting_links\" rows=\"3\" placeholder=\"Optional. Use links you are authorised to share.\" ></textarea></label><label class=\"wide\">Anything else we should know?<textarea name=\"Additional_notes\" rows=\"3\" placeholder=\"\" ></textarea></label></div></details>\n<section class=\"review\"><h2>Review and export</h2><p class=\"hint\" id=\"progress\" aria-live=\"polite\">Complete the required fields, then review your request.</p><div class=\"buttons\"><button type=\"button\" id=\"previewpdf\">Preview / Save as PDF</button><button type=\"button\" class=\"secondary\" id=\"review\">Quick review</button><button type=\"button\" class=\"secondary\" id=\"download\">Save a text copy</button><button type=\"button\" class=\"secondary\" id=\"downloadcif\">Download CIF metadata</button></div><details id=\"summary\" hidden><summary>Review your request</summary><dl id=\"reviewdata\"></dl></details>\n<label class=\"consent\"><input type=\"checkbox\" name=\"Submission_confirmation\" value=\"Confirmed\" required><span>I have checked the information and included all known sample hazards and handling requirements.</span></label>\n<p class=\"hint\">CIF export separates requested conditions from reference-cell values. It is a metadata starting point, not a validated structure CIF.</p><p class=\"privacy\">Your entries stay in this page. This tool does not send a request, upload attachments or store your entries after the page is closed. Save your PDF before leaving, then share it with your crystallographer through your agreed channel.</p>\n<div id=\"status\" role=\"status\" aria-live=\"polite\"></div><p class=\"hint\" style=\"margin-top:12px\">Preview your document, choose Print / Save as PDF, then send the saved PDF to your chosen crystallographer. Agree sample acceptance and delivery separately.</p></section></form>\n<footer>Crystal Post · A sample-request PDF builder for the worldwide single-crystal diffraction community.<br>Collection strategy, instrument settings, unit-cell results and refinement records are completed later by the crystallographer.</footer>\n</main><section id=\"pdfpreview\" hidden aria-label=\"Submission document preview\"><div class=\"preview-toolbar\"><button type=\"button\" id=\"editrequest\">Back to edit</button><button type=\"button\" id=\"printrequest\">Print / Save as PDF</button><p>Choose “Save as PDF” in your browser’s print destination. Uploaded files are listed by name and must be supplied separately. Nothing is emailed by previewing or printing.</p></div><article class=\"pdf-document\" id=\"pdfdocument\"></article><div role=\"status\" aria-live=\"polite\" id=\"printstatus\"></div></section><script>\nconst form=document.getElementById('request'),status=document.getElementById('status');\nconst fields=()=>Array.from(form.elements).filter(e=>e.name&&!e.name.startsWith('_')&&e.type!=='hidden'&&e.type!=='submit');\nfunction entries(){const out=[];for(const e of fields()){if(e.type==='checkbox'&&!e.checked)continue;const val=e.type==='file'?Array.from(e.files).map(f=>f.name).join(', '):e.value;if(val)out.push([e.name.replaceAll('_',' '),val]);}return out;}\nfunction fileOK(){return true;}\nfunction revealInvalid(e){e.target.closest('details')?.setAttribute('open','');}\nform.addEventListener('invalid',revealInvalid,true);\nform.addEventListener('input',()=>{const req=fields().filter(e=>e.required),valid=req.filter(e=>e.checkValidity()).length;document.getElementById('progress').textContent=valid+' of '+req.length+' required fields complete.';});\ndocument.getElementById('review').onclick=()=>{status.textContent='';const dl=document.getElementById('reviewdata');dl.replaceChildren();for(const [key,val] of entries()){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=val;dl.append(dt,dd);}const details=document.getElementById('summary');details.hidden=false;details.open=true;details.scrollIntoView({behavior:'smooth',block:'start'});fileOK();};\ndocument.getElementById('download').onclick=()=>{const data='CRYSTAL POST / SCXRD REQUEST\\nLocal copy only. This file is not proof of submission.\\n\\n'+entries().map(([k,v])=>k+': '+v).join('\\n\\n');const u=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='crystal-request.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};\n\nfunction cifText(value){return '\\n;\\n'+String(value||'Unknown').replace(/\\r\\n?/g,'\\n').replace(/^;/gm,' ;')+'\\n;\\n';}\nfunction cifNumber(value){return value&&/^\\d+(?:\\.\\d+)?(?:\\(\\d+\\))?$/.test(value.trim())?value.trim():'?';}\nfunction cifExport(){\n const v=n=>form.elements[n]?.value.trim()||'';\n let out='#\\\\#CIF_2.0\\n# Crystal Post submission metadata. UTF-8 CIF 2.0.\\n# Requests and reference values only. Not a validated experimental CIF.\\ndata_submission_request\\n_audit_creation_method'+cifText('Crystal Post researcher submission. All supplied chemical identities are proposed; collection conditions are requests.')+'\\n_chemical_compound_source'+cifText(v('Organisation'))+'\\n_chemical_formula_sum'+(v('Proposed_formula')?cifText(v('Proposed_formula')):' ?\\n')+'\\n_exptl_special_details'+cifText(entries().map(([k,val])=>k+': '+val).join('\\n'));\n out+='\\n# ACTUAL COLLECTION VALUES: complete only after measurement.\\n_diffrn_radiation_type ?\\n_diffrn_radiation_wavelength ?\\n_diffrn_ambient_temperature ?\\n';\n if(v('Known_structure')&&v('Known_structure')!=='New structure / no reference available'){\n out+='\\ndata_reference_cell\\n_audit_creation_method'+cifText('USER-SUPPLIED REFERENCE ONLY. This block is not a new measurement. Reference: '+v('Structure_reference'));\n const tags={Reference_cell_a:'_cell_length_a',Reference_cell_b:'_cell_length_b',Reference_cell_c:'_cell_length_c',Reference_cell_alpha:'_cell_angle_alpha',Reference_cell_beta:'_cell_angle_beta',Reference_cell_gamma:'_cell_angle_gamma',Reference_cell_temperature:'_cell_measurement_temperature',Reference_Z:'_cell_formula_units_Z'};\n for(const [name,tag] of Object.entries(tags))out+='\\n'+tag+' '+cifNumber(v(name))+'\\n';\n out+='\\n_space_group_name_H-M_alt'+(v('Reference_space_group')?cifText(v('Reference_space_group')):' ?\\n');\n out+='\\n_exptl_special_details'+cifText('Reference cell, not measured for this submission. '+v('Reference_notes'));\n }\n return out;\n}\nfunction cellOK(){\n for(const n of ['Reference_cell_a','Reference_cell_b','Reference_cell_c','Reference_cell_alpha','Reference_cell_beta','Reference_cell_gamma','Reference_cell_temperature']){\n const el=form.elements[n],value=el.value.trim();el.setCustomValidity('');if(!value)continue;\n const num=parseFloat(value);\n if(!/^\\d+(?:\\.\\d+)?(?:\\(\\d+\\))?$/.test(value)||num<=0||(n.match(/alpha|beta|gamma/)&&num>=180)){\n el.setCustomValidity('Enter a positive number, optionally with uncertainty, e.g. 10.123(4). Angles must be between 0 and 180 degrees.');el.closest('details').open=true;el.reportValidity();return false;}\n }return true;\n}\ndocument.getElementById('downloadcif').onclick=()=>{if(!cellOK())return;const url=URL.createObjectURL(new Blob([cifExport()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=(form.elements.Sample_code.value.replace(/[^a-zA-Z0-9_-]/g,'_')||'sample')+'_submission_metadata.cif';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};\nform.addEventListener('input',e=>{if(e.target.name.startsWith('Reference_'))e.target.setCustomValidity('');});\n\nform.addEventListener('submit',e=>{e.preventDefault();previewDocument();});\n\nlet previewTitle=document.title;\nfunction fieldLabel(el){\n const wrap=el.closest('label');if(!wrap)return el.name.replaceAll('_',' ');\n const copy=wrap.cloneNode(true);copy.querySelectorAll('input,select,textarea').forEach(n=>n.remove());return copy.textContent.replace(/\\*/g,'').trim();\n}\nfunction previewDocument(){\n if(!cellOK())return;\n const doc=document.getElementById('pdfdocument');doc.replaceChildren();\n const add=(tag,txt,parent=doc,cls='')=>{const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;parent.append(n);return n;};\n add('div','Crystal Post / Diffraction Lab',doc,'pdf-top');add('h1','Single-crystal X-ray diffraction request');\n const sample=form.elements.Sample_code.value.trim()||'Sample code not provided';\n const now=new Date();const req=fields().filter(e=>e.required);const missing=req.filter(e=>!e.validity.valid);\n add('div','Sample: '+sample+'\\nPrepared: '+now.toLocaleString('en-GB')+'\\nDocument status: '+(missing.length?'Draft / '+missing.length+' required field(s) incomplete':'Required fields complete / ready to share'),doc,'pdf-meta').style.whiteSpace='pre-wrap';\n if(missing.length)add('div','Draft: complete missing required information before sending this request.',doc,'draft-note');\n for(const section of form.querySelectorAll('details.section')){\n  const sec=document.createElement('section');sec.className='pdf-section';doc.append(sec);add('h2',section.querySelector('summary strong').textContent,sec);\n  const dl=document.createElement('dl');sec.append(dl);const seen=new Set();\n  for(const el of section.querySelectorAll('input[name],select[name],textarea[name]')){\n   if(el.type==='hidden'||el.name.startsWith('_')||seen.has(el.name))continue;seen.add(el.name);\n   let val,label;\n   if(el.type==='checkbox'){\n    const set=Array.from(section.querySelectorAll('input[type=checkbox]')).filter(x=>x.name===el.name);val=set.filter(x=>x.checked).map(x=>x.value).join(', ')||'Not specified';label=el.closest('fieldset')?.querySelector('legend')?.textContent||fieldLabel(el);\n   }else{label=fieldLabel(el);val=el.type==='file'?(Array.from(el.files).map(x=>x.name).join(', ')||'No file selected'):el.value.trim()||'Not provided';}\n   const row=document.createElement('div');row.className='pdf-row';dl.append(row);add('dt',label,row);add('dd',val,row);\n  }\n }\n const confirmation=form.querySelector('[name=\"Submission_confirmation\"]');\n add('p','Submitter confirmation: '+(confirmation.checked?'Confirmed':'Not yet confirmed')+'.\\nRequested radiation and temperature are preferences. Known cell parameters are reference information, not new measurements.\\nAttachments are not embedded in this document. Supply original files separately.\\nPrepared locally for the researcher to share with their chosen crystallographer. This document does not confirm sample acceptance or a booking.',doc,'pdf-note').style.whiteSpace='pre-wrap';\n const frame=document.getElementById('pdfpreview');frame.hidden=false;document.body.classList.add('preview-mode');\n previewTitle=document.title;document.title=(sample.replace(/[^a-zA-Z0-9_-]/g,'_')||'Sample')+'_SCXRD_request';\n window.scrollTo({top:0});document.getElementById('editrequest').focus();\n}\ndocument.getElementById('previewpdf').onclick=previewDocument;\ndocument.getElementById('editrequest').onclick=()=>{document.body.classList.remove('preview-mode');document.getElementById('pdfpreview').hidden=true;document.title=previewTitle;document.getElementById('previewpdf').focus();};\ndocument.getElementById('printrequest').onclick=()=>{document.getElementById('printstatus').textContent='Choose Save as PDF in the print dialog, or select your printer.';window.print();};\n<\/script></body></html>";

function wireExFinder() {

      const open = TFS.open.has(i.n), hl = q.f.includes(i.n) ? 'hl' : q.a.includes(i.n) ? 'hl2' : '';
      return `<button class="card icard ${hl}" data-id="${i.n}" aria-pressed="${open}"><span class="eyebrow">#${i.n} · ${EXGRPN[i.g]}</span><b>${i.name}</b><span class="small">${i.line}</span>${open ? `<ul class="small">${i.doc.map(x => `<li class="d">${x}</li>`).join('')}${i.pot.map(x => `<li class="p">${x}</li>`).join('')}</ul>` : ''}</button>`;
