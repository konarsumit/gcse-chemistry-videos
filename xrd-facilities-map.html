<style>
/* Layout: a title band, a view switcher with search, then map and list side by side on wide screens, stacked on phones. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#102A3C; --muted:#54656F; --line:#D5DDE3;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1A24; --surface:#13242F; --ink:#E5EEF3; --muted:#9DB0BC; --line:#26394A;
  --land:#1C3042; --acc:#38B6C4; --acc-ink:#06232A;
  --good:#3CC49A; --warn:#E3A33F; --slate:#8A9BA8;
  --syn:#74ABEA; --neu:#EE8B52; --xfel:#B994E3; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1A24; --surface:#13242F; --ink:#E5EEF3; --muted:#9DB0BC; --line:#26394A;
  --land:#1C3042; --acc:#38B6C4; --acc-ink:#06232A;
  --good:#3CC49A; --warn:#E3A33F; --slate:#8A9BA8;
  --syn:#74ABEA; --neu:#EE8B52; --xfel:#B994E3; color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;

.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--muted);max-width:68ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:600 .92rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}

.tab:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.search{flex:1 1 220px;min-width:0;display:flex;gap:8px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=search]{flex:1 1 auto}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:8px}
@media (max-width:900px){.mapbox{position:static}}
#map{width:100%;position:relative}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 4px 2px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid transparent}
.count{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px;min-width:0}
details.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
details.row[open]{border-color:var(--acc)}
details.row.sel{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start}
summary::-webkit-details-marker{display:none}
.nm{font-weight:600;overflow-wrap:anywhere}
.meta{grid-column:1;color:var(--muted);font-size:.88rem}
.badge{grid-row:1/3;grid-column:2;font:600 .75rem var(--f-body);padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;align-self:start}

.det{padding:2px 12px 12px;display:grid;gap:8px;font-size:.95rem}
.det dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.det dt{color:var(--muted);font-size:.85rem;padding-top:1px}
.det dd{margin:0;overflow-wrap:anywhere}

a{color:var(--acc)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.foot{color:var(--muted);font-size:.86rem;max-width:90ch}
.hoverTip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5;transform:translate(-50%,-130%)}
.datamaps-bubble{cursor:pointer}
</style>

<div class="wrap">
  <header>
    <h1>XRD Home</h1>
    <p class="sub">Where X-ray diffraction can be done in Sweden, and where the world's synchrotron and neutron sources are. Statuses come from each facility's own web page, read on 5 November 2026.</p>

    </section>
  </div>

  <p class="foot" id="foot"></p>
</div>

function visible(){
  var q=state.q.toLowerCase();
  return ROWS.filter(function(r){
    if(state.view==='se'){ if(!(r.group==='se' || r.country==='Sweden')) return false; }
    else if(state.view==='syn'){ if(r.group!=='syn') return false; }
    else if(state.view==='neu'){ if(r.group!=='neu') return false; }
    else { if(r.group==='se') return false; }
    if(state.sf && r.group==='se' && r.status!==state.sf) return false;

  d += '<dl>';
  if(r.what) d += '<dt>'+(r.group==='se'?'Equipment':'Notes')+'</dt><dd>'+esc(r.what)+'</dd>';
  if(r.access) d += '<dt>Access</dt><dd>'+esc(r.access)+'</dd>';
  if(r.contact) d += '<dt>Contact</dt><dd>'+esc(r.contact)+'</dd>';
  d += '<dt>Location</dt><dd><span class="chip">'+r.lat.toFixed(3)+', '+r.lon.toFixed(3)+'</span></dd>';
  if(r.url) d += '<dt>Source</dt><dd><a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.url.replace(/^https?:\/\//,'').slice(0,60))+'</a></dd>';
  d += '</dl>';
  return '<details class="row'+(state.sel===r.id?' sel':'')+'" id="r-'+r.id+'"'+(state.sel===r.id?' open':'')+' data-id="'+r.id+'">'
    +'<summary><span class="nm">'+esc(r.name)+'</span>'+badgeFor(r)+'<span class="meta">'+esc(meta)+'</span></summary>'
    +'<div class="det">'+d+'</div></details>';
}

function colorFor(r){
  if(r.group==='se') return r.status==='Confirmed'?cssv('--good'): r.status==='Partly confirmed'?cssv('--warn'): cssv('--slate');
  return r.key==='neu'?cssv('--neu'): r.key==='xfel'?cssv('--xfel'): cssv('--syn');
}

function renderList(){
  var v=visible();
  document.getElementById('count').textContent = v.length+(v.length===1?' result':' results');
  document.getElementById('rows').innerHTML = v.length ? '<div class="list">'+v.map(rowHtml).join('')+'</div>'
    : '<div class="empty">Nothing matches. Clear the search or choose another view.</div>';
  Array.prototype.forEach.call(document.querySelectorAll('details.row'), function(d){
    d.addEventListener('toggle', function(){ if(d.open){ state.sel=d.getAttribute('data-id'); drawBubbles(); } });
  });
  var lg='';
  if(state.view==='se'){
    lg = '<span><i class="dot" style="background:var(--good)"></i>Confirmed</span><span><i class="dot" style="background:var(--warn)"></i>Partly confirmed</span><span><i class="dot" style="background:var(--slate)"></i>Not confirmed or not yet checked</span><span><i class="dot" style="background:var(--syn)"></i>Synchrotron</span><span><i class="dot" style="background:var(--neu)"></i>Neutron</span>';
  } else {
    lg = '<span><i class="dot" style="background:var(--syn)"></i>Synchrotron</span><span><i class="dot" style="background:var(--xfel)"></i>X-ray free-electron laser</span><span><i class="dot" style="background:var(--neu)"></i>Neutron source</span><span><i class="dot" style="background:transparent;border-color:var(--ink)"></i>Under construction</span>';
  }
  document.getElementById('legend').innerHTML = lg;
  document.getElementById('foot').textContent = state.view==='se'
    ? 'Confirmed means the facility page lists X-ray diffraction instruments. Partly confirmed means diffraction is mentioned without instrument details. Not confirmed means no facility page was found. Not yet checked means the university has not been looked at. Karolinska Institutet, SLU and the smaller universities are in the list so the map is complete.'
    : 'Locations are approximate (site level). Facility lists are built from public encyclopedia lists and each facility’s own name; websites were not individually checked and beamline notes are examples, so confirm current status and access on the facility site before relying on them.';
}

var map=null;
function bubbleData(){
  var rank=function(r){ return r.group!=='se'?3 : r.status==='Confirmed'?2 : r.status==='Partly confirmed'?1 : 0; };
  var v=visible().slice().sort(function(a,b){ return rank(a)-rank(b); }), out=[];
  v.forEach(function(r){
    var isSel = state.sel===r.id;
    out.push({ id:r.id, name:r.name, latitude:r.lat, longitude:r.lon, radius: isSel? 11 : (state.view==='se'?7:5),
      fillColor: r.uc ? 'rgba(0,0,0,0)' : colorFor(r), borderColor: r.uc ? colorFor(r) : (isSel? cssv('--ink') : cssv('--surface')),
      borderWidth: r.uc ? 2 : (isSel?3:1.5), city:r.city, status:r.status });
  });
  return out;
}
function drawBubbles(){
  if(!map) return;
  var data=bubbleData();
  map.bubbles(data, { popupOnHover:false, highlightOnHover:false, fillOpacity:0.9 });
  d3.select('#map').selectAll('circle.datamaps-bubble')
    .style('fill', function(d){ return d.fillColor; })
    .style('stroke', function(d){ return d.borderColor; })
    .style('stroke-width', function(d){ return d.borderWidth+'px'; })
    .style('fill-opacity', 0.92);
  var tip=document.getElementById('tip');
  d3.select('#map').selectAll('circle.datamaps-bubble')
    .on('click', function(d){ pick(d.id); })
    .on('mouseover', function(d){
      if(!tip){ tip=document.createElement('div'); tip.id='tip'; tip.className='hoverTip'; document.getElementById('map').appendChild(tip); }
      var m=d3.mouse(document.getElementById('map')); tip.textContent=d.name; tip.style.left=m[0]+'px'; tip.style.top=m[1]+'px'; tip.hidden=false;
    })
    .on('mouseout', function(){ if(tip) tip.hidden=true; });
}
function pick(id){
  state.sel=id;
  var el=document.getElementById('r-'+id);
  if(!el){ renderList(); el=document.getElementById('r-'+id); }
  Array.prototype.forEach.call(document.querySelectorAll('details.row'), function(d){ d.classList.toggle('sel', d.id==='r-'+id); });
  if(el){ el.open=true; el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  drawBubbles();
}

function drawMap(){
  var el=document.getElementById('map'); el.innerHTML=''; map=null;
  var w=el.clientWidth || 600, h;
  var common={ element:el, fills:{defaultFill:cssv('--land')},
    geographyConfig:{ borderColor:cssv('--line'), borderWidth:0.6, highlightOnHover:false, popupOnHover:false },
    bubblesConfig:{ borderWidth:1.5, borderColor:cssv('--surface'), fillOpacity:0.9 } };
  try{
    if(state.view==='se'){
      h=Math.max(420, Math.min(640, Math.round(w*1.05))); el.style.height=h+'px';
      map=new DM_SWE(Object.assign({scope:'swe', height:h, width:w,
        setProjection:function(element){
          var yv=function(d){ var p=d*Math.PI/180; return Math.log(Math.tan(Math.PI/4+p/2)); };
          var s=(h*0.92)/(yv(69.2)-yv(55.2));
          var projection=d3.geo.mercator().center([16.2,62.2]).scale(s).translate([w/2,h/2]);
          return {path:d3.geo.path().projection(projection), projection:projection};
        }}, common));
    } else {
      h=Math.round(w*0.42); el.style.height=h+'px';
      map=new DM_WORLD(Object.assign({scope:'world', width:w, height:h,
        setProjection:function(element){
          var projection=d3.geo.equirectangular().scale(w/(2*Math.PI)).translate([w/2, h*0.6]).center([0,0]);
          return {path:d3.geo.path().projection(projection), projection:projection};
        }}, common));
    }
  }catch(e){ el.textContent='The map could not be drawn.'; return; }
  drawBubbles();
}

function renderHR(){
  var q=state.q.toLowerCase();
  var v=HR.filter(function(h){ return !q || (h.bl+' '+h.fac+' '+h.loc+' '+h.tech+' '+h.contact).toLowerCase().indexOf(q)>=0; });
  document.getElementById('count').textContent=v.length+(v.length===1?' beamline':' beamlines');
  document.getElementById('rows').innerHTML = v.map(function(h){
    var c = h.status==='Confirmed'?'b-good': h.status==='Partly confirmed'?'b-warn':'b-slate';
    var d='<dl><dt>Technique</dt><dd>'+esc(h.tech)+'</dd><dt>Energy</dt><dd>'+esc(h.en)+'</dd><dt>Contact</dt><dd>'+esc(h.contact)+'</dd><dt>Access</dt><dd>'+esc(h.access)+'</dd><dt>Deadlines</dt><dd>'+esc(h.dl)+'</dd>'
      +(h.src?'<dt>Source</dt><dd><a href="'+esc(h.src)+'" target="_blank" rel="noopener">'+esc(h.src.replace(/^https?:\/\//,'').slice(0,60))+'</a></dd>':'')+'</dl>';
    return '<details class="row"><summary><span class="nm">'+esc(h.fac+': '+h.bl)+'</span><span class="badge '+c+'">'+esc(h.status)+'</span><span class="meta">'+esc(h.loc)+'</span></summary><div class="det">'+d+'</div></details>';
  }).join('') || '<div class="empty">Nothing matches.</div>';
  document.getElementById('foot').textContent='Read from official facility pages on 5 November 2026. "Not verified" means I could not read it on an official page, so check before you rely on it. Emails are shown only where a page printed them. Proposal deadlines change, so confirm on the facility user office page.';
}
function setView(v){
  state.view=v; state.sel=null;
  ['se','syn','neu','hr','all'].forEach(function(k){ document.getElementById('t-'+k).setAttribute('aria-pressed', String(k===v)); });
  document.getElementById('sf').style.display = v==='se' ? '' : 'none';
  var hr=(v==='hr'); document.querySelector('.mapbox').style.display = hr?'none':''; document.querySelector('.main').style.gridTemplateColumns = hr?'minmax(0,1fr)':'';
  if(hr){ renderHR(); return; }
  if(v!=='se'){ state.sf=''; document.getElementById('sf').value=''; }
  renderList(); drawMap();
}
['se','syn','neu','hr','all'].forEach(function(k){ document.getElementById('t-'+k).addEventListener('click', function(){ setView(k); }); });
document.getElementById('q').addEventListener('input', function(e){ state.q=e.target.value; if(state.view==='hr'){renderHR();return;} renderList(); drawBubbles(); });
document.getElementById('sf').addEventListener('change', function(e){ state.sf=e.target.value; renderList(); drawBubbles(); });

var rt; window.addEventListener('resize', function(){ clearTimeout(rt); if(state.view!=='hr') rt=setTimeout(drawMap,200); });
if(window.matchMedia){ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ setTimeout(drawMap,50); }); }
new MutationObserver(function(){ setTimeout(drawMap,50); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

setView('se');
</script>

</body></html>
